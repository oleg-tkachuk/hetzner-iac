# zizmor configuration.
#
# Two audits are turned off here, each for a stated reason. Everything else
# runs, and the workflows are clean against it: actions are pinned to commit
# SHAs, checkouts drop their credentials, and no workflow input reaches a
# shell.
rules:
  artipacked:
    ignore:
      # semantic-release pushes the tag it creates, so this checkout genuinely
      # needs its credentials. Every other checkout in the repository sets
      # persist-credentials: false.
      - release.yaml

  self-repository:
    ignore:
      # zizmor suggests `$/...` in place of `./...` for local actions. The
      # `./` form demonstrably works — it is what CI runs today — and the
      # alternative could not be confirmed against GitHub's own documentation.
      # Swapping a working `uses:` for an unverified spelling would break every
      # job to satisfy a style finding. Revisit with a reference in hand.
      - ci.yaml
      - security.yaml
      - preview.yaml
