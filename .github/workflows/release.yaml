name: Release

on:
  push:
    branches: [main]
    paths:
      # The paths that make up a release. infra/** and layers/** are the Pulumi
      # entrypoints and are most of what ships here; omitting them would mean
      # no release ever triggers on the change that matters.
      - "infra/**"
      - "layers/**"
      - "pkg/**"
      - "tools/**"
      - "tasks/**"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yaml"
      - "release.config.cjs"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # semantic-release pushes the tag and the release notes; the issues and
      # pull-requests scopes are for its comment plugins. Scoped here rather
      # than at the workflow, so any job added later starts read-only.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      - uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # BOTH pins matter, and it is the PAIR that matters.
          #
          # An unpinned preset resolves to its current major on every run, so a
          # release that worked yesterday breaks on an upstream publish with no
          # commit of ours in between — and the failure reads as a missing
          # module rather than as a version mismatch.
          semantic_version: 25
          extra_plugins: |
            conventional-changelog-conventionalcommits@10.2.1
