name: Release

# Called by CI, never triggered on its own.
#
# A workflow of its own so that it shows as one: GitHub's workflow list is per
# FILE, and a job — which this was — can never appear there however it is
# named. Nothing about when it fires changes, because the trigger is
# workflow_call: CI still gates it with `needs:` and an `if:`, the release
# still cannot ship from a red pipeline, and it still reports inside CI's own
# run.
#
# workflow_call rather than workflow_run, and that is the whole point.
# workflow_run would give this file its own runs and its own count in that
# list, at the price of the guarantee: it fires AFTER CI rather than as part of
# it, carries full permissions, and its result never reaches the commit's check
# list. The reason the release is a job of CI is written where it is called.
on:
  workflow_call:

# Nothing at the top level. The one job below asks for what it needs, and the
# caller must already hold it — a called workflow cannot grant itself more than
# the workflow that called it.
permissions: {}

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # semantic-release pushes the tag and the release notes; the issues and
      # pull-requests scopes are for its comment plugins. Declared here as well
      # as at the call site: a callee's permissions can only narrow the
      # caller's, so stating them twice cannot widen anything and says what
      # this job actually uses.
      contents: write
      issues: write
      pull-requests: write
    steps:
      # No persist-credentials: false here — semantic-release pushes the tag it
      # creates, so this is the one checkout in the repository that genuinely
      # needs its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # BOTH pins matter, and it is the PAIR that matters.
          #
          # An unpinned preset resolves to its current major on every run, so a
          # release that worked yesterday breaks on an upstream publish with no
          # commit of ours in between — and the failure reads as a missing
          # module rather than as a version mismatch.
          semantic_version: 25
          extra_plugins: |
            conventional-changelog-conventionalcommits@10.2.1
