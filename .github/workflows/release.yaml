name: Release

# Dispatched by CI once every check on main has passed.
#
# THREE SHAPES, AND THE REASON FOR THIS ONE. It began as a workflow on `push`,
# which ran in parallel with the checks — v1.0.2 was cut from a commit whose CI
# was failing. It became a `workflow_call` job of CI, which fixed that and cost
# something nobody noticed for days: a called workflow executes inside its
# caller, so GitHub attributed every release to CI and this file's page in the
# Actions tab stayed permanently empty. v4.3.0 came out of CI run 34824923755,
# where the job reads `Release / semantic-release` and this file appears only
# under that run's referenced_workflows.
#
# workflow_run is the obvious third answer and is not available: zizmor's
# dangerous-triggers audit refuses it categorically, and its documentation is
# explicit that no guard satisfies the audit — "checking github.repository is
# not effective on workflow_run, since a workflow_run always runs in the
# context of the target repository". Silencing a high finding to populate a
# page is not a trade this repository makes.
#
# repository_dispatch gets the run without either cost. GitHub's rule is that
# events triggered by GITHUB_TOKEN do not start new workflow runs — which is
# why pushing a tag from CI cannot chain a workflow, and why the usual advice
# is a long-lived PAT — and repository_dispatch is one of the two documented
# exceptions that "always create workflow runs". So CI dispatches this with its
# own GITHUB_TOKEN: no extra credential, no dangerous trigger, and a run of its
# own with a history.
#
# The gate stays where it always belonged. CI dispatches from a job that still
# carries `needs: [prime, security, build]` and the push-to-main `if:`, so a
# red pipeline never reaches this file.
#
# Deliberately no workflow_dispatch. It would let a maintainer release from an
# untested main with one click, which is precisely how v1.0.2 happened. The
# button is not worth re-opening that door.
on:
  repository_dispatch:
    types: [release]

# One release at a time. Two dispatches in quick succession would otherwise run
# semantic-release twice over the same history; the second waits for the first
# and then finds nothing new, or releases what came after it.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing at the top level. The job below asks for exactly what it needs.
#
# This mattered less under workflow_call, where the caller's grant was the
# ceiling anyway. Nothing narrows it now, so this empty default is the only
# thing keeping the rest of the file from inheriting write scope.
permissions: {}

jobs:
  semantic-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # semantic-release pushes the tag and the release notes; the issues and
      # pull-requests scopes are for its comment plugins. This is now the only
      # place they are granted — there is no caller above to narrow.
      contents: write
      issues: write
      pull-requests: write
    steps:
      # No persist-credentials: false here — semantic-release pushes the tag it
      # creates, so this is the one checkout in the repository that genuinely
      # needs its credentials.
      # Deliberately no `ref:`. A repository_dispatch run checks out the head of
      # the default branch, which is a BRANCH — and semantic-release has to be
      # on one of its configured release branches to release at all. Checking
      # out the dispatched sha would be more precise about which commit
      # triggered this and would leave a detached HEAD, where semantic-release
      # finds no release branch and does nothing. The sha is printed below
      # instead, which is what it was wanted for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      # Which commit and which CI run asked for this release. A dispatched run
      # is not linked to its trigger in the UI the way a workflow_run is, so
      # without this line the run says nothing about where it came from.
      - name: Say what dispatched this
        env:
          SHA: ${{ github.event.client_payload.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: |
          printf 'dispatched by CI run %s for commit %s\n' "${CI_RUN:-unknown}" "${SHA:-unknown}"

      # The checkout above is main's head NOW, which is not necessarily the
      # commit CI passed: a merge that lands between the dispatch and this
      # checkout would be tagged and released while its own CI is still
      # running, or red. So the release goes ahead only when main is still at
      # the dispatched commit. When it has moved on, the newer commit's CI
      # dispatches its own release once it passes, and that one carries this
      # commit's changes too — nothing is lost by stopping here.
      - name: Release only the commit CI passed
        id: passed
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ -n "${SHA}" ] && [ "${head}" = "${SHA}" ]; then
            printf 'current=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'main is at %s, not the dispatched %s; its own CI run releases it\n' "${head}" "${SHA:-unknown}"
            printf 'current=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.passed.outputs.current == 'true'
        uses: cycjimmy/semantic-release-action@1989a0fefc4aea321e07f717680ed8e345925dc1 # v7.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # BOTH pins matter, and it is the PAIR that matters.
          #
          # An unpinned preset resolves to its current major on every run, so a
          # release that worked yesterday breaks on an upstream publish with no
          # commit of ours in between — and the failure reads as a missing
          # module rather than as a version mismatch.
          #
          # The preset stays on 9.x. 10.x needs conventional-changelog-writer 9,
          # and release-notes-generator 14, the one semantic-release 25 ships,
          # brings writer 8: 10.2.1 rendered empty notes and 10.4.0 refuses
          # outright. The analyzer reads only the preset's parser and works
          # with either.
          semantic_version: 25
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
