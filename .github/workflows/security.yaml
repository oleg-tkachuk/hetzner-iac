name: Security

# A reusable workflow, called by CI and also run on its own schedule.
#
# gosec is not here, and the criterion below is why: its findings are a pure
# function of the code at a pinned version, so a scheduled run would report
# what the pull request already did. It lives in ci.yaml, beside the other
# checks that read one tree.
#
# The schedule is the reason this is a separate workflow rather than four more
# jobs in ci.yaml: a security finding appears without anyone touching the code.
# A CVE published today makes yesterday's green commit vulnerable, and a gate
# that only runs on push would never say so.
#
# Job names say what is asserted, never which tool asserts it: "Committed
# secrets", not "gitleaks". The tool shows up in the step and in the log, where
# a failure is already being read; the check list is read to see what is
# guarded. Renaming a job renames a required status check, so branch protection
# has to be updated in the same pass.

on:
  workflow_call:
    inputs:
      go-code:
        description: >
          Whether the caller's change can affect a Go analysis. The
          govulncheck job below is the slowest gate in CI — four minutes, of
          which three and a half are restoring the build cache it needs — and
          its answer is a function of the module and the advisory database,
          neither of which a documentation-only change touches.
        type: boolean
        required: false
        default: true
  workflow_dispatch:
  schedule:
    # Monday morning, before the week's work lands on top of whatever the
    # weekend's advisories turned up.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than latest: a scanner that changes version between runs
  # turns "CI went red and nothing changed" into a debugging session.
  GITLEAKS_VERSION: "8.30.1"
  # v1.1.4 panicked inside the SSA builder of the x/tools it vendors
  # (v0.29.0, early 2025) when analysing this module under Go 1.27:
  # "panic: unexpected expr: *ast.KeyValueExpr". A static-analysis tool has to
  # be at least as new as the toolchain it reads.
  GOVULNCHECK_VERSION: "v1.8.0"
  ZIZMOR_VERSION: "1.30.1"
  ACTIONLINT_VERSION: "v1.7.12"
  TRIVY_VERSION: "0.74.0"

jobs:
  # Every job installs the tool and then calls the SAME task an operator runs
  # locally, so the flags live in one place — the shared task library — rather
  # than being restated here and drifting.
  secrets:
    name: Committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # gitleaks scans the whole history, not the worktree: a credential
          # that was committed and then removed is still published.
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # No cache. The scan itself is two seconds; restoring the shared Go
          # build cache for it was three hundred, which made this job the gate
          # the whole expensive half of CI queued behind.
          cache-mode: "off"
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      # On a pull request, only its own commits. The history behind the base is
      # unchanged by definition, and scanning all of it took 286 seconds of
      # every pull request — long enough that it was the job the cache-priming
      # job queued behind.
      #
      # Nothing is lost: a credential added by this branch is in this range, a
      # credential already in the history is found by the scheduled run below,
      # and the pre-push hook scans what is staged before either.
      #
      # The range needs the base commit present, which is why the checkout
      # above still fetches everything — the clone is cheap, the scan was not.
      - run: task security:secrets
        env:
          GITLEAKS_FLAGS: >-
            ${{ github.event_name == 'pull_request'
                && format('--log-opts={0}..HEAD', github.event.pull_request.base.sha)
                || '' }}

  vulnerabilities:
    name: Reachable vulnerabilities
    # `!= false` rather than the plain input, and the difference matters: on a
    # schedule or a manual run there is no workflow_call, so `inputs` is empty
    # and the input reads as null. Plain truthiness would skip the very run
    # this workflow exists for — the one where the advisory database moved and
    # the code did not.
    if: inputs.go-code != false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # No cache, measured rather than assumed. govulncheck does compile
          # the module, so this was the one scanner with a real claim on the
          # shared cache — and the claim does not survive the numbers. Both
          # arms in one run, so they shared its runner conditions:
          #
          #             setup-go   go install   scan   total
          #   restore       206s          11s    11s    234s
          #   off            15s          31s    17s     70s
          #
          # The cache saves 26 seconds of work and costs 191 seconds of
          # restore. It is a 4.4 GB build cache for a tool that reads the
          # module graph and one package's call paths at a time.
          cache-mode: "off"
      - run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      # Reachability-based: it reports the vulnerabilities this code actually
      # calls, not every advisory touching the dependency tree.
      - run: task security:vuln

  filesystem:
    name: Dependencies and filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # No cache, for the same reason as the job above: trivy reads go.sum
          # and the filesystem, and nothing here compiles. 184 seconds of
          # restore for 15 seconds of scanning.
          cache-mode: "off"
      # The binary rather than the action: the action would run a scan of its
      # own whose result is then discarded, and the gate is the task below —
      # which carries the same flags an operator gets locally.
      - name: Install trivy
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" trivy
          echo "${RUNNER_TEMP}" >>"$GITHUB_PATH"
      - run: task security:trivy

  workflows:
    name: Workflow permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # These workflows are the part of the repository that runs with a token,
      # so they are worth auditing as code rather than trusted as config.
      # regular, not auditor: the auditor persona is documented as tolerating
      # false positives, which is the wrong contract for a blocking gate — it
      # would be red forever and then ignored. Exceptions live in
      # .github/zizmor.yml, each with the reason it stands.
      - run: pipx run "zizmor==${ZIZMOR_VERSION}" --config .github/zizmor.yml --persona=regular --format=plain .github/workflows/

  # actionlint is the other half of auditing these workflows, and the halves do
  # not overlap. zizmor covers security — unpinned actions, leaked credentials,
  # injectable expressions. actionlint covers whether the workflow is correct at
  # all: the schema, expression syntax, `needs:` naming a job that exists, and
  # shellcheck over every `run:` block.
  #
  # That last part is why it was added. This repository carries a few hundred
  # lines of shell inside YAML that no Go test and no linter was reading;
  # verified by introducing an unquoted variable on purpose and watching it
  # report SC2086.
  #
  # Its own job rather than a step beside zizmor, because renaming that job
  # would rename a required check, and a required check that never reports
  # again blocks every open pull request.
  syntax:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint"
