name: Security

# A reusable workflow, called by CI and also run on its own schedule.
#
# gosec is NOT here: golangci-lint already runs it over this code, in a job
# that finishes sooner because it loads the package graph once and runs every
# linter over it. Standalone gosec re-loads per package and cost fifteen
# minutes of every pipeline for the same findings. It runs nightly instead,
# where its own defaults still get a chance to say something.
#
# The schedule is the reason this is a separate workflow rather than four more
# jobs in ci.yaml: a security finding appears without anyone touching the code.
# A CVE published today makes yesterday's green commit vulnerable, and a gate
# that only runs on push would never say so.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Monday morning, before the week's work lands on top of whatever the
    # weekend's advisories turned up.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than latest: a scanner that changes version between runs
  # turns "CI went red and nothing changed" into a debugging session.
  GITLEAKS_VERSION: "8.30.1"
  # v1.1.4 panicked inside the SSA builder of the x/tools it vendors
  # (v0.29.0, early 2025) when analysing this module under Go 1.27:
  # "panic: unexpected expr: *ast.KeyValueExpr". A static-analysis tool has to
  # be at least as new as the toolchain it reads.
  GOVULNCHECK_VERSION: "v1.8.0"
  ZIZMOR_VERSION: "1.30.1"
  TRIVY_VERSION: "0.74.0"

jobs:
  # Every job installs the tool and then calls the SAME task an operator runs
  # locally, so the flags live in one place — the shared task library — rather
  # than being restated here and drifting.
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # gitleaks scans the whole history, not the worktree: a credential
          # that was committed and then removed is still published.
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: task security:secrets

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      # Reachability-based: it reports the vulnerabilities this code actually
      # calls, not every advisory touching the dependency tree.
      - run: task security:vuln

  filesystem:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The binary rather than the action: the action would run a scan of its
      # own whose result is then discarded, and the gate is the task below —
      # which carries the same flags an operator gets locally.
      - name: Install trivy
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" trivy
          echo "${RUNNER_TEMP}" >>"$GITHUB_PATH"
      - run: task security:trivy

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # These workflows are the part of the repository that runs with a token,
      # so they are worth auditing as code rather than trusted as config.
      # regular, not auditor: the auditor persona is documented as tolerating
      # false positives, which is the wrong contract for a blocking gate — it
      # would be red forever and then ignored. Exceptions live in
      # .github/zizmor.yml, each with the reason it stands.
      - run: pipx run "zizmor==${ZIZMOR_VERSION}" --config .github/zizmor.yml --persona=regular --format=plain .github/workflows/
