name: Renovate

# Renovate runs here, in this repository's own Actions, rather than as the
# hosted GitHub App. The app was not an option: installing it needs rights on
# the account that were not available, and dependency upgrades should not be
# blocked on that.
#
# Self-hosting costs one thing and buys one thing. The cost is a token, below.
# What it buys is that the whole configuration — cadence included — is in this
# repository, reviewable in a diff, with no third-party service holding state
# about when it last ran.
#
# Dependabot was the other alternative and does not fit: it handles gomod and
# github-actions natively but has no way to see a chart version pinned inside
# a Go source file, which is the entire reason this exists.

on:
  # The first pass, and any pass on demand. This replaces the trick of
  # temporarily deleting the schedule from renovate.json to make Renovate run
  # today rather than on Monday.
  workflow_dispatch:
    inputs:
      ignoreSchedule:
        description: "Ignore renovate.json's schedule and act now"
        type: boolean
        default: true
      dryRun:
        description: "Log what would happen and open nothing"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

  # A ticked checkbox on the Dependency Dashboard, acted on at once rather than
  # at the next cron.
  #
  # Ticking a box only records a REQUEST: Renovate fulfils it on its next run,
  # so without this the answer to "I ticked it and nothing happened" is "wait
  # up to a day". Measured: the tick was read correctly — the log
  # says "A user manually requested all awaiting schedule PRs via the
  # Dependency Dashboard" — and nothing had run since it was made.
  #
  # THE LOOP THIS HAS TO AVOID. Renovate rewrites that same issue on every
  # pass, with RENOVATE_TOKEN, which is a personal access token rather than
  # GITHUB_TOKEN — see "Require the token" below for why it has to be. Events
  # from a PAT do start workflow runs, so Renovate's own edit fires this
  # trigger and would run Renovate again, for ever.
  #
  # Filtering by actor cannot close that: the PAT acts as the person who owns
  # it, so Renovate's edit and a human's are the same sender. What separates
  # them is WHAT CHANGED — the guard step below proceeds only when a checkbox
  # carrying a Renovate marker went from unchecked to checked. Renovate
  # un-ticks after acting, so its own rewrite never adds one.
  issues:
    types: [edited]

  schedule:
    # Daily, 06:00 UTC — and the two schedules here are not a contradiction.
    #
    # This one decides how often Renovate *runs*. renovate.json's decides what
    # it is allowed to *do* when it runs: `* * * * 1` batches every update into
    # Monday. So six of seven passes find nothing to do, and that is the point:
    # GitHub runs scheduled workflows best-effort and one Monday pass was
    # observed 5h49m late. A weekly cron that slips is a week without updates;
    # a daily one only has to be on time once.
    #
    # It used to say security fixes arrive any morning because
    # vulnerabilityAlerts were exempt from the schedule. They are off now —
    # renovate.json says why — so there is no fast path here, and the ones that
    # report a vulnerability are Dependabot alerts on the repository,
    # govulncheck and trivy. A pass over this repository takes a couple of
    # minutes.
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: renovate
  # Never cancel a pass in flight. Renovate is not idempotent mid-run: killed
  # between creating a branch and opening its pull request, it leaves the
  # branch behind and the next pass has to reconcile it.
  cancel-in-progress: false

jobs:
  renovate:
    name: Dependency updates
    # The dashboard and nothing else, and only the bot's copy of it.
    #
    # The title alone was the guard, which is enough while the repository is
    # private and nothing once it is public: anyone can open an issue called
    # `Dependency Dashboard`, edit a ticked checkbox into it, and start a job
    # holding RENOVATE_TOKEN. The token is never printed and the issue body
    # reaches the shell through the environment rather than an expression, so
    # what that buys is a run nobody asked for rather than a credential — but
    # a stranger should not be able to start one at all.
    #
    # The author is the exact test, because Renovate opens the dashboard
    # itself. Every other issue edit in the repository leaves this asleep.
    if: >-
      github.event_name != 'issues' || (
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.issue.user.login == 'renovate[bot]'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The brake on the loop described at the top of this file.
      #
      # Both bodies reach the shell as environment variables rather than as
      # Actions expressions: they are issue text, so interpolating them into a
      # script is the template-injection hole zizmor exists to find.
      - name: A checkbox was newly ticked
        id: tick
        if: github.event_name == 'issues'
        env:
          BODY_BEFORE: ${{ github.event.changes.body.from }}
          BODY_AFTER: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          printf '%s' "${BODY_BEFORE}" > "${RUNNER_TEMP}/before.md"
          printf '%s' "${BODY_AFTER}"  > "${RUNNER_TEMP}/after.md"

          # A Renovate checkbox carries an HTML-comment marker, which is what
          # separates one from a stray checkbox in prose. Sorted, so the
          # comparison is by content and not by position: Renovate reorders the
          # list as updates come and go.
          ticked() { awk '/^ *- \[x\]/ && /<!--/ {print}' "$1" | sort; }

          added="$(comm -13 <(ticked "${RUNNER_TEMP}/before.md") \
                            <(ticked "${RUNNER_TEMP}/after.md") | awk 'NF')"

          if [ -z "${added}" ]; then
            printf '%s\n' "no Renovate checkbox was newly ticked — nothing to do"
            printf 'proceed=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          printf '%s\n' "newly ticked:"
          printf '%s\n' "${added}"
          printf 'proceed=true\n' >> "${GITHUB_OUTPUT}"

      # Fail with a sentence rather than with Renovate's own authentication
      # error, which names neither the secret nor the scopes.
      - name: Require the token
        if: github.event_name != 'issues' || steps.tick.outputs.proceed == 'true'
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RENOVATE_TOKEN}" ]; then
            printf '%s\n' "::error::the RENOVATE_TOKEN secret is not set"
            cat >&2 <<'EOF'
          Renovate needs a token of its own. GITHUB_TOKEN cannot be used here:
          a pull request opened with it does not trigger `pull_request`
          workflows, so CI would never run on an upgrade, no required check
          would ever report, and branch protection would block the merge for
          ever.

          Create a fine-grained personal access token scoped to this
          repository with:

            Contents        read and write
            Pull requests   read and write
            Issues          read and write   (the Dependency Dashboard)
            Workflows       read and write   (only to bump pinned actions)

          Not `Dependabot alerts`, because renovate.json turns
          `vulnerabilityAlerts` off. Granting it and turning them back on is
          one change, not two: without the permission Renovate logs `WARN:
          Cannot access vulnerability alerts` once per run and carries on, so
          the feature reads as configured and does nothing.

          Then: gh secret set RENOVATE_TOKEN
          EOF
            exit 1
          fi

      - uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        if: github.event_name != 'issues' || steps.tick.outputs.proceed == 'true'
        env:
          # Repo configuration still comes from .github/renovate.json. Only
          # the settings that cannot live there — which repository to act on,
          # and who to act as — are here.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # Commits are authored by the bot, not by a person who did not write
          # them. The address is GitHub's own no-reply for the app.
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
          # Renovate reads release notes from github.com to build pull request
          # bodies. The same token serves; without it, notes are omitted and
          # the requests are harder to review.
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # A manual run means "now", so it overrides the schedule in
          # renovate.json. Without this, dispatching on a Thursday would do
          # exactly nothing and look broken.
          RENOVATE_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ignoreSchedule) && '{"schedule":null}' || '' }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
