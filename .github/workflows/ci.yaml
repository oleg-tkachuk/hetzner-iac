name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. Rapid pushes to a branch would otherwise leave every earlier
# run grinding through a preview matrix nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than latest: a tool that changes version between runs turns
  # "CI went red and nothing changed" into a debugging session.
  #
  # It must also be BUILT with a Go at least as new as go.mod targets, or it
  # refuses to load the config: "the Go language version (go1.26) used to build
  # golangci-lint is lower than the targeted Go version (1.27.1)". 2.13.2 is
  # built with go1.27.
  GOLANGCI_VERSION: "v2.13.2"

jobs:
  # Decides whether this change touches anything that needs compiling.
  #
  # The heavy jobs still RUN and still report — they just skip their expensive
  # step. Gating the jobs themselves with `if:` would leave required checks
  # unreported on a docs-only PR, and branch protection would wait forever.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            # A push to main: always treat it as code, so the release path is
            # never gated on a diff computation.
            echo "code=true" >>"$GITHUB_OUTPUT"
            echo "push to main — running everything"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '\.go$|^go\.(mod|sum)$|^\.golangci\.yaml$'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
            echo "no Go files changed — the compiling jobs will report without compiling"
          fi

  # Compiles everything once, so the shared Go cache is saved by a job that has
  # actually built the tree.
  #
  # Without this the cache is whatever the FIRST job to finish happened to hold,
  # and its key is immutable: an early run whose jobs failed before touching Go
  # left a 31 MB cache that every later run restored and then rebuilt from
  # scratch. Priming makes the saved cache the useful one.
  prime:
    name: Prime the Go cache
    # Also needs security, which is the cheap half of the pipeline — nine to
    # thirty-five seconds. GitHub has no job-level fail-fast: a failing job does
    # not stop its siblings. Gating the priming job on the scanners means a
    # secret, a reachable vulnerability or a workflow finding stops the run
    # before anything compiles, instead of after ten minutes of it.
    #
    # Everything expensive already depends on prime, so this one edge gates all
    # of it.
    needs: [changes, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          # The one writer, and only on a push to main.
          #
          # A cache written on a pull request is scoped to refs/pull/N/merge:
          # no other branch can read it, and it lingers after the branch is
          # gone. Three of those at 789 MB each were already sitting against a
          # 10 GB repository limit, where eviction is least-recently-used and
          # would eventually take the main cache with them.
          #
          # Pull requests restore instead. They get main's cache under the same
          # key, which holds the dependency tree — the expensive part — so the
          # only thing given up is one push in a pull request reusing the
          # build of the push before it.
          cache-mode: ${{ github.event_name == 'push' && 'save' || 'restore' }}
      # No `if:` here, deliberately. This job exists to OWN the cache, and the
      # cache key is immutable — whoever saves first keeps it. Skipping the
      # build on a docs-only change saves an EMPTY cache under that key and
      # poisons it for every run afterwards, which is exactly the failure this
      # job was added to fix. It happened once already, in the run that
      # introduced the job.
      #
      # Against a warm cache this is a no-op and costs seconds; against a cold
      # one somebody has to pay the compile, and it should be the job whose
      # purpose is to pay it.
      - name: Build everything
        run: |
          set -euo pipefail
          go build ./...
          # Compiles every test binary without running a single test, which is
          # what the test and lint jobs then reuse.
          go test -run '^$' ./...
          go vet -tags e2e ./test/...

  # Guards the thing a Go build cannot see: that the layer list in the
  # Taskfile and the directories under layers/ still describe the same set.
  # They drift when a layer is renamed and one of the two is updated.
  layers:
    name: Layer list matches the tree
    # Pull requests only. A push to main has just been through this exact
    # tree on the pull request, and branch protection requires the branch to
    # be current with main before merging, so the rebased result is what was
    # tested. Re-running it on main adds no information and cost about fifteen
    # minutes of every merge.
    #
    # What DOES run on main is prime, because a cache written on a pull request
    # is scoped to refs/pull/N/merge and no other branch can read it — only the
    # default branch can seed a cache everything else restores. Plus the
    # scanners, which gate the release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          declared="$(task platform:layers --yes | sort)"
          onDisk="$(find layers -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          if [ "$declared" != "$onDisk" ]; then
            echo "Taskfile LAYERS and layers/ disagree:" >&2
            diff <(echo "$declared") <(echo "$onDisk") >&2 || true
            exit 1
          fi
          echo "$declared"

      # Exactly one job may write the shared Go cache.
      #
      # An Actions cache key is immutable, so whichever job saves first owns it
      # — and the job that compiles the tree is by definition slower than one
      # that does not. This went wrong twice: once a 31 MB cache from a run that
      # failed before touching Go, once an empty one from a prime job that
      # skipped its build. Both were restored by every later run, which then
      # rebuilt everything.
      #
      # A comment did not prevent the second occurrence, so this is a check.
      - name: One writer for the Go cache
        run: |
          set -euo pipefail
          # Matches the literal and the expression form alike — anything that
          # can evaluate to save. Anchored to the start of the line, or this
          # step counts the string inside its own source, which it did on the
          # first attempt.
          writers="$(grep -rnE '^[[:space:]]+cache-mode:.*save' .github/workflows/ || true)"
          count="$(printf '%s' "$writers" | grep -c . || true)"
          echo "writers:"
          printf '  %s\n' "${writers:-none}"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one job with cache-mode: save, found $count"
            echo "The key is immutable and the fastest saver wins it. More than one" >&2
            echo "writer is a race the priming job always loses; none means the"      >&2
            echo "cache is never populated at all."                                   >&2
            exit 1
          fi

  build:
    name: Build and test
    if: github.event_name == 'pull_request'
    needs: [changes, prime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # No separate `go build ./...`: `go test ./...` already compiles every
      # package, including those with no test files.
      - if: needs.changes.outputs.code == 'true'
        name: go test
        run: go test -count=1 ./...
      - if: needs.changes.outputs.code == 'true'
        name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - if: needs.changes.outputs.code == 'true'
        name: go vet
        run: go vet ./...
      # The e2e suite is behind a build tag, so `go test ./...` never compiles
      # it. Without this it rots unnoticed until someone tries to run it
      # against a cluster, which is the worst moment to find a type error.
      - if: needs.changes.outputs.code == 'true'
        name: type-check the e2e suite
        run: go vet -tags e2e ./test/...

  lint:
    name: golangci-lint
    if: github.event_name == 'pull_request'
    needs: [changes, prime]
    runs-on: ubuntu-latest
    # Above golangci's own --timeout, or the runner kills the job first and the
    # log says nothing useful.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - if: needs.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          # --fix=false: the config enables fix for local development, where it
          # is a convenience. In CI it would rewrite a read-only checkout and
          # hide the findings it repaired.
          args: --timeout=15m --fix=false

  charts:
    name: Chart pins
    if: github.event_name == 'pull_request'
    needs: [prime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # Enforces the pinning policy: exact versions, no floating tags.
      - run: go test -count=1 ./pkg/charts/
      # Renders every pinned chart and checks it still produces the workloads
      # pkg/workloads expects — the same table the e2e suite asserts against.
      # This is the gate that catches a chart rename in CI instead of at 3am.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Pinned to the version the check was verified against; `latest`
          # would let a Helm release change what CI renders with no commit of
          # ours in between.
          version: v4.3.0
      - name: Chart render check
        run: go run ./tools/render
      # Unlike the report below, this one fails. Renovate bumps Version and
      # cannot touch the AppVersion beside it, so its pull requests arrive with
      # an entry claiming a version the chart no longer ships — a misleading
      # comment for most charts, and a real defect for alloy, whose image tag
      # tools/alloyvalidate builds out of it.
      - name: App versions match the pinned charts
        run: go run ./tools/charts appversions
      # Read-only. Reports what is behind upstream without failing the build —
      # an upgrade is a decision with a changelog to read, and a gate that goes
      # red on every upstream release is a gate people switch off.
      - name: Report outdated pins
        continue-on-error: true
        run: go run ./tools/charts outdated

  topology:
    name: Cluster topology
    if: github.event_name == 'pull_request'
    needs: [prime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # Every committed topology must load, default and validate. A cluster
      # file that only fails at `pulumi up` has already cost an operator a
      # round trip.
      - run: go run ./tools/topology infra/cluster
      # Validate the machine-config patches against Talos itself. The talosctl
      # version is read from the topology rather than pinned here, because a
      # mismatched binary reports conflicts that will not happen on the cluster
      # being built.
      - name: Install the pinned talosctl
        run: |
          set -euo pipefail
          # Read through the real parser, not a grep: the first version of this
          # used `grep -A6` and broke the moment the comment above the field
          # grew, leaving the version empty and the download URL malformed.
          version="$(go run ./tools/topology talos-version infra/cluster/cluster.prod.yaml)"
          test -n "$version"
          curl -sSfL -o "${RUNNER_TEMP}/talosctl" \
            "https://github.com/siderolabs/talos/releases/download/${version}/talosctl-linux-amd64"
          chmod +x "${RUNNER_TEMP}/talosctl"
          echo "${RUNNER_TEMP}" >>"$GITHUB_PATH"
      - name: Talos machine config
        run: go run ./tools/talosvalidate infra/cluster
      # Docker is already on the runner, and Alloy is validated from the image
      # the pinned chart deploys rather than a binary that happens to be
      # installed.
      - name: Alloy collector config
        run: go run ./tools/alloyvalidate

  # Extracted into its own workflow so it can ALSO run on a schedule: a CVE
  # published today makes yesterday's green commit vulnerable, and a gate that
  # only runs on push would never say so.
  security:
    name: Security
    uses: ./.github/workflows/security.yaml
    permissions:
      contents: read

  # Rebase-and-merge replays each commit of the PR onto main, so every one of
  # them becomes a commit semantic-release reads to choose the version and
  # write the notes. One that is not a Conventional Commit contributes nothing
  # — and a PR made entirely of such commits produces no release at all,
  # silently. So they are checked here, not discovered by an absence.
  #
  # Same expression as the commit-msg hook in lefthook.yml, so a commit that
  # passed locally passes here. The hook is opt-in per clone; this is not.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Every commit the PR would replay, plus the base to compare against.
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
          failed=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            subject="$(git log -1 --format=%s "$sha")"
            # Merges and reverts are generated by git, not written by a person.
            case "$subject" in Merge*|Revert*) continue ;; esac
            if printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "ok   ${sha:0:8}  $subject"
            else
              echo "::error::${sha:0:8} is not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$failed" -ne 0 ]; then
            echo "Format: <type>(<scope>)!: <subject>"                          >&2
            echo "See:    https://www.conventionalcommits.org/en/v1.0.0/"       >&2
            exit 1
          fi

  # Release is a job of CI, not a workflow beside it, so a red pipeline
  # cannot ship. It used to be its own workflow triggered on push: it ran in
  # parallel with the checks and several releases went out green while CI was
  # red.
  #
  # `needs:` rather than a workflow_run trigger. workflow_run carries full
  # permissions and is the usual way people accidentally build untrusted code;
  # a job dependency states the same requirement with none of that surface,
  # and states it where the checks themselves are visible.
  release:
    name: Release
    # NOT `commits`: that job only runs on a pull request, and a skipped
    # dependency skips its dependents — release would never fire on a push to
    # main. It is enforced where it belongs, as a required check on the branch.
    # Only jobs that run on a push to main. The pull-request checks are
    # skipped there, and a skipped dependency skips its dependents — listing
    # them would mean the release never fires. The pull request is what gated
    # this commit; security still gates it here.
    needs: [prime, security]
    # Only from a push to main. On a pull request the checks still run; there
    # is simply nothing to release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # semantic-release pushes the tag and the release notes; the issues and
      # pull-requests scopes are for its comment plugins. Scoped to this job,
      # so every other job in this workflow stays read-only.
      contents: write
      issues: write
      pull-requests: write
    steps:
      # No persist-credentials: false here — semantic-release pushes the tag it
      # creates, so this is the one checkout in the repository that genuinely
      # needs its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # BOTH pins matter, and it is the PAIR that matters.
          #
          # An unpinned preset resolves to its current major on every run, so a
          # release that worked yesterday breaks on an upstream publish with no
          # commit of ours in between — and the failure reads as a missing
          # module rather than as a version mismatch.
          semantic_version: 25
          extra_plugins: |
            conventional-changelog-conventionalcommits@10.2.1
