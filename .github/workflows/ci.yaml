name: CI

# Job names say what is asserted, never which tool asserts it: "Committed
# secrets", not "gitleaks". The tool shows up in the step and in the log, where
# a failure is already being read; the check list is read to see what is
# guarded. Renaming a job renames a required status check, so branch protection
# has to be updated in the same pass.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. Rapid pushes to a branch would otherwise leave every earlier
# run grinding through a preview matrix nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than latest: a tool that changes version between runs turns
  # "CI went red and nothing changed" into a debugging session.
  #
  # It must also be BUILT with a Go at least as new as go.mod targets, or it
  # refuses to load the config: "the Go language version (go1.26) used to build
  # golangci-lint is lower than the targeted Go version (1.27.1)". 2.13.2 is
  # built with go1.27.
  # Each pin carries a `renovate:` annotation so a bot proposes the bump in a
  # pull request rather than a pin quietly rotting. The annotation is the whole
  # source of truth for where a version comes from — one regex manager in
  # .github/renovate.json reads these lines and nothing else — and a tool
  # without one is a tool nobody will ever upgrade.
  #
  # extractVersion appears where the pin omits the `v` its upstream tag carries.
  # Without it Renovate compares "0.8.0" against a list of "v0.8.0" tags.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_VERSION: "v2.13.2"
  # renovate: datasource=github-releases depName=securego/gosec
  GOSEC_VERSION: "v2.29.0"
  # renovate: datasource=pypi depName=checkov
  CHECKOV_VERSION: "3.3.17"

  # Same reason: a kubeconform release changing which schemas it accepts would
  # turn CI red with no commit of ours in between.
  # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
  KUBECONFORM_VERSION: "0.8.0"

  # renovate: datasource=github-releases depName=lycheeverse/lychee extractVersion=^lychee-v(?<version>.+)$
  LYCHEE_VERSION: "0.24.2"

jobs:
  # Decides whether anything in this change can break a check below.
  #
  # The jobs it gates carry a job-level `if:`, so on a documentation-only pull
  # request they never start a runner. That is safe, and it is worth saying why
  # the opposite was believed here for a while: a job skipped by `if:` DOES
  # report, with a "skipping" conclusion that branch protection accepts as
  # success. The proof is in this workflow — `Go build cache` is a required
  # check and is skipped on every pull request. What blocks a branch forever is
  # a check that never reports at all, which is what a workflow-level `paths:`
  # filter would cause. There is none here, deliberately.
  #
  # Before this, the gate ran the jobs anyway and skipped their expensive step.
  # Measured on a documentation-only pull request: 11 minutes of wall clock, of
  # which six jobs spent 139-313 seconds each in setup-go — restoring a 4.4 GB
  # build cache for steps they then skipped.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Inert paths — what no check in this repository reads. Everything
          # else is relevant, and the direction matters more than the list.
          #
          # This used to be an inclusion list: "code" meant a .go file, go.mod
          # or .golangci.yaml. But the test suite asserts against Taskfile.yaml,
          # the per-layer taskfiles, every layer's manifests and Pulumi.yaml,
          # the committed topology and these workflows — so a change to any of
          # them skipped the very tests written to guard it. An inclusion list
          # has to be extended for each new kind of input, and forgetting is
          # silent and green. Excluding documentation cannot fail that way: a
          # file type nobody has thought about yet is relevant by default.
          #
          # Held to a table of examples by tools/repo/workflows_test.go.
          inert='(^|/)[^/]*\.md$|^docs/|^LICENSE$|^\.gitignore$|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/|\.(png|jpe?g|svg|gif)$'

          if [ -z "${BASE:-}" ]; then
            # A push to main: always relevant, so the release path is never
            # gated on a diff computation.
            printf '%s\n' "relevant=true" >>"$GITHUB_OUTPUT"
            printf '%s\n' "push to main — running everything"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE" "$HEAD")"
          printf '%s\n' "$changed"

          # grep exits 1 when every line is inert, which is an answer here.
          relevant="$(printf '%s\n' "$changed" | grep -vE "$inert" || true)"

          if [ -n "$relevant" ]; then
            printf '%s\n' "relevant=true" >>"$GITHUB_OUTPUT"
            printf '%s\n' "outside documentation:"
            printf '%s\n' "$relevant" | sed 's/^/  /'
          else
            printf '%s\n' "relevant=false" >>"$GITHUB_OUTPUT"
            printf '%s\n' "documentation only — the checks below will report as skipped"
          fi

  # Compiles everything once, so the shared Go cache is saved by a job that has
  # actually built the tree.
  #
  # Without this the cache is whatever the FIRST job to finish happened to hold,
  # and its key is immutable: an early run whose jobs failed before touching Go
  # left a 31 MB cache that every later run restored and then rebuilt from
  # scratch. Priming makes the saved cache the useful one.
  prime:
    name: Go build cache
    # Push only. On a pull request `cache-mode` resolves to `restore`, so this
    # job compiled for 277 seconds and wrote nothing — and the four jobs that
    # waited on it then restored the same cache from main that they would have
    # restored without it. Measured: 872s wall clock, of which 283s was this
    # job queueing behind the scanners and 277s was it running.
    #
    # Its second role, gating the expensive half on the cheap scanners, moved
    # to those jobs depending on `security` directly.
    if: github.event_name == 'push'
    needs: [changes, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/setup-go
        with:
          # The one writer, and only on a push to main.
          #
          # A cache written on a pull request is scoped to refs/pull/N/merge:
          # no other branch can read it, and it lingers after the branch is
          # gone. Three of those at 789 MB each were already sitting against a
          # 10 GB repository limit, where eviction is least-recently-used and
          # would eventually take the main cache with them.
          #
          # Pull requests restore instead. They get main's cache under the same
          # key, which holds the dependency tree — the expensive part — so the
          # only thing given up is one push in a pull request reusing the
          # build of the push before it.
          cache-mode: ${{ github.event_name == 'push' && 'save' || 'restore' }}
      # Gated on whether there is a key to fill, and on nothing else.
      #
      # The distinction matters, because the obvious version of this condition
      # is the bug it replaces: skipping the build on a docs-only change still
      # SAVED, which put an empty cache under an immutable key and poisoned
      # every run afterwards. That happened, in the run that introduced this
      # job. Here the save is skipped by the same answer, so a cache is never
      # written without the build that fills it.
      #
      # "Against a warm cache this is a no-op and costs seconds" is what this
      # comment used to claim. Measured on the push that merged #73: 319
      # seconds — 67 freeing disk, 103 restoring 2 GB, 113 compiling — and
      # then `not saving cache`, because the key was already there. Most
      # merges do not touch go.sum, so most runs of this job were that.
      - if: steps.go.outputs.cache-present != 'true'
        name: Build everything
        run: |
          set -euo pipefail
          # From empty, so what gets saved is what a build of this tree needs
          # and nothing else. Without this the job restores whatever the
          # previous generation held, adds to it and saves the sum — which is
          # how the saved cache reached 14 235 MB against the 4 635 MB a cold
          # build actually produces.
          #
          # It costs this job a cold compile, once per merge. Every reader on
          # every pull request then restores a third as much.
          go clean -cache
          go build -o bin/ ./...
          # Compiles every test binary without running a single test, which is
          # what the test and lint jobs then reuse.
          go test -run '^$' ./...
          go vet -tags e2e ./test/...

  # Guards the thing a Go build cannot see: that the layer list in the
  # Taskfile and the directories under layers/ still describe the same set.
  # They drift when a layer is renamed and one of the two is updated.
  layers:
    name: Layer list matches the tree
    # Pull requests only. This check reads one tree — the declared layer list
    # against the directories — so a merge cannot break it in a way the pull
    # request did not already see. What a merge CAN break is compilation, and
    # that is why `build` below runs on main too.
    #
    # What DOES run on main is prime, because a cache written on a pull request
    # is scoped to refs/pull/N/merge and no other branch can read it — only the
    # default branch can seed a cache everything else restores. Plus the
    # scanners, which gate the release.
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    # Ten, not five. The work here is two seconds of echo and awk; everything
    # else is setup, and setup is not something this job controls. At five it
    # timed out on a slow runner at 5m09 — reported as "cancelled", which took
    # a while to recognise as a timeout.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # No cache. This job compiles nothing: it prints the layer list from
          # the Taskfile and runs awk over the workflows. Restoring the shared
          # cache expands 789 MB into 4.4 GB for no reader, which is most of
          # what pushed it past its timeout.
          cache-mode: "off"
      - run: |
          set -euo pipefail
          declared="$(task platform:layers --yes | sort)"
          onDisk="$(find layers -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          if [ "$declared" != "$onDisk" ]; then
            printf '%s\n' "Taskfile LAYERS and layers/ disagree:" >&2
            # `|| true` because diff exits 1 when the inputs differ, which is
            # the case we are already in and about to fail on deliberately.
            # Nothing is hidden: the diff itself is what goes to stderr.
            diff <(printf '%s\n' "$declared") <(printf '%s\n' "$onDisk") >&2 || true
            exit 1
          fi
          printf '%s\n' "$declared"

      # Exactly one job may write the shared Go cache.
      #
      # An Actions cache key is immutable, so whichever job saves first owns it
      # — and the job that compiles the tree is by definition slower than one
      # that does not. This went wrong twice: once a 31 MB cache from a run that
      # failed before touching Go, once an empty one from a prime job that
      # skipped its build. Both were restored by every later run, which then
      # rebuilt everything.
      #
      # A comment did not prevent the second occurrence, so this is a check.
      - name: One writer for the Go cache
        run: |
          set -euo pipefail
          # One awk over the workflows instead of `grep -rnE ... || true`
          # piped into `grep -c . || true`. It matches and counts in one pass,
          # and zero matches is an answer rather than an exit code that `set
          # -e` would treat as failure — so neither `|| true` is needed, and
          # nothing is being swallowed to make the step survive.
          #
          # The pattern is anchored inside tools/lines/main.awk, so it cannot match
          # string in its own source. The shell version did, on its first
          # attempt.
          report="$(awk -f tools/lines/main.awk -v op=cache-writers .github/workflows/*.yaml)"
          count="${report##*count=}"
          printf '%s\n' "writers:"
          printf '  %s\n' "$(printf '%s' "$report" | grep -v '^count=' || printf '%s' none)"
          if [ "$count" -ne 1 ]; then
            printf '%s\n' "::error::expected exactly one job with cache-mode: save, found $count"
            printf '%s\n' "The key is immutable and the fastest saver wins it. More than one" >&2
            printf '%s\n' "writer is a race the priming job always loses; none means the"      >&2
            printf '%s\n' "cache is never populated at all."                                   >&2
            exit 1
          fi

  # The expensive half. Each of these gates on `security` rather than on prime:
  # GitHub has no job-level fail-fast, so without that edge a secret or a
  # reachable vulnerability would be reported alongside ten minutes of
  # compiling rather than instead of it. The scanners are the cheap half —
  # six to thirty-five seconds each.
  build:
    name: Tests and vet
    # Both events, and this is the one job that runs on a push to main.
    #
    # Branch protection no longer requires a branch to be current before it
    # merges. That requirement cost a full second run of everything on every
    # pull request — update the branch, the checks start again — and bought
    # only the guarantee that the pull request had compiled against the exact
    # main it landed on.
    #
    # This job buys the same guarantee at a quarter of the price. Without
    # `strict`, the tree on main after a merge is a combination no pull request
    # ever compiled: one renames a function, another adds a caller, both green
    # apart and broken together. So the merged tree is compiled and tested
    # here, once, warm. The rest of the checks stay pull-request-only because
    # they read one tree rather than a combination — the layer list, the chart
    # pins, the topology and the commit subjects cannot break by merging.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [changes, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          # For the gofmt gate below, which is the shared library's task.
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # No separate `go build ./...`: `go test ./...` already compiles every
      # package, including those with no test files.
      - name: go test
        run: go test -count=1 ./...
      # The same task an operator runs, not a second copy of it. This step
      # used to hand-roll `gofmt -l .`, which asserts less than the task does
      # now that the task is the library's `gofmt -s` gate — so a file could
      # pass here and be rewritten by `task fmt` locally.
      - name: gofmt
        run: task fmt-check --yes
      - name: go vet
        run: go vet ./...
      # The e2e suite is behind a build tag, so `go test ./...` never compiles
      # it. Without this it rots unnoticed until someone tries to run it
      # against a cluster, which is the worst moment to find a type error.
      - name: type-check the e2e suite
        run: go vet -tags e2e ./test/...

  docs:
    name: Documentation links
    # NOT gated on changes.outputs.relevant, and that is deliberate.
    #
    # A link breaks from either end. Editing a document breaks it the obvious
    # way — but so does moving the file it points at, or renaming a heading,
    # and those changes are code changes with no .md in the diff. Documentation
    # is in the inert list precisely so a prose-only change skips the heavy
    # gates, which would skip this one exactly when it matters most.
    #
    # It is affordable at any rate: lychee is offline here, and answers in
    # three milliseconds over fifteen files.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          # For the task below. The flags belong in the task an operator runs,
          # not in a second copy of them here that drifts from it.
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install lychee
        env:
          LYCHEE_VERSION: ${{ env.LYCHEE_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
      - name: Documentation links
        run: task docs:links

  lint:
    name: Go lint
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    needs: [changes, security]
    runs-on: ubuntu-latest
    # Above golangci's own --timeout, or the runner kills the job first and the
    # log says nothing useful.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          # --fix=false: the config enables fix for local development, where it
          # is a convenience. In CI it would rewrite a read-only checkout and
          # hide the findings it repaired.
          args: --timeout=15m --fix=false

  gosec:
    name: Insecure patterns
    # Whole-repo, which is the half golangci-lint cannot cover: it runs gosec
    # too, but under `--new-from-merge-base`, so a finding already on main is
    # invisible to it for ever. The two also disagree on rules — a plain G204,
    # a subprocess built from a variable, is reported here and not there, which
    # is what the #nosec G204 in tools/stack is for.
    #
    # Here rather than in security.yaml because that workflow is scheduled for
    # findings that appear without anyone touching the code. gosec's are a pure
    # function of the code at a pinned version.
    #
    # Free on the wall clock when the cache is warm, measured rather than
    # assumed: the gosec step itself is 23-27s across recent runs, inside a job
    # of about five minutes. Locally it is 2m42s from a cold build cache and 7s
    # from a warm one.
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    needs: [changes, security]
    runs-on: ubuntu-latest
    # 25, and the number is the point. gosec's cost is not gosec: it type-checks
    # the whole transitive graph, so its runtime is whatever the build cache
    # does not already hold.
    #
    # No job writes a cache on a pull request — `prime` is push-only, for the
    # reason stated on it — so a pull request that changes go.sum misses the
    # exact key, restores the PREVIOUS dependencies through the restore-key
    # prefix, and has to compile the difference. On a `task go:deps:update`
    # pull request that is close to a full rebuild.
    #
    # Measured on exactly such a pull request: `Tests and vet`, which does the
    # same compilation, took 10m52s against its usual 4m, and survived on its
    # 20-minute bound. `Go lint` took 9m35s on the same 20. gosec died twice on
    # 15 — once after the cache-key bump and once on the deps update — because
    # it pays 2m08s restoring the cache and 1m18s on `go install gosec` BEFORE
    # the compilation those two spend their whole budget on.
    #
    # Where the minutes come from: locally the work is 1 916 CPU-seconds. A
    # standard runner on a PRIVATE repository has TWO cores — four is what a
    # public one gets — so 1916/2 is 958s, which is the 15m58s that a 15-minute
    # bound cannot fit. The step below prints the runner's actual cores, so the
    # next reader measures this instead of looking it up.
    #
    # So this is the same margin `Tests and vet` has, plus that overhead. A
    # tighter bound does not make it faster, it only hides the cause behind
    # "exit status 143" — which is how it read both times.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # What this job's runtime is a function of, printed once. Both times this
      # job was killed the log said only "exit status 143" — nothing about
      # cores, memory, or whether the cache had matched. One second of output
      # turns the next occurrence into a reading rather than an investigation.
      - name: Runner size
        run: |
          printf 'cores: %s\n' "$(nproc)"
          printf 'memory: %s\n' "$(free -h | awk '/^Mem:/ {print $2}')"

      # Downloaded, not compiled. `go install` built gosec from source on every
      # run — 1m06s, 1m08s, 1m16s warm and 1m22s cold, measured across four
      # runs, against a gosec step that is 23-27s. It never got faster because
      # the build cache holds OUR module: gosec's own dependencies are not in
      # this module's graph, so nothing that primes the cache ever compiles
      # them, and they are built fresh every time.
      #
      # The verification `go install` gave up is replaced rather than dropped.
      # It checked the module against the checksum database; this checks the
      # tarball against the release's own checksums file, which is weaker —
      # it binds the artifact to that release manifest rather than to an
      # out-of-band trust root. gosec also publishes a Sigstore bundle, which
      # is the stronger option and needs cosign on the runner; worth moving to
      # if this repository ever installs cosign for something else.
      #
      # It is still stricter than the two downloads already here: kubeconform
      # and talosctl are fetched with a bare `curl` and verified against
      # nothing at all.
      - name: Install gosec
        env:
          # Without the leading v, which is how the release assets are named
          # while the tag carries it.
          VERSION: ${{ env.GOSEC_VERSION }}
        run: |
          set -euo pipefail

          plain="${VERSION#v}"
          base="https://github.com/securego/gosec/releases/download/${VERSION}"
          tarball="gosec_${plain}_linux_amd64.tar.gz"

          cd "${RUNNER_TEMP}"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/gosec_${plain}_checksums.txt"

          # --ignore-missing, because the checksums file covers every platform's
          # asset and only one was downloaded. Without it sha256sum fails on
          # the absent ones and the real verdict is lost in the noise.
          sha256sum --check --ignore-missing "gosec_${plain}_checksums.txt"

          tar -xzf "${tarball}" gosec
          install -m 0755 gosec /usr/local/bin/gosec
          gosec --version
      # Suppressions are written as #nosec, which both this and the gosec
      # inside golangci-lint honour — //nolint:gosec would satisfy the lint job
      # and fail this one.
      - run: task security:gosec

  checkov:
    name: Manifest hardening
    # 480-odd hardening rules over the Kubernetes manifests and the workflows
    # this repository ships. It is the only check that reads the vendored
    # cert-approver manifest as Kubernetes rather than as YAML, and the only
    # one that reads the workflows as a build pipeline.
    #
    # Here rather than in security.yaml by that workflow's own criterion: the
    # version is pinned, so the findings are a pure function of the code.
    # Measured at under three seconds locally, beside jobs that take minutes.
    #
    # Accepted findings live in .checkov.yaml with the reason each one stands,
    # the same convention as .trivyignore.yaml.
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    needs: [changes, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # No cache. checkov is a Python tool and this job compiles nothing,
          # so the 4.4 GB build cache has no reader here — it was 313 seconds
          # of the job's 355, the single slowest step in the whole workflow.
          cache-mode: "off"
      - run: pipx install "checkov==${CHECKOV_VERSION}"
      # The same task an operator runs, so the flags live in .checkov.yaml
      # rather than being restated here.
      - run: task checkov

  charts:
    name: Chart pins
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    needs: [changes, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # Enforces the pinning policy: exact versions, no floating tags.
      - run: go test -count=1 ./pkg/charts/
      # Renders every pinned chart and checks it still produces the workloads
      # pkg/workloads expects — the same table the e2e suite asserts against.
      # This is the gate that catches a chart rename in CI instead of at 3am.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # Pinned to the version the check was verified against; `latest`
          # would let a Helm release change what CI renders with no commit of
          # ours in between.
          version: v4.3.0
      # Validates what the charts render against the pinned Kubernetes version,
      # not just that the expected workloads are present. Pinned, because
      # `latest` would let a kubeconform release change what CI accepts with no
      # commit of ours in between.
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Chart render check
        run: go run ./tools/charts render
      # Unlike the report below, this one fails. Renovate bumps Version and
      # cannot touch the AppVersion beside it, so its pull requests arrive with
      # an entry claiming a version the chart no longer ships — mostly a
      # misleading comment, and more than that as soon as anything derives a
      # value from the field, as an image tag was derived from alloy's while
      # that chart was pinned here.
      - name: App versions match the pinned charts
        run: go run ./tools/charts appversions
      # There is deliberately no "report what is outdated" step. It had
      # continue-on-error, so it only ever wrote to a log nobody opens in a
      # green run, and Renovate's Dependency Dashboard answers the same
      # question permanently, with changelogs and open pull requests.
      #
      # `task charts:outdated` still exists for asking by hand.

  topology:
    name: Cluster topology
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    needs: [changes, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # Every committed topology must load, default and validate. A cluster
      # file that only fails at `pulumi up` has already cost an operator a
      # round trip.
      - run: go run ./tools/topology infra/cluster
      # Validate the machine-config patches against Talos itself. The talosctl
      # version is read from the topology rather than pinned here, because a
      # mismatched binary reports conflicts that will not happen on the cluster
      # being built.
      - name: Install the pinned talosctl
        run: |
          set -euo pipefail
          # Read through the real parser, not a grep: the first version of this
          # used `grep -A6` and broke the moment the comment above the field
          # grew, leaving the version empty and the download URL malformed.
          version="$(go run ./tools/topology get talos-version infra/cluster/cluster.example.yaml)"
          test -n "$version"
          curl -sSfL -o "${RUNNER_TEMP}/talosctl" \
            "https://github.com/siderolabs/talos/releases/download/${version}/talosctl-linux-amd64"
          chmod +x "${RUNNER_TEMP}/talosctl"
          printf '%s\n' "${RUNNER_TEMP}" >>"$GITHUB_PATH"
      - name: Talos machine config
        run: go run ./tools/talos infra/cluster

  # Extracted into its own workflow so it can ALSO run on a schedule: a CVE
  # published today makes yesterday's green commit vulnerable, and a gate that
  # only runs on push would never say so.
  security:
    name: Security
    needs: [changes]
    uses: ./.github/workflows/security.yaml
    with:
      # Only govulncheck reads this. gitleaks and trivy run either way: a
      # credential or a misconfiguration can arrive in any kind of file,
      # documentation included.
      go-code: ${{ needs.changes.outputs.relevant == 'true' }}
    permissions:
      contents: read

  # Rebase-and-merge replays each commit of the PR onto main, so every one of
  # them becomes a commit semantic-release reads to choose the version and
  # write the notes. One that is not a Conventional Commit contributes nothing
  # — and a PR made entirely of such commits produces no release at all,
  # silently. So they are checked here, not discovered by an absence.
  #
  # Same expression as the commit-msg hook in lefthook.yml, so a commit that
  # passed locally passes here. The hook is opt-in per clone; this is not.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Every commit the PR would replay, plus the base to compare against.
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
          failed=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            subject="$(git log -1 --format=%s "$sha")"
            # Merges and reverts are generated by git, not written by a person.
            case "$subject" in Merge*|Revert*) continue ;; esac
            if printf '%s' "$subject" | grep -Eq "$pattern"; then
              printf '%s\n' "ok   ${sha:0:8}  $subject"
            else
              printf '%s\n' "::error::${sha:0:8} is not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$failed" -ne 0 ]; then
            printf '%s\n' "Format: <type>(<scope>)!: <subject>"                          >&2
            printf '%s\n' "See:    https://www.conventionalcommits.org/en/v1.0.0/"       >&2
            exit 1
          fi
      # The type has to match what the commit touched.
      #
      # semantic-release reads nothing but the subject: feat becomes a minor,
      # fix and perf become a patch. So a change to CI written as `fix` cuts a
      # version and writes release notes for something no consumer of this
      # repository receives. Measured: `fix(ci): let renovate's schedule
      # actually fire` produced v4.4.2 on 2026-09-14, and the release contained
      # a workflow and its test.
      #
      # Two rules, and both are about a type that already exists being the
      # right one:
      #
      #   prose only            → docs, which releases nothing
      #   contributor-only only → not feat/fix/perf; ci, test or chore
      #
      # "Contributor-only" is deliberately narrow: .github, Go tests and the
      # dotfile tool configs. The taskfiles and tools/ are NOT in it — somebody
      # who checks out a tag gets those, so a new task is a real feat.
      #
      # awk rather than grep: one pass, and no exit-code-as-answer, which is
      # how the first version of this gate reported every commit as prose.
      - name: Commit types match what they touch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            subject="$(git log -1 --format=%s "$sha")"
            case "$subject" in Merge*|Revert*) continue ;; esac
            type="${subject%%[(:!]*}"
            want="$(git show --name-only --format= "$sha" | awk -v type="$type" '
              NF { n++
                if ($0 ~ /\.md$/ || $0 ~ /^docs\//) prose++
                if ($0 ~ /^\.github\// || $0 ~ /_test\.go$/ ||
                    $0 ~ /^\.[a-z]+[a-z.]*\.(yaml|yml|json|toml)$/ || $0 ~ /^lefthook\.yml$/) internal++ }
              END { if (n == 0) exit
                if (prose == n && type != "docs") { print "docs"; exit }
                if (prose + internal == n && type ~ /^(feat|fix|perf)$/) { print "ci, test or chore"; exit } }')"
            if [ -z "$want" ]; then
              printf '%s\n' "ok   ${sha:0:8}  $subject"
              continue
            fi
            printf '%s\n' "::error::${sha:0:8} is typed $type and touches only ${want%% *}-shaped paths: $subject"
            printf '%s\n' "       use: $want"
            git show --name-only --format= "$sha" | sed 's/^/       /'
            failed=1
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$failed" -ne 0 ]; then
            printf '%s\n' "feat, fix and perf make semantic-release cut a version and write notes." >&2
            printf '%s\n' "A change no consumer of this repository receives should not." >&2
            exit 1
          fi

  # Dispatches the release; the release itself is
  # .github/workflows/release.yaml.
  #
  # The gate is here, unchanged: `needs:` on every job that also runs on a push
  # to main, plus the push-to-main `if:`. What changed is that this job no
  # longer RUNS the release — it asks release.yaml to, with a
  # repository_dispatch, so that workflow gets a run and a history of its own.
  #
  # Read the two objections, because both come from this repository's history.
  #
  # 1. A RED PIPELINE MUST NOT SHIP. The release was once its own workflow on
  #    `push`, running in parallel with the checks, and v1.0.2 was cut from a
  #    commit whose CI was failing. The fix was `needs:`, and `needs:` is still
  #    what stands here — the dispatch cannot be sent from a red pipeline
  #    because this job never starts.
  #
  # 2. WHY NOT workflow_run, THE OBVIOUS ANSWER. zizmor's dangerous-triggers
  #    audit refuses it categorically and no guard satisfies it; its docs say
  #    checking the repository "is not effective on workflow_run". Populating a
  #    page is not worth this repository's first silenced high finding.
  #
  # repository_dispatch avoids both. GITHUB_TOKEN-triggered events do not start
  # workflow runs — which is why a tag pushed from CI chains nothing, and why
  # the usual workaround is a long-lived PAT — and repository_dispatch is one of
  # the two documented exceptions that always create a run. So this needs no
  # credential beyond the token the job already has.
  release:
    name: Release
    # Only jobs that also run on a push to main. A skipped dependency skips its
    # dependents, so listing a pull-request-only job here — `commits`, `lint`,
    # `charts` — would mean the release never fires at all. Those are enforced
    # where they belong, as required checks on the branch.
    #
    # `build` is in the list because it runs here too, and it is the one check
    # that sees the merged tree. Without it a combination that compiles in
    # neither pull request could be tagged and released.
    needs: [prime, security, build]
    # Only from a push to main. On a pull request the checks still run; there is
    # simply nothing to release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # POST /repos/{owner}/{repo}/dispatches needs write. Nothing else here
      # does, and the release's own scopes are declared in release.yaml, which
      # is where they are used.
      contents: write
    runs-on: ubuntu-latest
    # Seconds of work. Bounded low so a hung API call fails rather than holds a
    # runner for the default six hours.
    timeout-minutes: 5
    steps:
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --input rather than -f, because client_payload is nested and the
          # form syntax cannot express that. The values are a commit sha and a
          # run id — both generated by Actions, neither from a contributor — and
          # they arrive as environment variables rather than as an Actions
          # expression inside this script, so nothing here is interpolated
          # before the shell sees it.
          #
          # Note for whoever edits this comment: an Actions expression is
          # substituted anywhere in a run block, a shell comment included. The
          # first draft of these lines spelled the brace syntax out as an
          # example and actionlint rejected the file — correctly, because
          # GitHub would have tried to evaluate it.
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" --input - <<JSON
          {
            "event_type": "release",
            "client_payload": {
              "sha": "${GITHUB_SHA}",
              "ci_run_id": "${GITHUB_RUN_ID}"
            }
          }
          JSON

          printf '%s\n' "dispatched release for ${GITHUB_SHA}"
