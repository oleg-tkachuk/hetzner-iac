name: Preview

# A real `pulumi preview` needs real credentials and a real cluster stack:
# every layer resolves the cluster through a StackReference, and the cluster
# tier resolves a Talos snapshot through the Hetzner API.
#
# It is therefore NOT part of pull-request CI. A preview faked against an empty
# local backend passes without checking anything, which is worse than not
# running it — it reports green over an untested change.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to preview
        required: true
        default: dev
  # Drift detection. A preview that is not empty means something changed the
  # cluster outside this repository.
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    name: Target stack and layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.pick.outputs.stack }}
      layers: ${{ steps.list.outputs.layers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # DERIVED from the Taskfile, which is also what `task platform:apply-all`
      # walks. A hand-written copy here is how a matrix ends up previewing
      # directories that were renamed months ago.
      - id: list
        run: |
          set -euo pipefail
          layers=$(task platform:layers --yes | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "layers=$layers" >>"$GITHUB_OUTPUT"
      # The stack name is decided here and nowhere else. It used to be written
      # into eight places as `inputs.stack || 'prod'`, and a job-level
      # `environment:` cannot read the `env` context, so there was no way to
      # keep one copy without a job to hold it.
      - id: pick
        env:
          STACK: ${{ inputs.stack || 'dev' }}
        run: echo "stack=$STACK" >>"$GITHUB_OUTPUT"

  cluster:
    name: Cluster tier drift
    needs: [target]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The GitHub environment is named after the stack, which is where its two
    # secrets live. A stack with no environment of the same name gets none, and
    # setup-pulumi says so — an empty access token otherwise fails as a login
    # error naming neither the secret nor the environment.
    environment: ${{ needs.target.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pulumi
        with:
          access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          stack: ${{ needs.target.outputs.stack }}
      - name: Preview
        working-directory: infra/cluster
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          STACK: ${{ needs.target.outputs.stack }}
        run: |
          set -euo pipefail

          # tools/stack names the stacks that do exist. The pipeline this
          # replaces reported only an exit code — eight jobs said `exit code 6`
          # at once with nothing saying which stacks were there — and it was
          # the third copy of the same `pulumi stack ls | jq -e` in the tree.
          #
          # Addressed from the workspace, not as ./tools/stack: this step runs
          # in infra/cluster, where a relative package path resolves to
          # infra/cluster/tools/stack and Go reports `directory not found`.
          # Same shape as {{.ROOT}}/tools/stack in the taskfiles.
          go run "$GITHUB_WORKSPACE/tools/stack" exists . "$STACK"

          pulumi --non-interactive --stack "$STACK" preview --diff

  layer:
    # No `name:` on purpose. A custom name is used verbatim, so a skipped job
    # shows as one check literally called "Preview (${{ matrix.layer }})".
    # Without it GitHub builds the label per layer: "layer (30-core)".
    needs: [target]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.target.outputs.stack }}
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.target.outputs.layers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pulumi
        with:
          access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          stack: ${{ needs.target.outputs.stack }}
      - name: Preview
        working-directory: layers/${{ matrix.layer }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          STACK: ${{ needs.target.outputs.stack }}
        run: |
          set -euo pipefail

          pulumi --non-interactive --stack "$STACK" preview --diff

  e2e:
    name: Cluster health
    needs: [target, cluster]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.target.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pulumi
        with:
          access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          stack: ${{ needs.target.outputs.stack }}
      - name: Fetch the kubeconfig
        working-directory: infra/cluster
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          STACK: ${{ needs.target.outputs.stack }}
        run: |
          set -euo pipefail
          pulumi --non-interactive --stack "$STACK" \
            stack output kubeconfig --show-secrets > "${RUNNER_TEMP}/kubeconfig"
          chmod 600 "${RUNNER_TEMP}/kubeconfig"
      # Read-only apart from nothing: the suite creates no workloads, so it is
      # safe to run against the cluster that is actually serving traffic —
      # which is the only cluster whose health is worth reporting.
      - name: e2e
        run: go test -tags e2e -count=1 -v -timeout 40m ./test/e2e/... --kubeconfig "${RUNNER_TEMP}/kubeconfig"
