name: Preview

# A real `pulumi preview` needs real credentials and a real cluster stack:
# every layer resolves the cluster through a StackReference.
#
# It is therefore NOT part of pull-request CI. A preview faked against an empty
# local backend passes without checking anything, which is worse than not
# running it — it reports green over an untested change.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to preview
        required: true
        default: dev
  # Drift detection. A preview that is not empty means something changed the
  # cluster outside this repository.
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    name: Target stack and layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.pick.outputs.stack }}
      layers: ${{ steps.list.outputs.layers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          task: "true"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # DERIVED from the Taskfile, which is also what `task platform:apply-all`
      # walks. A hand-written copy here is how a matrix ends up previewing
      # directories that were renamed months ago.
      - id: list
        run: |
          set -euo pipefail
          layers=$(task platform:layers --yes | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "layers=$layers" >>"$GITHUB_OUTPUT"
      # The stack name is decided here and nowhere else. It used to be written
      # into eight places as `inputs.stack || 'prod'`, and a job-level
      # `environment:` cannot read the `env` context, so there was no way to
      # keep one copy without a job to hold it.
      - id: pick
        env:
          STACK: ${{ inputs.stack || 'dev' }}
        run: echo "stack=$STACK" >>"$GITHUB_OUTPUT"

  # No cluster-tier job: its topology lives in a gitignored file, because
  # network.adminCIDRs is the operator's own address and this repository is
  # going public. A runner has no topology, so the program cannot start.
  #
  # Cluster-tier drift is therefore checked by hand, where the file is:
  #
  #     task cluster:plan stack=dev
  #
  # The layer jobs below still cover everything running on the cluster.

  layer:
    # No `name:` on purpose. A custom name is used verbatim, so a skipped job
    # shows as one check literally called "Preview (${{ matrix.layer }})".
    # Without it GitHub builds the label per layer: "layer (30-cluster-services)".
    needs: [target]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.target.outputs.stack }}
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.target.outputs.layers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pulumi
        with:
          access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          stack: ${{ needs.target.outputs.stack }}
      - name: Preview
        working-directory: layers/${{ matrix.layer }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          STACK: ${{ needs.target.outputs.stack }}
        run: |
          set -euo pipefail

          pulumi --non-interactive --stack "$STACK" preview --diff

  # No cluster-health job either, and for the same reason as the tier above:
  # the Hetzner firewall opens tcp/6443 to network.adminCIDRs only, and a
  # GitHub-hosted runner is not in it. Its published ranges are 6980 CIDRs of
  # shared Azure that rotate, so allowing them would put everyone who can run
  # a workflow inside the perimeter.
  #
  # The suite is read-only and runs against the live cluster from where the
  # firewall already allows it:
  #
  #     task e2e
  #
  # Automating it needs a runner with an address inside the perimeter.
