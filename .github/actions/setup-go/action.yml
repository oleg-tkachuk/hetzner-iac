name: Set up Go
description: >
  Install the Go toolchain named by go.mod, attach the shared build and module
  cache in a defined role, and optionally install go-task.

  The version comes from `go-version-file: go.mod` rather than a GO_VERSION env
  var each workflow declares for itself — that would be several places to edit
  for one bump, and a missed one silently builds a job against a different
  toolchain than the rest of the run.

  ONE WRITER. setup-go's own caching was doing both restore and save in every
  job, and an Actions cache key is immutable: whichever job saved first owned
  it. That is a race the useful job always loses, because the job that compiles
  the tree is by definition slower than the job that does not. Twice it left a
  cache holding almost nothing — 31 MB, then 0 MB — which every later run
  restored and then rebuilt from.

  So the roles are explicit here: `save` belongs to the priming job alone, and
  every other job takes `restore`.

outputs:
  cache-present:
    description: >
      "true" when the exact cache key already exists, so the caller can skip
      work whose only purpose is to fill it. Set only for cache-mode: save —
      a reader has nothing to decide.
    value: ${{ steps.probe.outputs.cache-hit }}

inputs:
  cache-mode:
    description: >
      "restore" — read the shared cache, never write it. The default, and what
      every job except the priming one should use.

      "save" — read it and write it back at the end of the job. Exactly one job
      per workflow may do this, and it must be the one that builds everything.

      "off" — no shared cache at all. For work whose artifacts nothing else can
      reuse, such as a race build, which carries its own build IDs.
    required: false
    default: "restore"
  task:
    description: Also install go-task ("true" | "false")
    required: false
    default: "false"
  repo-token:
    description: GITHUB_TOKEN, so setup-task avoids API rate limits
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The toolchain first, because the cache key names its version and the
    # paths it caches are `go env` answers. It is 11 seconds and needs no room
    # made for it: the failures below were a 2 GB cache expanding into a cold
    # build, not a 200 MB toolchain.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        # Caching is handled below, where the role can be stated. setup-go's
        # own option cannot express "restore but do not save".
        cache: false

    - id: go-paths
      shell: bash
      run: |
        set -euo pipefail
        echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)"  >>"$GITHUB_OUTPUT"
        echo "version=$(go env GOVERSION)" >>"$GITHUB_OUTPUT"

    # The `go2-` generation. An Actions cache key is immutable, so the old
    # `go-` entries hold what they held: measured on 2026-09-13, 14 235 MB of
    # build cache where a complete cold build produces 4 635 MB. Two thirds of
    # what every reader restored was stale — Go trims entries untouched for
    # five days, and a cache restored fresh on every run never ages.
    #
    # Bumping the generation abandons those entries to eviction and lets the
    # writer save a clean one. The first run after this change is a miss
    # everywhere, which costs one cold build; every run after it restores a
    # third of what it used to.
    #
    # Does the key this job would write already exist?
    #
    # lookup-only, and deliberately without restore-keys: a prefix match means
    # a different go.sum, which is a key that genuinely needs filling. Only an
    # exact hit means there is nothing to do — and in that case the cache
    # action would refuse the save anyway ("Cache hit occurred on the primary
    # key, not saving cache"), after spending 103 seconds restoring 2 GB and
    # 113 compiling to produce it. Measured on the push that merged #73: 319
    # seconds to write nothing.
    - id: probe
      if: inputs.cache-mode == 'save'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        lookup-only: true
        path: |
          ${{ steps.go-paths.outputs.mod }}
          ${{ steps.go-paths.outputs.build }}
        key: go2-${{ runner.os }}-${{ steps.go-paths.outputs.version }}-${{ hashFiles('go.sum') }}

    # Room for the cache, and only for the jobs that hold one.
    #
    # The space is needed BECAUSE of the cache, and `rm -rf` over five
    # preinstalled toolchains is not the 24 seconds the action's description
    # claimed — measured across one run's ten jobs it ranged from 38 to 175
    # seconds, and the worst of those was checkov, a Python tool holding no
    # cache at all. A job with cache-mode off keeps the runner's own 13.7 GB,
    # which is what every non-Go tool here ran inside before this repository
    # had a shared cache.
    - if: inputs.cache-mode != 'off' && steps.probe.outputs.cache-hit != 'true'
      uses: ./.github/actions/free-disk

    # The reader. actions/cache/restore never writes, so no consumer can take
    # the key from the priming job.
    - if: inputs.cache-mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-paths.outputs.mod }}
          ${{ steps.go-paths.outputs.build }}
        key: go2-${{ runner.os }}-${{ steps.go-paths.outputs.version }}-${{ hashFiles('go.sum') }}
        # A cache from an older go.sum still holds most of what a build needs;
        # restoring it beats starting from nothing.
        # A cache from an older go.sum still holds most of what a build needs;
        # restoring it beats starting from nothing.
        #
        # One prefix again. The previous `go-` generation was listed here
        # through the transition, so that the first pull request after the key
        # bump was not cold everywhere — measured that way, gosec went past its
        # 15-minute bound and the job was killed. A `go2-` cache exists now, so
        # the fallback would only let a reader keep restoring the fat one.
        restore-keys: |
          go2-${{ runner.os }}-${{ steps.go-paths.outputs.version }}-

    # The writer. actions/cache restores and then saves at the end of the job.
    #
    # Skipped when the probe found the key, so nothing is restored to produce
    # a save that would be refused. Note what this cannot become: the save
    # only ever runs on a miss, and the caller's build is gated on the same
    # answer — so there is no path where a cache is written without the build
    # that fills it, which is the poisoning this arrangement was built to
    # prevent.
    - if: inputs.cache-mode == 'save' && steps.probe.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-paths.outputs.mod }}
          ${{ steps.go-paths.outputs.build }}
        key: go2-${{ runner.os }}-${{ steps.go-paths.outputs.version }}-${{ hashFiles('go.sum') }}
        # A cache from an older go.sum still holds most of what a build needs;
        # restoring it beats starting from nothing.
        #
        # One prefix again. The previous `go-` generation was listed here
        # through the transition, so that the first pull request after the key
        # bump was not cold everywhere — measured that way, gosec went past its
        # 15-minute bound and the job was killed. A `go2-` cache exists now, so
        # the fallback would only let a reader keep restoring the fat one.
        restore-keys: |
          go2-${{ runner.os }}-${{ steps.go-paths.outputs.version }}-

    - if: inputs.task == 'true'
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        version: 3.x
        repo-token: ${{ inputs.repo-token }}
