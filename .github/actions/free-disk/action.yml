name: Free disk space
description: >
  Removes preinstalled toolchains this repository never uses, to make room for
  a cold Go build.

  IT NOW SKIPS ITSELF WHEN THE ROOM IS ALREADY THERE, and the two numbers that
  make that safe were measured on run 35282937571:

    free before removal    87 476 MB
    shared cache             1 127 MB

  So it was freeing 22 GB to make room for one, and charging 30 seconds in one
  job and 74 in another for it. Both premises below have moved: the runner
  image is no longer a 13.7 GB disk, and the cache is no longer 15.6 GB — the
  `go2-` generation and a priming job that builds from empty did that.

  What is kept is the protection rather than the cost. The threshold is the
  same 20 000 MB the guard at the bottom already enforces, so no new number
  enters: below it, every toolchain still goes; above it, nothing is removed
  and the job says so. If a future runner image ships a small disk, or the
  cache grows back, this behaves exactly as it did.

  Everything below is the history that made it, and is why the removal is
  still here rather than deleted.

  A hosted runner starts with 13.7 GB free, and this repository's cache fits
  in that — now. It did not this morning, and the difference is worth reading
  before anyone removes this action.

  Measured with this action deliberately absent in a reader job,
  against a cache of 15.6 GB:

    baseline               13 720 MB
    after the toolchain    13 087 MB
    cache restore          died, with no logs at all

  Then the saved cache was trimmed to one build's worth — 4 635 MB of build
  cache and 1 452 MB of modules — and the same job was measured again:

    baseline               13 086 MB
    after the restore       7 001 MB
    after the work          5 732 MB   and it finished

  So this is headroom rather than necessity, and it stays for two reasons
  that are not sentiment. The failure it prevents is the worst kind this
  repository has produced — a job killed with no logs, which reads as lost
  infrastructure rather than as a full disk. And removing it buys nothing:
  measured on the same run, 250s for the reader without it against 209s for
  the one with it.

  What would change that: the cache growing again. It reached 14 155 MB once,
  because Go trims entries untouched for five days and a cache restored fresh
  on every run never ages. The priming job now builds from an empty cache to
  keep that from recurring — if that ever stops being true, this action is
  what stands between the regression and a run with no logs.

  It first went over the edge twice, in two different jobs and with two
  different faces:

    compile: writing output: write $WORK/b857/_pkg_.a: no space left on device
    failed to download vulnerability DB: write .../trivy.db: no space left on device

  The first sign of the first one was worse than the error — the disk filled far
  enough that the runner could not write its own log pages, so the job failed
  with no logs at all and looked like lost infrastructure.

  Which is why this runs inside setup-go rather than being added to the jobs
  that have failed so far: guessing which one is next is a game of whack-a-mole.

  It runs for the jobs that restore the shared cache, and not for the ones that
  set `cache-mode: off` — both failures above were a job filling the disk with
  the cache, and a job without it has the runner's own 13.7 GB. That
  distinction is worth the line it costs: the "about 24 seconds" this
  description used to claim was measured once, on one runner. Across a single
  later run's ten jobs it took 38 to 175 seconds each, which is up to fifteen
  minutes of runner time per pull request.

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        set -euo pipefail

        # One awk instead of `tail -1 | tr -dc '0-9'`: three processes became
        # one, and a df that prints no data row now fails saying so instead of
        # yielding an empty string that the arithmetic below would treat as 0.
        before=$(df --output=avail -BM / | awk -f tools/lines/main.awk -v op=avail-mb)

        # What a cold Go build of this tree needs, and the one number in this
        # action. It is both the condition below and the guard at the bottom:
        # the same standard decides whether to make room and whether enough
        # was made, so the two cannot disagree.
        need=20000

        # Nothing to do when the room is already there, which is the ordinary
        # case now. Measured on run 35282937571: 87 476 MB free before this
        # ran, against a shared cache of 1 127 MB — 22 GB freed for one, at 30
        # seconds in one job and 74 in another.
        if [ "$before" -ge "$need" ]; then
          echo "free space: ${before} MB, already above ${need} MB — nothing removed"
          df -h /
          exit 0
        fi

        # Each of these is a preinstalled toolchain for a language or platform
        # this repository does not use. Removed rather than pruned: there is
        # nothing here to keep.
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL \
          || true
        # `|| true` tolerates a runner image that no longer ships one of these
        # paths. It is safe only because of the check below: a removal that
        # genuinely failed leaves the free space short, and that fails the job
        # with a reason. Without that check this line would hide the very
        # problem the action exists to prevent.

        after=$(df --output=avail -BM / | awk -f tools/lines/main.awk -v op=avail-mb)

        echo "free space: ${before} MB → ${after} MB (+$((after - before)) MB)"
        df -h /

        # A guard rather than a hope. If a future runner image drops these
        # paths, this action silently frees nothing and the job fails again
        # with the confusing disk error rather than here, with the reason.
        if [ "$after" -lt "$need" ]; then
          echo "::error::only ${after} MB free after cleanup; a cold Go build of this tree needs ${need} MB"
          exit 1
        fi
