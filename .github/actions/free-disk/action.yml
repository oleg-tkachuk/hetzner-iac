name: Free disk space
description: >
  Removes preinstalled toolchains this repository never uses, to make room for
  a cold Go build.

  A hosted runner starts with 13.7 GB free, and this repository's cache no
  longer fits in it. Measured on 2026-09-13, on a reader job with this action
  deliberately absent:

    baseline               13 720 MB
    after the toolchain    13 087 MB
    cache restore          died, no logs

  Because the restore needs 15.6 GB: the build cache is 14 155 MB and the
  module cache 1 452 MB. With this action the same job has 35 478 MB before
  the restore and 19 873 MB after it, and finishes.

  Those numbers used to read 4.4 GB and 810 MB. The build cache has tripled
  since, which is worth knowing for two reasons: this action is now
  load-bearing rather than defensive — removing it from a reader breaks the
  job outright — and the guard below, which wants 20 GB, is 127 MB away from
  firing on a successful run.

  It first went over the edge twice, in two different jobs and with two
  different faces:

    compile: writing output: write $WORK/b857/_pkg_.a: no space left on device
    failed to download vulnerability DB: write .../trivy.db: no space left on device

  The first sign of the first one was worse than the error — the disk filled far
  enough that the runner could not write its own log pages, so the job failed
  with no logs at all and looked like lost infrastructure.

  Which is why this runs inside setup-go rather than being added to the jobs
  that have failed so far: guessing which one is next is a game of whack-a-mole.

  It runs for the jobs that restore the shared cache, and not for the ones that
  set `cache-mode: off` — both failures above were a job filling the disk with
  the cache, and a job without it has the runner's own 13.7 GB. That
  distinction is worth the line it costs: the "about 24 seconds" this
  description used to claim was measured once, on one runner. Across a single
  later run's ten jobs it took 38 to 175 seconds each, which is up to fifteen
  minutes of runner time per pull request.

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        set -euo pipefail

        # One awk instead of `tail -1 | tr -dc '0-9'`: three processes became
        # one, and a df that prints no data row now fails saying so instead of
        # yielding an empty string that the arithmetic below would treat as 0.
        before=$(df --output=avail -BM / | awk -f tools/lines/main.awk -v op=avail-mb)

        # Each of these is a preinstalled toolchain for a language or platform
        # this repository does not use. Removed rather than pruned: there is
        # nothing here to keep.
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL \
          || true
        # `|| true` tolerates a runner image that no longer ships one of these
        # paths. It is safe only because of the check below: a removal that
        # genuinely failed leaves the free space short, and that fails the job
        # with a reason. Without that check this line would hide the very
        # problem the action exists to prevent.

        after=$(df --output=avail -BM / | awk -f tools/lines/main.awk -v op=avail-mb)

        echo "free space: ${before} MB → ${after} MB (+$((after - before)) MB)"
        df -h /

        # A guard rather than a hope. If a future runner image drops these
        # paths, this action silently frees nothing and the job fails again
        # with the confusing disk error rather than here, with the reason.
        if [ "$after" -lt 20000 ]; then
          echo "::error::only ${after} MB free after cleanup; a cold Go build of this tree needs more"
          exit 1
        fi
