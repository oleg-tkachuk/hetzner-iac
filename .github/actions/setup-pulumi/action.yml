name: Set up Pulumi
description: >
  Go, the Pulumi CLI at the pinned version, and a check that the access token
  is actually there.

# The three steps below appeared verbatim in every job of preview.yaml, and the
# token guard in two of them. Four copies of a preamble is four places for the
# pinned CLI version to drift, and the guard existed twice because the failure
# it catches — an environment with no secrets — is worth catching before Pulumi
# reports it as a login error naming neither the secret nor the environment.
#
# Checkout is deliberately NOT here: this file has to exist on disk before it
# can run, so the job that uses it must have checked out first.

inputs:
  access-token:
    description: The Pulumi access token. Passed as an input, not read from the environment, so the guard can say which environment is missing it.
    required: true
  stack:
    description: The stack being acted on. Used only to make the error name it.
    required: true
  pulumi-version:
    description: Override the pinned CLI version. The pin lives here so it is in one place.
    required: false
    default: "3.261.0"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-go

    - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
      with:
        pulumi-version: ${{ inputs.pulumi-version }}

    # Through env rather than interpolated into the script: a secret spliced
    # into a run block is a template injection, and zizmor is right to say so.
    - name: Require the access token
      shell: bash
      env:
        PULUMI_ACCESS_TOKEN: ${{ inputs.access-token }}
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail

        if [ -z "${PULUMI_ACCESS_TOKEN}" ]; then
          echo "::error::the ${STACK} environment holds no PULUMI_ACCESS_TOKEN"
          echo "create it with: gh secret set PULUMI_ACCESS_TOKEN --env ${STACK}" >&2
          exit 1
        fi
