# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  #
  # The git form is the default because someone who clones this repository has
  # no sibling checkout. Working on the library itself:
  #   TASKLIB: '../taskfiles/%s'
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v7.1.2'

  PROJECT_NAME: hetzner-iac
  ROOT: { sh: pwd }

  # Stack selects the environment. Every cluster and layer task takes it, and
  # nothing else about a deployment is a parameter: where a cluster lives and
  # how it is shaped comes from infra/cluster/cluster.<stack>.yaml, which is
  # committed.
  #
  #   task cluster:apply stack=dev
  # Required, and with no default on purpose. A default is how a command
  # aimed at one environment silently hits another: `platform:destroy layer=all`
  # with a forgotten stack= meant dev, and the once that is wrong is the once
  # it matters. Every message below names the task that was actually run.
  _STACK_USAGE: |
    {{.TASK}} needs a stack, and there is no default.

        task {{.TASK}} stack=dev

    The stack names both the Pulumi stack and
    infra/cluster/cluster.<stack>.yaml, which is where everything about that
    cluster is described.

  # The same, for the tasks that require a layer as well.
  #
  # Reported: `task platform:plan layer=10-node-platform` printed the message
  # above, and the command it suggests then failed with "missing required
  # variables: layer" — it named the argument that was missing and dropped the
  # one already passed. Held to naming both by
  # TestUsage_NamesEveryArgumentTheTaskRequires.
  #
  # One layer by name rather than layer=all: platform:destroy prints this too,
  # so the shortest correct command must not also be the widest — and
  # policy:layer, which takes no `all`, prints it as well.
  _STACK_LAYER_USAGE: |
    {{.TASK}} needs a stack and a layer, and neither has a default.

        task {{.TASK}} stack=dev layer=40-ingress

    `task platform:layers` prints the layers. The stack names both the Pulumi
    stack and infra/cluster/cluster.<stack>.yaml, which is where everything
    about that cluster is described.

  # Status markers, the same vocabulary internal/pkg/pulumilog prints from Go and the
  # shared library prints from shell. The shape carries the meaning, so a line
  # still reads in a monochrome log; the colour drops out under NO_COLOR.
  #
  # Held equal to internal/pkg/pulumilog's constants by
  # TestTaskGlyphs_MatchThePulumiLogger — two vocabularies in one terminal
  # session is what this replaces.
  _RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _SKIP: '{{if .NO_COLOR}}○{{else}}{{"\x1b[90m○\x1b[0m"}}{{end}}'
  _WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

  # The layers, in dependency order. This list is the only place the order
  # lives: `platform:apply layer=all` walks it, and CI derives its matrix from
  # `task platform:layers`. A hand-maintained second copy is how a matrix ends
  # up previewing directories that no longer exist.
  #
  # Only 30-cluster-services onwards is a preference. What comes before it is
  # not: a CNI-less node stays NotReady, so the cloud controller manager
  # cannot be scheduled to clear the taint that would make it Ready. That
  # ordering is a DependsOn inside 10-node-platform, where the engine enforces
  # it — this list only says which stack runs first.
  LAYERS: >-
    10-node-platform
    20-network-policy
    30-cluster-services
    40-ingress
    50-gitops
    60-backup

includes:
  # `excludes:` genuinely removes a task rather than hiding it, so what is left
  # is what actually works here. A module task that cannot succeed in this
  # repository is worse than a missing one: it is a command someone runs once,
  # in an emergency, and gets a confusing failure from.
  go:
    taskfile: '{{printf .TASKLIB "go"}}'
    dir: .
    vars:
      # Points test:tagged:compile at the e2e suite, which is the only
      # build-tagged code here. Without this it type-checks the `integration`
      # tag, which nothing in this repository uses.
      GO_TEST_TAGS: e2e
    excludes:
      # No ./cmd/... to build: the Pulumi programs are compiled by Pulumi's own
      # language host into .cache, and the tools are run with `go run`.
      - build
      # No benchmarks.
      - bench
      # No integration suite. The e2e suite uses its own tag and needs a live
      # cluster, so it has its own entry point — `task e2e`.
      - test:integration

  # The Hetzner servers this cluster runs on. The module knows nothing about
  # Pulumi or the topology, so both of the things it cannot know are passed as
  # commands rather than values — they run inside the task, which is what
  # keeps `task --list` from reaching for a credential.
  hcloud:
    taskfile: '{{printf .TASKLIB "hcloud"}}'
    dir: .
    vars:
      # The label internal/pkg/hetzner stamps on every server of a cluster, read
      # through the real parser rather than grepped out of the yaml: an empty
      # selector matches every server in the project, which for a power
      # command is the difference between one cluster and all of them.
      HCLOUD_SELECTOR_CMD: 'printf "%s\n" "cluster=$(go run ./tools/topology get cluster-name infra/cluster/cluster.{{.stack}}.yaml)"'
      # The token out of the encrypted stack config, the same resolution every
      # other task here uses.
      HCLOUD_TOKEN_CMD: 'go run ./tools/token {{.stack}}'

  security:
    taskfile: '{{printf .TASKLIB "security"}}'
    dir: .
    vars:
      # trivy does not pick the ignore file up by itself.
      TRIVY_FLAGS: "--ignorefile .trivyignore.yaml"
      # Bound gosec's memory. It loads every analysed package with full syntax
      # AND full type information for the whole transitive graph
      # (packages.NeedSyntax|NeedTypes|NeedTypesInfo), and processes up to
      # -concurrency packages at once — which defaults to the core count.
      #
      # This module's graph is 208 modules dominated by the generated Pulumi
      # Kubernetes SDK, so one worker's graph is already large; fourteen of
      # them on a developer laptop exhausts memory and the machine swaps.
      #
      # Computed rather than fixed, because the fixed value was wrong about the
      # machine it claimed to suit. It said 4 "is the CI runner's core count,
      # so this costs nothing there" — a standard runner on a PRIVATE
      # repository has TWO cores and 8 GB, four being what a public one gets.
      # So on CI the cap was not a cap at all: it oversubscribed two cores
      # twofold, which cannot add throughput and can only add memory pressure,
      # the exact opposite of what it is for.
      #
      # min(4, cores) keeps the laptop capped and lets the runner use what it
      # actually has, with no belief about either encoded here.
      GOSEC_FLAGS:
        sh: |
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || printf '%s' 2)"
          [ "$cores" -gt 4 ] && cores=4
          # The value as an ARGUMENT to %s, never as the format: it begins
          # with a dash, and Task's embedded shell reads `printf --` with the
          # dashes as the format string itself — which silently produced the
          # flag "--" on the first attempt, and gosec would have taken it.
          printf '%s' "-concurrency=$cores"
    excludes:
      # No protobuf here.
      - proto:breaking
      # No Dockerfile here either: this repository ships infrastructure code,
      # not an image. hadolint over nothing printed nothing and exited zero,
      # which is the confusing kind of success — a check that appears to run
      # and asserts nothing.
      - dockerfile

  helm:
    taskfile: '{{printf .TASKLIB "helm"}}'
    dir: .
    excludes:
      # Every release on this cluster is created by Pulumi. Uninstalling them
      # with Helm would leave Pulumi state claiming they exist, so the next
      # `up` reports no changes while the cluster is empty. Destroy through
      # `task platform:destroy` instead.
      #
      # The name matters and the failure is silent: `excludes` naming a task
      # the module does not have removes nothing, and says nothing. It was
      # `uninstall-all` until taskfiles v6.0.0 renamed it — so the bump that
      # carried the rename would have quietly handed this repository a helm
      # uninstall it must not have. TestHelmUninstall_IsNotAvailable is the
      # thing that notices.
      - uninstall

  # The k8s module is deliberately NOT included. Every task in it assumes the
  # repository ships one deployable component — it rolls a Deployment named
  # after the project and installs from ./deploy/chart. This repository ships a
  # platform, deployed by Pulumi, and neither of those exists.

  cluster: { taskfile: tasks/cluster.task.yaml, dir: . }
  platform: { taskfile: tasks/platform.task.yaml, dir: . }
  charts: { taskfile: tasks/charts.task.yaml, dir: . }
  policy: { taskfile: tasks/policy.task.yaml, dir: . }

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Whole-platform entry points
  # ---------------------------------------------------------------------------

  up:
    desc: "Bring up everything from nothing: cluster, then every layer in order"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    # No prompt of its own: the two tasks below each have one, and Task asks
    # per task it runs. A third here would make bringing up a cluster three
    # questions, and the two that remain are the two real decisions — the
    # servers, then everything on them.
    cmds:
      - task: cluster:apply
      - task: platform:apply
        vars: {layer: all}

  destroy:
    desc: "Destroy everything this repository created: every layer, then the cluster. Asks first."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    # Named `destroy`, not `down`, and the reason is the command surface rather
    # than taste.
    #
    # This repository has exactly one verb for destruction — cluster:destroy,
    # cluster:secrets:destroy, platform:destroy — so
    # `down` would be a second word for one action. `destroy-all` was worse
    # still, and is gone: the layer tier takes `layer=all` now instead of
    # carrying a second task per verb.
    #
    # `up` stays `up` and is not the same inconsistency: Pulumi's own pair is
    # `pulumi up` and `pulumi destroy`, asymmetric upstream, so these two
    # names are the tool's vocabulary rather than a borrowed one. `down` comes
    # from docker compose, which this repository does not use anywhere.
    #
    # The practical half: somebody tearing an environment down runs
    # `task --list | grep destroy`. Under the old name the one task that does
    # the whole job was the only one that did not appear.
    #
    # The inverse of `up`, and unlike `up` it carries its own prompt.
    #
    # `up` deliberately has none: its two children each ask, and a third
    # question would add nothing to a decision the operator already made twice.
    # A teardown is not symmetrical with that. The children's prompts each name
    # one half — "every platform layer", "every server" — and neither says what
    # SURVIVES. That is the sentence somebody needs before answering, because
    # the answer is irreversible and the leftovers are what a rebuild depends
    # on. So the whole truth is in the prompt below, and Task then asks the two
    # narrower questions as it runs each child.
    prompt: >-
      DESTROY the {{.stack}} cluster and everything on it? Every platform layer
      goes first, then the servers, the API load balancer, the network, the
      firewall and the placement group. An ingress load balancer, if one
      exists, goes with its layer — the cloud controller manager owns it, not
      Pulumi. KEPT: the Talos secrets bundle (the cluster CA is state, not a
      billed resource; `task cluster:secrets:destroy stack={{.stack}}` removes
      it and cannot be undone), the Talos snapshot in the Hetzner project, and
      this stack's Pulumi history. Irreversible
    cmds:
      # Layers first. A cluster whose CNI has been removed under a running
      # workload is the same ordering hazard `platform:destroy layer=all`
      # documents,
      # and destroying the servers first would leave every layer's state
      # describing resources that no longer exist.
      - task: platform:destroy
        vars: {layer: all}
      - task: cluster:destroy
      # What is left, and then the check that says whether anything was. The
      # ordering is the point: orphans reads the Hetzner project, and with no
      # server carrying the cluster's label it knows the cluster is gone and
      # judges against empty claims rather than refusing.
      - cmd: |
          printf '%s\n' "{{._SKIP}} hetzner-iac · destroy · kept: the Talos secrets bundle, the project snapshot, and this stack's Pulumi history"
      - task: cluster:orphans

  plan:
    desc: "Preview the cluster and every layer without changing anything"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - task: cluster:plan
      - task: platform:plan
        vars: {layer: all}

  # ---------------------------------------------------------------------------
  # Gates. These are what CI runs, so a green local run means a green PR.
  # ---------------------------------------------------------------------------

  build:
    desc: "Compile every program into bin/"
    cmds:
      # -o with a directory puts all thirteen binaries in one place. Without
      # it `go build ./...` names each after its main package and leaves it in
      # the working directory, where the names collide with the tools/,
      # layers/ and infra/ directory names — which is how a 52 MB layer binary
      # came to be committed once, and how two more reached the tree since.
      - go build -o {{.ROOT}}/bin/ ./...
      - cmd: 'printf "%s\n" "{{._OK}} hetzner-iac · build · $(ls {{.ROOT}}/bin | awk "END {print NR}") programs into bin/"'
        silent: true

  lint:
    desc: "golangci-lint at the version CI pins, not whatever PATH offers"
    cmds:
      - go run {{.ROOT}}/tools/golangci run {{.CLI_ARGS | default "./..."}}

  lint:install:
    desc: "Download the golangci-lint CI pins into bin/, for this platform"
    # The same shape as cluster:talosctl:install, and for the same reason:
    # Homebrew carries one golangci-lint and a Go install carries another, and
    # a linter whose version differs from CI's reports different findings —
    # measured, eight of them, on an untouched main.
    #
    # The version is read from the workflow rather than written here, so there
    # is one thing to bump and Renovate already bumps it.
    preconditions:
      - sh: command -v curl >/dev/null
        msg: "curl not installed — it ships with macOS, so this is unexpected"
      - sh: command -v tar >/dev/null
        msg: "tar not installed"
    cmds:
      - cmd: |
          set -euo pipefail

          version="$(awk -F\" '/GOLANGCI_VERSION:/ {print $2}' "{{.ROOT}}/.github/workflows/ci.yaml")"
          if [ -z "${version}" ]; then
            printf '%s\n' "{{._ERR}} hetzner-iac · lint · no GOLANGCI_VERSION in .github/workflows/ci.yaml" >&2
            exit 1
          fi

          # The release assets carry the version without its v, and the tag
          # carries it with one.
          bare="${version#v}"

          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) printf '%s\n' "{{._ERR}} hetzner-iac · lint · unknown architecture $(uname -m)" >&2; exit 1 ;;
          esac

          name="golangci-lint-${bare}-${os}-${arch}"
          url="https://github.com/golangci/golangci-lint/releases/download/${version}/${name}.tar.gz"

          printf '%s\n' "{{._RUN}} hetzner-iac · lint · ${version} for ${os}/${arch}"

          mkdir -p "{{.ROOT}}/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          curl -sSfL "$url" | tar -xz -C "${tmp}" "${name}/golangci-lint"
          install -m 0755 "${tmp}/${name}/golangci-lint" "{{.ROOT}}/bin/golangci-lint"

          # Proves the download is what it claims before anything depends on
          # it: a 404 saved to disk is executable-shaped and fails later with
          # something unrelated.
          got="$("{{.ROOT}}/bin/golangci-lint" --version | awk '/has version/ {print $4}')"
          if [ "${got}" != "${bare}" ]; then
            printf '%s\n' "{{._ERR}} hetzner-iac · lint · downloaded ${got}, wanted ${bare}" >&2
            exit 1
          fi

          printf '%s\n' "{{._OK}} hetzner-iac · lint · bin/golangci-lint is ${got}, which is what CI runs"

  verify:
    desc: "Everything checkable without a cluster — needs helm, kubeconform, talosctl and lychee"
    cmds:
      - task: fmt-check
      - task: go:test
      # Not go:lint: that runs whatever golangci-lint is on PATH, and this one
      # runs the version CI pins.
      - task: lint
      - task: go:vuln
      - task: charts:validate
      - task: charts:render-check
      - task: docs:links
      # The checks that ask the real tool rather than trusting our own tests.
      # Each states what to install if it is missing: a gate that skips itself
      # when a tool is absent is a gate that quietly stops running.
      - task: cluster:machine-config:check

  # Named scan rather than security: `security` is already the include's
  # namespace, and two meanings for one word at the command line is a coin flip.
  scan:
    desc: "Every scanner CI runs — needs gitleaks, gosec, trivy and checkov installed"
    cmds:
      # Named one by one, and NOT the module's composite, for two reasons that
      # both came out of the v7.0.0 bump.
      #
      # It was broken. The include excludes `dockerfile` — deliberately, see
      # the comment there — and a task removed by `excludes` is not skipped
      # inside a composite, it is missing. So the aggregate died with
      # `Task "security:dockerfile" does not exist`, on v6.0.0 too, and
      # nothing noticed because CI calls the scans as separate jobs and never
      # this task.
      #
      # And it was inaccurate. The composite also runs `lint`, which CI does
      # not: golangci-lint runs there through its own action in the Go lint
      # job. The list below is what the workflows actually call — which is the
      # only thing that makes the claim above true.
      - task: security:secrets
      - task: security:vuln
      - task: security:trivy
      - task: security:gosec
      - task: checkov

  checkov:
    desc: "checkov — hardening rules over the manifests and workflows this repository ships"
    preconditions:
      - sh: command -v checkov >/dev/null || command -v pipx >/dev/null
        msg: "checkov is not installed — pipx install checkov, or brew install checkov"
    cmds:
      # Flags live in .checkov.yaml, not here, so a local run and the CI job
      # assert the same thing. pipx as the fallback because checkov is a
      # Python tool and CI installs it that way.
      #
      # The version is READ from the workflow, not written here. It was written
      # here — `${CHECKOV_VERSION:-3.3.17}` — and that default is only ever
      # used locally, because CI sets the variable. So the moment the pin moved
      # to 3.3.18 a local run installed 3.3.17 and asserted against different
      # rules, silently. One copy, in the file Renovate already bumps.
      - cmd: |
          set -euo pipefail
          if command -v checkov >/dev/null; then
            checkov --config-file "{{.ROOT}}/.checkov.yaml"
          else
            version="${CHECKOV_VERSION:-$(awk -F'"' '/CHECKOV_VERSION:/ {print $2}' "{{.ROOT}}/.github/workflows/ci.yaml")}"
            if [ -z "$version" ]; then
              printf '%s\n' "{{._ERR}} hetzner-iac · checkov · no CHECKOV_VERSION in .github/workflows/ci.yaml" >&2
              exit 1
            fi
            pipx run "checkov==${version}" --config-file "{{.ROOT}}/.checkov.yaml"
          fi

  docs:links:
    desc: "Do the documentation's own links point at files and headings that exist? — needs lychee"
    preconditions:
      - sh: command -v lychee >/dev/null
        msg: "lychee is not installed — brew install lychee, or take the pinned version from .github/workflows/ci.yaml"
    cmds:
      # Offline on purpose, and that is the whole design. This answers "does
      # what the documentation points at exist", which is a property of this
      # tree; whether some vendor's marketing page is up today is not, and a
      # gate that fails on somebody else's outage is a gate people learn to
      # re-run rather than read. GitHub's own release downloads returned 504
      # for twenty minutes while this was being written.
      #
      # --include-fragments=full is the half a path check misses: a heading
      # renamed in docs/operations.md leaves every `#anchor` pointing at it
      # silently wrong, and GitHub renders that as the top of the page rather
      # than as an error.
      #
      # Two globs because lychee expands them itself and `**` does not descend
      # into a dot directory, so .github/SECURITY.md needs naming.
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}"
          lychee --offline --include-fragments=full --include-mail=false --no-progress \
            '**/*.md' '.github/**/*.md'

  fmt-check:
    desc: "Fail if any Go file is not gofmt-clean"
    # The library's gate rather than eight lines of `gofmt -l` here. It
    # checks `gofmt -s`, which is strictly more than this task did: the
    # simplifications gofmt -s makes were never asserted, so a file could be
    # gofmt-clean here and rewritten by `task fmt` on the next run.
    cmds:
      - task: go:fmt:check

  fmt:
    desc: "Format every Go file and tidy the module"
    cmds:
      - task: go:fmt
      - task: go:tidy

  e2e:
    desc: "Verify a real cluster — read-only, safe against production"
    # No stack guard: the suite reads ./kubeconfig and never names a stack.
    # Requiring one would make this fail for somebody who already has the
    # file, which is the only thing it actually needs.
    cmds:
      - cmd: |
          set -euo pipefail
          [ -f "{{.ROOT}}/kubeconfig" ] || {
            printf '%s\n' "{{._ERR}} hetzner-iac · e2e · no ./kubeconfig — run: task cluster:kubeconfig stack=<name>" >&2
            exit 1
          }
          # The suite verifies the cluster this repository built, so it runs
          # against an existing one rather than spinning up a throwaway: none
          # of the Hetzner integration exists in a local cluster.
          go test -tags e2e -count=1 -v -timeout 30m ./test/e2e/... \
            --kubeconfig "{{.ROOT}}/kubeconfig"

  clean:
    desc: "Remove build output — bin/ and the layer binaries Pulumi compiles into .cache"
    cmds:
      # Both output directories, because there are two: `task build` writes
      # bin/ and Pulumi's language host writes .cache/pulumi-bin, one
      # buildTarget per project. Removing only the second left 988 MB of
      # binaries behind, which is how a full disk turned into
      # `link: mapping output file failed: no space left on device`.
      - rm -rf {{.ROOT}}/bin {{.ROOT}}/.cache/pulumi-bin
