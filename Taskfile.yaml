# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  #
  # The git form is the default because someone who clones this repository has
  # no sibling checkout. Working on the library itself:
  #   TASKLIB: '../taskfiles/%s'
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v7.3.1'

  PROJECT_NAME: hetzner-iac
  ROOT: { sh: pwd }

  # Stack selects the environment. Every cluster and layer task takes it, and
  # nothing else about a deployment is a parameter: where a cluster lives and
  # how it is shaped comes from infra/cluster/cluster.<stack>.yaml, which is
  # committed.
  #
  #   task cluster:apply stack=dev
  # Required, and with no default on purpose. A default is how a command
  # aimed at one environment silently hits another: `platform:destroy layer=all`
  # with a forgotten stack= meant dev, and the once that is wrong is the once
  # it matters. Every message below names the task that was actually run.
  _STACK_USAGE: |
    {{.TASK}} needs a stack, and there is no default.

        task {{.TASK}} stack=dev

    The stack names both the Pulumi stack and
    infra/cluster/cluster.<stack>.yaml, which is where everything about that
    cluster is described.

  # The same, for the tasks that require a layer as well.
  #
  # Reported: `task platform:plan layer=10-node-platform` printed the message
  # above, and the command it suggests then failed with "missing required
  # variables: layer" — it named the argument that was missing and dropped the
  # one already passed. Held to naming both by
  # TestUsage_NamesEveryArgumentTheTaskRequires.
  #
  # One layer by name rather than layer=all: platform:destroy prints this too,
  # so the shortest correct command must not also be the widest — and
  # policy:layer, which takes no `all`, prints it as well.
  _STACK_LAYER_USAGE: |
    {{.TASK}} needs a stack and a layer, and neither has a default.

        task {{.TASK}} stack=dev layer=40-ingress

    `task platform:layers` prints the layers. The stack names both the Pulumi
    stack and infra/cluster/cluster.<stack>.yaml, which is where everything
    about that cluster is described.

  # Status markers, the same vocabulary internal/pkg/pulumilog prints from Go and the
  # shared library prints from shell. The shape carries the meaning, so a line
  # still reads in a monochrome log; the colour drops out under NO_COLOR.
  #
  # Held equal to internal/pkg/pulumilog's constants by
  # TestTaskGlyphs_MatchThePulumiLogger — two vocabularies in one terminal
  # session is what this replaces.
  _RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _SKIP: '{{if .NO_COLOR}}○{{else}}{{"\x1b[90m○\x1b[0m"}}{{end}}'
  _WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

  # The layers, in dependency order. This list is the only place the order
  # lives: `platform:apply layer=all` walks it, and CI derives its matrix from
  # `task platform:layers`. A hand-maintained second copy is how a matrix ends
  # up previewing directories that no longer exist.
  #
  # Only 30-cluster-services onwards is a preference. What comes before it is
  # not: a CNI-less node stays NotReady, so the cloud controller manager
  # cannot be scheduled to clear the taint that would make it Ready. That
  # ordering is a DependsOn inside 10-node-platform, where the engine enforces
  # it — this list only says which stack runs first.
  LAYERS: >-
    10-node-platform
    20-network-policy
    30-cluster-services
    40-ingress
    50-gitops

  # The tiers, which are the projects under infra/. Unordered on purpose:
  # unlike the layers there is no walk to order, each is applied on its own —
  # see docs/design.md, "What decides a layer boundary". The list exists so
  # that checks which must cover every project, `policy:check` above all, are
  # not a second hand-maintained copy of what infra/ holds.
  # Held equal to the directories by TestTiers_MatchTheDirectories.
  TIERS: >-
    cluster
    backup

includes:
  # `excludes:` genuinely removes a task rather than hiding it, so what is left
  # is what actually works here. A module task that cannot succeed in this
  # repository is worse than a missing one: it is a command someone runs once,
  # in an emergency, and gets a confusing failure from.
  # The Hetzner servers this cluster runs on. The module knows nothing about
  # Pulumi or the topology, so both of the things it cannot know are passed as
  # commands rather than values — they run inside the task, which is what
  # keeps `task --list` from reaching for a credential.
  hcloud:
    taskfile: '{{printf .TASKLIB "hcloud"}}'
    dir: .
    vars:
      # The label internal/pkg/hetzner stamps on every server of a cluster, read
      # through the real parser rather than grepped out of the yaml: an empty
      # selector matches every server in the project, which for a power
      # command is the difference between one cluster and all of them.
      HCLOUD_SELECTOR_CMD: 'printf "%s\n" "cluster=$(go run ./tools/topology get cluster-name infra/cluster/cluster.{{.stack}}.yaml)"'
      # The token out of the encrypted stack config, the same resolution every
      # other task here uses.
      HCLOUD_TOKEN_CMD: 'go run ./tools/token {{.stack}}'

  helm:
    taskfile: '{{printf .TASKLIB "helm"}}'
    dir: .
    excludes:
      # Every release on this cluster is created by Pulumi. Uninstalling them
      # with Helm would leave Pulumi state claiming they exist, so the next
      # `up` reports no changes while the cluster is empty. Destroy through
      # `task platform:destroy` instead.
      #
      # The name matters and the failure is silent: `excludes` naming a task
      # the module does not have removes nothing, and says nothing. It was
      # `uninstall-all` until taskfiles v6.0.0 renamed it — so the bump that
      # carried the rename would have quietly handed this repository a helm
      # uninstall it must not have. TestLibraryExcludes_StayInPlace is the thing
      # that notices.
      - uninstall

  # The k8s module is deliberately NOT included. Every task in it assumes the
  # repository ships one deployable component — it rolls a Deployment named
  # after the project and installs from ./deploy/chart. This repository ships a
  # platform, deployed by Pulumi, and neither of those exists.

  # backup is a tier rather than a layer — see docs/design.md, "What decides a
  # layer boundary" — so it has its own module instead of a place in
  # platform's ordered walk.
  backup: { taskfile: tasks/backup.task.yaml, dir: . }
  cluster: { taskfile: tasks/cluster.task.yaml, dir: . }
  platform: { taskfile: tasks/platform.task.yaml, dir: . }
  policy: { taskfile: tasks/policy.task.yaml, dir: . }

tasks:
  default:
    desc: "List the tasks for operating a cluster"
    cmds:
      - task --list
      # Otherwise the checks are undiscoverable: they are deliberately not
      # in this list, and nothing else says where they went.
      - cmd: |
          printf '\n%s\n' "Checks, formatting and chart pins: task -t Taskfile.dev.yaml --list"

  # ---------------------------------------------------------------------------
  # Whole-platform entry points
  # ---------------------------------------------------------------------------

  up:
    desc: "Bring up everything from nothing: cluster, then every layer in order"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    # No prompt of its own: the two tasks below each have one, and Task asks
    # per task it runs. A third here would make bringing up a cluster three
    # questions, and the two that remain are the two real decisions — the
    # servers, then everything on them.
    cmds:
      - task: cluster:apply
      - task: platform:apply
        vars: {layer: all}

  destroy:
    desc: "Destroy everything this repository created: every layer, then the cluster. Asks first."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    # Named `destroy`, not `down`, and the reason is the command surface rather
    # than taste.
    #
    # This repository has exactly one verb for destruction — cluster:destroy,
    # cluster:secrets:destroy, platform:destroy — so
    # `down` would be a second word for one action. `destroy-all` was worse
    # still, and is gone: the layer tier takes `layer=all` now instead of
    # carrying a second task per verb.
    #
    # `up` stays `up` and is not the same inconsistency: Pulumi's own pair is
    # `pulumi up` and `pulumi destroy`, asymmetric upstream, so these two
    # names are the tool's vocabulary rather than a borrowed one. `down` comes
    # from docker compose, which this repository does not use anywhere.
    #
    # The practical half: somebody tearing an environment down runs
    # `task --list | grep destroy`. Under the old name the one task that does
    # the whole job was the only one that did not appear.
    #
    # The inverse of `up`, and unlike `up` it carries its own prompt.
    #
    # `up` deliberately has none: its two children each ask, and a third
    # question would add nothing to a decision the operator already made twice.
    # A teardown is not symmetrical with that. The children's prompts each name
    # one half — "every platform layer", "every server" — and neither says what
    # SURVIVES. That is the sentence somebody needs before answering, because
    # the answer is irreversible and the leftovers are what a rebuild depends
    # on. So the whole truth is in the prompt below, and Task then asks the two
    # narrower questions as it runs each child.
    prompt: >-
      DESTROY the {{.stack}} cluster and everything on it? Every platform layer
      goes first, then the servers, the API load balancer, the network, the
      firewall and the placement group. An ingress load balancer, if one
      exists, goes with its layer — the cloud controller manager owns it, not
      Pulumi. KEPT: the Talos secrets bundle (the cluster CA is state, not a
      billed resource; `task cluster:secrets:destroy stack={{.stack}}` removes
      it and cannot be undone), the Talos snapshot in the Hetzner project, the
      backup tier with the etcd snapshots on it — it is billed, and
      `task backup:destroy stack={{.stack}}` is the only thing that takes it —
      and this stack's Pulumi history. Irreversible
    cmds:
      # Layers first. A cluster whose CNI has been removed under a running
      # workload is the same ordering hazard `platform:destroy layer=all`
      # documents,
      # and destroying the servers first would leave every layer's state
      # describing resources that no longer exist.
      - task: platform:destroy
        vars: {layer: all}
      - task: cluster:destroy
      # What is left, and then the check that says whether anything was. The
      # ordering is the point: orphans reads the Hetzner project, and with no
      # server carrying the cluster's label it knows the cluster is gone and
      # judges against empty claims rather than refusing.
      - cmd: |
          printf '%s\n' "{{._SKIP}} hetzner-iac · destroy · kept: the Talos secrets bundle, the project snapshot, and this stack's Pulumi history"
      - task: cluster:orphans

  plan:
    desc: "Preview the cluster and every layer without changing anything"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - task: cluster:plan
      - task: platform:plan
        vars: {layer: all}

  # ---------------------------------------------------------------------------
  # Building and running what is deployed. The checks are NOT here — they
  # live in Taskfile.dev.yaml, and TestRootTaskfile_HoldsNoCheck keeps them
  # there.
  # ---------------------------------------------------------------------------

  build:
    desc: "Compile every program into bin/"
    cmds:
      # -o with a directory puts all thirteen binaries in one place. Without
      # it `go build ./...` names each after its main package and leaves it in
      # the working directory, where the names collide with the tools/,
      # layers/ and infra/ directory names — which is how a 52 MB layer binary
      # came to be committed once, and how two more reached the tree since.
      - go build -o "{{.ROOT}}/bin/" ./...
      - cmd: |
          programs="$(find "{{.ROOT}}/bin" -maxdepth 1 -type f | awk 'END {print NR}')"
          printf '%s\n' "{{._OK}} hetzner-iac · build · ${programs} programs into bin/"
        silent: true

  e2e:
    desc: "Verify a real cluster — read-only, safe against production"
    # No stack guard: the suite reads ./kubeconfig and never names a stack.
    # Requiring one would make this fail for somebody who already has the
    # file, which is the only thing it actually needs.
    cmds:
      - cmd: |
          set -euo pipefail
          [ -f "{{.ROOT}}/kubeconfig" ] || {
            printf '%s\n' "{{._ERR}} hetzner-iac · e2e · no ./kubeconfig — run: task cluster:kubeconfig stack=<name>" >&2
            exit 1
          }
          # The suite verifies the cluster this repository built, so it runs
          # against an existing one rather than spinning up a throwaway: none
          # of the Hetzner integration exists in a local cluster.
          go test -tags e2e -count=1 -v -timeout 30m ./test/e2e/... \
            --kubeconfig "{{.ROOT}}/kubeconfig"

  clean:
    desc: "Remove build output — bin/ and the layer binaries Pulumi compiles into .cache"
    cmds:
      # Both output directories, because there are two: `task build` writes
      # bin/ and Pulumi's language host writes .cache/pulumi-bin, one
      # buildTarget per project. Removing only the second left 988 MB of
      # binaries behind, which is how a full disk turned into
      # `link: mapping output file failed: no space left on device`.
      - cmd: |
          root="{{.ROOT}}"
          rm -rf "${root:?}/bin" "${root:?}/.cache/pulumi-bin"
