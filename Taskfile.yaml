# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  #
  # The git form is the default because someone who clones this repository has
  # no sibling checkout. Working on the library itself:
  #   TASKLIB: '../taskfiles/%s'
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v5.2.0'

  PROJECT_NAME: hetzner-iac
  ROOT: { sh: pwd }

  # Stack selects the environment. Every cluster and layer task takes it, and
  # nothing else about a deployment is a parameter: where a cluster lives and
  # how it is shaped comes from infra/cluster/cluster.<stack>.yaml, which is
  # committed.
  #
  #   task cluster:apply stack=dev
  # Required, and with no default on purpose. A default is how a command
  # aimed at one environment silently hits another: `platform:destroy-all`
  # with a forgotten stack= meant dev, and the once that is wrong is the once
  # it matters. Every message below names the task that was actually run.
  _STACK_USAGE: |
    {{.TASK}} needs a stack, and there is no default.

        task {{.TASK}} stack=dev

    The stack names both the Pulumi stack and
    infra/cluster/cluster.<stack>.yaml, which is where everything about that
    cluster is described.
  _REF_USAGE: |
    {{.TASK}} needs the cluster tier's stack reference.

        task {{.TASK}} stack=dev ref=<org>/hetzner-cluster/dev

    Every layer reads the kubeconfig through it; `pulumi whoami` gives the org.

  # The layers, in dependency order. This list is the only place the order
  # lives: platform:apply-all walks it, and CI derives its preview matrix from
  # `task platform:layers`. A hand-maintained second copy is how a matrix ends
  # up previewing directories that no longer exist.
  # The CNI comes before the cloud controller manager, and the reason is a
  # deadlock rather than a preference. A CNI-less node carries
  # The order layers are applied in. Only 30-core onwards is a preference;
  # everything 10-node-platform needs to do in sequence is a DependsOn inside
  # that one stack, where the engine enforces it.
  LAYERS: >-
    10-node-platform
    20-network-policy
    30-core
    40-ingress
    50-gitops
    60-observability

includes:
  # `excludes:` genuinely removes a task rather than hiding it, so what is left
  # is what actually works here. A module task that cannot succeed in this
  # repository is worse than a missing one: it is a command someone runs once,
  # in an emergency, and gets a confusing failure from.
  go:
    taskfile: '{{printf .TASKLIB "go"}}'
    dir: .
    vars:
      # Points test:tagged:compile at the e2e suite, which is the only
      # build-tagged code here. Without this it type-checks the `integration`
      # tag, which nothing in this repository uses.
      GO_TEST_TAGS: e2e
    excludes:
      # No ./cmd/... to build: the Pulumi programs are compiled by Pulumi's own
      # language host into .cache, and the tools are run with `go run`.
      - build
      # No benchmarks.
      - bench
      # No integration suite. The e2e suite uses its own tag and needs a live
      # cluster, so it has its own entry point — `task e2e`.
      - test:integration

  security:
    taskfile: '{{printf .TASKLIB "security"}}'
    dir: .
    vars:
      # trivy does not pick the ignore file up by itself.
      TRIVY_FLAGS: "--ignorefile .trivyignore.yaml"
      # Bound gosec's memory. It loads every analysed package with full syntax
      # AND full type information for the whole transitive graph
      # (packages.NeedSyntax|NeedTypes|NeedTypesInfo), and processes up to
      # -concurrency packages at once — which defaults to the core count.
      #
      # This module's graph is 208 modules dominated by the generated Pulumi
      # Kubernetes SDK, so one worker's graph is already large; fourteen of
      # them on a developer laptop exhausts memory and the machine swaps.
      #
      # Four is the CI runner's core count, so this costs nothing there and
      # caps peak memory at roughly a quarter on a bigger machine.
      GOSEC_FLAGS: "-concurrency=4"
    excludes:
      # No protobuf here.
      - proto:breaking

  helm:
    taskfile: '{{printf .TASKLIB "helm"}}'
    dir: .
    excludes:
      # Every release on this cluster is created by Pulumi. Uninstalling them
      # with Helm would leave Pulumi state claiming they exist, so the next
      # `up` reports no changes while the cluster is empty. Destroy through
      # `task platform:destroy` instead.
      - uninstall-all

  # The k8s module is deliberately NOT included. Every task in it assumes the
  # repository ships one deployable component — it rolls a Deployment named
  # after the project and installs from ./deploy/chart. This repository ships a
  # platform, deployed by Pulumi, and neither of those exists.

  cluster: { taskfile: tasks/cluster.task.yaml, dir: . }
  platform: { taskfile: tasks/platform.task.yaml, dir: . }
  charts: { taskfile: tasks/charts.task.yaml, dir: . }
  observability: { taskfile: tasks/observability.task.yaml, dir: . }

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Whole-platform entry points
  # ---------------------------------------------------------------------------

  up:
    desc: "Bring up everything from nothing: cluster, then every layer in order"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - task: cluster:apply
      - task: platform:apply-all

  plan:
    desc: "Preview the cluster and every layer without changing anything"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - task: cluster:plan
      - task: platform:plan-all

  # ---------------------------------------------------------------------------
  # Gates. These are what CI runs, so a green local run means a green PR.
  # ---------------------------------------------------------------------------

  build:
    desc: "Compile every program into bin/"
    cmds:
      # -o with a directory puts all thirteen binaries in one place. Without
      # it `go build ./...` names each after its main package and leaves it in
      # the working directory, where the names collide with the tools/,
      # layers/ and infra/ directory names — which is how a 52 MB layer binary
      # came to be committed once, and how two more reached the tree since.
      - go build -o {{.ROOT}}/bin/ ./...
      - cmd: 'echo "built into bin/ — $(ls {{.ROOT}}/bin | wc -l | tr -d " ") programs"'
        silent: true

  verify:
    desc: "Everything checkable without a cluster — needs helm, talosctl and docker"
    cmds:
      - task: fmt-check
      - task: go:test
      - task: go:lint
      - task: go:vuln
      - task: charts:validate
      - task: charts:render-check
      # The checks that ask the real tool rather than trusting our own tests.
      # Each states what to install if it is missing: a gate that skips itself
      # when a tool is absent is a gate that quietly stops running.
      - task: cluster:config-check
      - task: observability:check

  # Named scan rather than security: `security` is already the include's
  # namespace, and two meanings for one word at the command line is a coin flip.
  scan:
    desc: "Every scanner CI runs — needs gitleaks, gosec, trivy and checkov installed"
    cmds:
      # The same tasks .github/workflows/security.yaml calls, so a green run
      # here is a green run there.
      - task: security:all
      - task: checkov

  checkov:
    desc: "checkov — hardening rules over the manifests and workflows this repository ships"
    preconditions:
      - sh: command -v checkov >/dev/null || command -v pipx >/dev/null
        msg: "checkov is not installed — pipx install checkov, or brew install checkov"
    cmds:
      # Flags live in .checkov.yaml, not here, so a local run and the CI job
      # assert the same thing. pipx as the fallback because checkov is a
      # Python tool and CI installs it that way.
      - cmd: |
          set -euo pipefail
          if command -v checkov >/dev/null; then
            checkov --config-file "{{.ROOT}}/.checkov.yaml"
          else
            pipx run "checkov==${CHECKOV_VERSION:-3.3.17}" --config-file "{{.ROOT}}/.checkov.yaml"
          fi

  fmt-check:
    desc: "Fail if any Go file is not gofmt-clean"
    cmds:
      - cmd: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  fmt:
    desc: "Format every Go file and tidy the module"
    cmds:
      - task: go:fmt
      - task: go:tidy

  e2e:
    desc: "Verify a real cluster — read-only, safe against production"
    # No stack guard: the suite reads ./kubeconfig and never names a stack.
    # Requiring one would make this fail for somebody who already has the
    # file, which is the only thing it actually needs.
    cmds:
      - cmd: |
          set -euo pipefail
          [ -f "{{.ROOT}}/kubeconfig" ] || {
            echo "no ./kubeconfig — run: task cluster:kubeconfig stack=<name>" >&2
            exit 1
          }
          # The suite verifies the cluster this repository built, so it runs
          # against an existing one rather than spinning up a throwaway: none
          # of the Hetzner integration exists in a local cluster.
          go test -tags e2e -count=1 -v -timeout 30m ./test/e2e/... \
            --kubeconfig "{{.ROOT}}/kubeconfig"

  clean:
    desc: "Remove build output — bin/ and the layer binaries Pulumi compiles into .cache"
    cmds:
      # Both output directories, because there are two: `task build` writes
      # bin/ and Pulumi's language host writes .cache/pulumi-bin, one
      # buildTarget per project. Removing only the second left 988 MB of
      # binaries behind, which is how a full disk turned into
      # `link: mapping output file failed: no space left on device`.
      - rm -rf {{.ROOT}}/bin {{.ROOT}}/.cache/pulumi-bin
