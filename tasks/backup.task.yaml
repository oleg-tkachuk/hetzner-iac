# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

silent: true

vars:
  _BK_DIR: '{{.ROOT}}/infra/backup'
  _BK_CLUSTER_DIR: '{{.ROOT}}/infra/cluster'
  _BK_STACK: '{{.stack}}'

  _BK_PROTECTED: |
    {{._ERR}} backup · destroy · the Storage Box is protected, and nothing was deleted

        task {{.TASK}} stack={{.stack}} ignore_protect=yes

    takes the box, its subaccount and every etcd snapshot uploaded to it.

  _BK_USAGE: |
    {{._ERR}} backup · this needs a stack, and there is no default

        task {{.TASK}} stack=dev

    The stack names the Pulumi stack of the backup tier, and the cluster tier's
    stack it reads the Hetzner token from.

tasks:
  # A tier of its own rather than a platform layer, and the reasons are in
  # docs/design.md under "What decides a layer boundary". The short form: it
  # creates nothing in Kubernetes, it depends on nothing above the cluster
  # tier, and a backup destination should be creatable before the cluster and
  # survive it.
  #
  # Its own taskfile for the same reason the cluster tier has one: `platform:*`
  # walks a list of layers in dependency order, and this belongs to neither the
  # list nor the order.
  init:
    desc: "Create the backup tier's stack and point it at the cluster (override with ref=<org>/hetzner-cluster/<stack>)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._BK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail

          # Derived from the cluster tier rather than typed, the same as
          # platform:init: a hand-typed reference naming another environment is
          # accepted in silence by everything, and surfaces at apply time.
          ref="{{.ref}}"
          if [ -z "$ref" ]; then
            ref="$({{.KIT_STACK}} ref "{{._BK_CLUSTER_DIR}}" "{{._BK_STACK}}")"
          fi

          state="$({{.KIT_STACK}} ensure "{{._BK_DIR}}" "{{._BK_STACK}}")"

          pulumi --non-interactive --cwd "{{._BK_DIR}}" --stack "{{._BK_STACK}}" \
            config set backup:clusterStackRef "$ref"

          printf '%s\n' "{{._OK}} backup · init · stack {{._BK_STACK}} ${state} → cluster $ref"

  plan:
    desc: "Preview the backup tier; changes nothing"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._BK_USAGE}}"
      - sh: '[ -z "{{.target}}" ]'
        msg: "{{._NO_TARGET_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          printf '%s\n' "{{._RUN}} backup · preview"
          pulumi --non-interactive --cwd "{{._BK_DIR}}" --stack "{{._BK_STACK}}" preview --diff
          printf '%s\n' "{{._OK}} backup · previewed"

  apply:
    desc: "Create the Storage Box and its credentials (idempotent). Asks first"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._BK_USAGE}}"
      - sh: '[ -z "{{.target}}" ]'
        msg: "{{._NO_TARGET_USAGE}}"
    # The Storage Box is billable and its credentials are generated into state
    # on the first apply. A second apply does not rotate them — RandomPassword
    # keeps its value — so this is safe to repeat, which is what the prompt is
    # NOT about. It is about creating a paid resource.
    prompt: "Apply the backup tier on {{._BK_STACK}}? This creates a billable Storage Box."
    cmds:
      - cmd: |
          set -euo pipefail
          printf '%s\n' "{{._RUN}} backup · apply"
          pulumi --non-interactive --cwd "{{._BK_DIR}}" --stack "{{._BK_STACK}}" up --yes
          printf '%s\n' "{{._OK}} backup · applied"

  destroy:
    desc: "Destroy the backup tier — needs ignore_protect=yes, because this is where etcd snapshots live"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._BK_USAGE}}"
      - sh: '[ -z "{{.target}}" ]'
        msg: "{{._NO_TARGET_USAGE}}"
      # A precondition rather than a check inside the command, so the refusal
      # comes BEFORE the prompt. Asking "destroy the snapshots?" and then
      # refusing the answer teaches an operator that the question means
      # nothing.
      - sh: '[ "{{.ignore_protect}}" = "yes" ]'
        msg: "{{._BK_PROTECTED}}"
    # Two things have to be true before the snapshots go, and a prompt is only
    # one of them.
    #
    # The Storage Box is `pulumi.Protect(true)`, so a plain destroy fails in
    # PREVIEW and deletes nothing — not even the subaccount beside it. That is
    # the state Hetzner's own DeleteProtection cannot produce: the provider
    # clears that flag itself before deleting, measured as 17 seconds to remove
    # a box with an uploaded snapshot on it.
    #
    # So the protection is answered here rather than by hand.
    # `--ignore-protect` is scoped to this one operation, which
    # `cluster:secrets:destroy` chose for the same reason: `pulumi state
    # unprotect` edits the state and LEAVES it edited, so a teardown that
    # fails half way leaves the destination unprotected and nobody told.
    prompt: "Destroy the backup tier on {{._BK_STACK}}? The uploaded etcd snapshots are ON this Storage Box."
    cmds:
      - cmd: |
          set -euo pipefail
          printf '%s\n' "{{._WARN}} backup · destroy · ignore_protect=yes — taking the protected Storage Box"
          pulumi --non-interactive --cwd "{{._BK_DIR}}" --stack "{{._BK_STACK}}" destroy --yes --ignore-protect
          printf '%s\n' "{{._OK}} backup · destroyed"

  outputs:
    desc: "The backup tier's stack outputs — the sftp destination, without the secrets"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._BK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          # No --show-secrets. The passwords are read by cluster:etcd:upload,
          # which asks for them one at a time; printing them here would put
          # three credentials in a terminal for a command whose purpose is to
          # show a hostname.
          pulumi --non-interactive --cwd "{{._BK_DIR}}" --stack "{{._BK_STACK}}" stack output
