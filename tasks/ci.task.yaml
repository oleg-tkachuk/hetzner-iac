# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The checks, and nothing about a cluster.
#
# These mirror what CI runs, and two of them read a pin out of
# .github/workflows/ci.yaml so that a local run and the pipeline install the
# same tool. That coupling belongs here and only here: the root Taskfile
# manages the IaC — the cluster tier, the layers, the policy pack — and a
# repository that can be cloned and applied should not need a pipeline's
# configuration to do it.
#
# Named ci: rather than check: or dev: because what these are FOR is agreeing
# with the pipeline. `task ci:verify` is the aggregate to run before pushing;
# `task ci:scan` is the scanners.

silent: true

tasks:
  lint:
    desc: "golangci-lint at the version CI pins, not whatever PATH offers"
    cmds:
      - go run {{.ROOT}}/tools/golangci run {{.CLI_ARGS | default "./..."}}

  lint:install:
    desc: "Download the golangci-lint CI pins into bin/, for this platform"
    # The same shape as cluster:talosctl:install, and for the same reason:
    # Homebrew carries one golangci-lint and a Go install carries another, and
    # a linter whose version differs from CI's reports different findings —
    # measured, eight of them, on an untouched main.
    #
    # The version is read from the workflow rather than written here, so there
    # is one thing to bump and Renovate already bumps it.
    preconditions:
      - sh: command -v curl >/dev/null
        msg: "curl not installed — it ships with macOS, so this is unexpected"
      - sh: command -v tar >/dev/null
        msg: "tar not installed"
    cmds:
      - cmd: |
          set -euo pipefail

          version="$(awk -F\" '/GOLANGCI_VERSION:/ {print $2}' "{{.ROOT}}/.github/workflows/ci.yaml")"
          if [ -z "${version}" ]; then
            printf '%s\n' "{{._ERR}} hetzner-iac · lint · no GOLANGCI_VERSION in .github/workflows/ci.yaml" >&2
            exit 1
          fi

          # The release assets carry the version without its v, and the tag
          # carries it with one.
          bare="${version#v}"

          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) printf '%s\n' "{{._ERR}} hetzner-iac · lint · unknown architecture $(uname -m)" >&2; exit 1 ;;
          esac

          name="golangci-lint-${bare}-${os}-${arch}"
          url="https://github.com/golangci/golangci-lint/releases/download/${version}/${name}.tar.gz"

          printf '%s\n' "{{._RUN}} hetzner-iac · lint · ${version} for ${os}/${arch}"

          mkdir -p "{{.ROOT}}/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          curl -sSfL "$url" | tar -xz -C "${tmp}" "${name}/golangci-lint"
          install -m 0755 "${tmp}/${name}/golangci-lint" "{{.ROOT}}/bin/golangci-lint"

          # Proves the download is what it claims before anything depends on
          # it: a 404 saved to disk is executable-shaped and fails later with
          # something unrelated.
          got="$("{{.ROOT}}/bin/golangci-lint" --version | awk '/has version/ {print $4}')"
          if [ "${got}" != "${bare}" ]; then
            printf '%s\n' "{{._ERR}} hetzner-iac · lint · downloaded ${got}, wanted ${bare}" >&2
            exit 1
          fi

          printf '%s\n' "{{._OK}} hetzner-iac · lint · bin/golangci-lint is ${got}, which is what CI runs"

  verify:
    desc: "Everything checkable without a cluster — needs helm, kubeconform, talosctl and lychee"
    cmds:
      # A leading colon is an absolute task name. Without it Task looks inside
      # this include's own namespace and reports `ci:go:test does not exist`,
      # which reads like a missing task rather than a missing prefix.
      - task: fmt-check
      - task: :go:test
      # Not go:lint: that runs whatever golangci-lint is on PATH, and this one
      # runs the version CI pins.
      - task: lint
      - task: :go:vuln
      - task: :charts:validate
      - task: :charts:render-check
      - task: docs:links
      # The checks that ask the real tool rather than trusting our own tests.
      # Each states what to install if it is missing: a gate that skips itself
      # when a tool is absent is a gate that quietly stops running.
      - task: :cluster:machine-config:check

  scan:
    desc: "Every scanner CI runs — needs gitleaks, gosec, trivy and checkov installed"
    cmds:
      # Named one by one, and NOT the module's composite, for two reasons that
      # both came out of the v7.0.0 bump.
      #
      # It was broken. The include excludes `dockerfile` — deliberately, see
      # the comment there — and a task removed by `excludes` is not skipped
      # inside a composite, it is missing. So the aggregate died with
      # `Task "security:dockerfile" does not exist`, on v6.0.0 too, and
      # nothing noticed because CI calls the scans as separate jobs and never
      # this task.
      #
      # And it was inaccurate. The composite also runs `lint`, which CI does
      # not: golangci-lint runs there through its own action in the Go lint
      # job. The list below is what the workflows actually call — which is the
      # only thing that makes the claim above true.
      - task: :security:secrets
      - task: :security:vuln
      - task: :security:trivy
      - task: :security:gosec
      - task: checkov

  checkov:
    desc: "checkov — hardening rules over the manifests and workflows this repository ships"
    preconditions:
      - sh: command -v checkov >/dev/null || command -v pipx >/dev/null
        msg: "checkov is not installed — pipx install checkov, or brew install checkov"
    cmds:
      # Flags live in .checkov.yaml, not here, so a local run and the CI job
      # assert the same thing. pipx as the fallback because checkov is a
      # Python tool and CI installs it that way.
      #
      # The version is READ from the workflow, not written here. It was written
      # here — `${CHECKOV_VERSION:-3.3.17}` — and that default is only ever
      # used locally, because CI sets the variable. So the moment the pin moved
      # to 3.3.18 a local run installed 3.3.17 and asserted against different
      # rules, silently. One copy, in the file Renovate already bumps.
      - cmd: |
          set -euo pipefail
          if command -v checkov >/dev/null; then
            checkov --config-file "{{.ROOT}}/.checkov.yaml"
          else
            version="${CHECKOV_VERSION:-$(awk -F'"' '/CHECKOV_VERSION:/ {print $2}' "{{.ROOT}}/.github/workflows/ci.yaml")}"
            if [ -z "$version" ]; then
              printf '%s\n' "{{._ERR}} hetzner-iac · checkov · no CHECKOV_VERSION in .github/workflows/ci.yaml" >&2
              exit 1
            fi
            pipx run "checkov==${version}" --config-file "{{.ROOT}}/.checkov.yaml"
          fi

  docs:links:
    desc: "Do the documentation's own links point at files and headings that exist? — needs lychee"
    preconditions:
      - sh: command -v lychee >/dev/null
        msg: "lychee is not installed — brew install lychee, or take the pinned version from .github/workflows/ci.yaml"
    cmds:
      # Offline on purpose, and that is the whole design. This answers "does
      # what the documentation points at exist", which is a property of this
      # tree; whether some vendor's marketing page is up today is not, and a
      # gate that fails on somebody else's outage is a gate people learn to
      # re-run rather than read. GitHub's own release downloads returned 504
      # for twenty minutes while this was being written.
      #
      # --include-fragments=full is the half a path check misses: a heading
      # renamed in docs/operations.md leaves every `#anchor` pointing at it
      # silently wrong, and GitHub renders that as the top of the page rather
      # than as an error.
      #
      # Two globs because lychee expands them itself and `**` does not descend
      # into a dot directory, so .github/SECURITY.md needs naming.
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}"
          lychee --offline --include-fragments=full --include-mail=false --no-progress \
            '**/*.md' '.github/**/*.md'

  fmt-check:
    desc: "Fail if any Go file is not gofmt-clean"
    # The library's gate rather than eight lines of `gofmt -l` here. It
    # checks `gofmt -s`, which is strictly more than this task did: the
    # simplifications gofmt -s makes were never asserted, so a file could be
    # gofmt-clean here and rewritten by `task fmt` on the next run.
    cmds:
      - task: :go:fmt:check
