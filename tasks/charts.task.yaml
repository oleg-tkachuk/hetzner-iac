# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

silent: true

tasks:
  validate:
    desc: "Check every chart pin is an exact version and resolves upstream"
    cmds:
      - go test ./pkg/charts/ -count=1

  list:
    desc: "Show every pinned chart"
    cmds:
      - go run ./tools/charts list

  outdated:
    desc: "Compare every pin against the latest chart upstream"
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm not installed — brew install helm"
    cmds:
      - go run ./tools/charts outdated

  appversions:
    desc: "Check every AppVersion is what the pinned chart actually ships"
    cmds:
      # Renovate bumps Version and cannot touch AppVersion — the helm
      # datasource knows chart versions and nothing else. This is the gate
      # that stops a bot's pull request from landing a lie beside the pin.
      - go run ./tools/charts appversions

  render-check:
    desc: "Render every pinned chart and prove it still produces the expected workloads"
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm not installed — brew install helm"
    cmds:
      # Offline: no cluster, no credentials. Catches the failure that `pulumi
      # up` cannot — a chart upgrade that renames a Deployment installs
      # cleanly and only fails hours later, in e2e, against a real cluster.
      - go run ./tools/charts render
