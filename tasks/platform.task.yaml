# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The layers as a YAML list, for the enum below.
#
# A second form of the list in Taskfile.yaml's LAYERS, and unavoidable:
# requires.enum is static schema, so a template in it is read as a map and the
# file stops parsing — measured. One copy here, aliased rather than repeated
# per task, held equal to LAYERS by TestLayerEnum_MatchesTheLayerList.
x-layers: &layers [10-node-platform, 20-network-policy, 30-cluster-services, 40-ingress, 50-gitops]

silent: true

vars:
  _PL_STACK: '{{.stack}}'
  _PL_LAYERS: '{{.LAYERS}}'
  # The cluster tier — the stack every layer references.
  _PL_CLUSTER_DIR: '{{.ROOT}}/infra/cluster'
  # init's row format, at the same layer-name width status prints, so the two
  # tables line up. A name past the width pushes its own row and no other.
  _PL_ROW: '%-24s %-9s %s'

tasks:
  layers:
    desc: "Print the layers in dependency order (CI derives its matrix from this)"
    cmds:
      - cmd: |
          for layer in {{._PL_LAYERS}}; do printf '%s\n' "$layer"; done

  # ---------------------------------------------------------------------------
  # Whole platform
  # ---------------------------------------------------------------------------

  plan-all:
    desc: "Preview every layer in order; change nothing"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          for layer in {{._PL_LAYERS}}; do
            printf '%s\n' "{{._RUN}} platform · ${layer} · preview"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" preview --diff )
          done

  apply-all:
    desc: "Apply every layer in dependency order (idempotent)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Apply every platform layer on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          # Sequential and ordered. The layers are independent in the sense
          # that each can be applied alone against an existing cluster — not in
          # the sense that they can be applied in any order on an empty one:
          # nothing schedules before the CCM clears the uninitialized taint,
          # and nothing networks before the CNI.
          for layer in {{._PL_LAYERS}}; do
            printf '%s\n' "{{._RUN}} platform · ${layer} · apply"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" up --yes )
          done

  refresh-all:
    desc: "Reconcile every layer's state with the cloud, in order. Asks first — this WRITES state"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    # It asks, and the reason is not caution for its own sake. `pulumi
    # refresh` is the one read-shaped command that writes: where a resource is
    # gone from the cloud, it is REMOVED FROM STATE, and the next apply then
    # recreates it. That is usually what an operator wants after something was
    # changed or deleted by hand — and it is never what they want by accident,
    # because a refresh run against the wrong stack turns "somebody deleted a
    # thing" into "Pulumi will now rebuild half a cluster".
    prompt: "Refresh every platform layer's state on {{._PL_STACK}}? This writes state"
    cmds:
      - cmd: |
          set -euo pipefail
          # Forward order, matching apply rather than destroy. A refresh
          # changes no infrastructure, so there is no dependency to respect —
          # the order is kept the same as apply-all's only so the output of
          # the two reads the same way.
          for layer in {{._PL_LAYERS}}; do
            printf '%s\n' "{{._RUN}} platform · ${layer} · refresh"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" refresh --yes --diff )
          done

  destroy-all:
    desc: "Destroy every layer, in reverse order"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Destroy every platform layer on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          # Reverse: a layer's dependants must go first, or the CNI is removed
          # while workloads still need to talk.
          #
          # One awk op rather than the twelve lines that probed for `tac` and
          # fell back to `tail -r` — GNU has one, BSD the other, and the probe
          # existed only because neither is portable. awk is.
          for layer in $(awk -f "{{.ROOT}}/tools/lines/main.awk" -v op=reverse-words \
                         <<<"{{._PL_LAYERS}}"); do
            printf '%s\n' "{{._RUN}} platform · ${layer} · destroy"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" destroy --yes )
          done

  # ---------------------------------------------------------------------------
  # One layer
  # ---------------------------------------------------------------------------

  init:
    desc: "Create the stack for every layer and point it at the cluster (override with ref=<org>/hetzner-cluster/<stack>)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      # One row per layer, in the same shape platform:status prints. It used to
      # be two sentences per layer — an absolute path, and the cluster
      # reference repeated six times — which is twelve lines saying two
      # things: which stacks are new, and that they all point at the same
      # cluster. Both are said once here.
      - cmd: |
          set -euo pipefail

          # The reference is the cluster tier's own stack name, so it is read
          # from the cluster tier rather than typed. Hand-typed, `stack=dev
          # ref=.../prod` is accepted in silence — nothing compares the two —
          # and five dev layers install into the production cluster, which
          # shows up at apply time and not here.
          #
          # ref= still overrides, for the cases the derived answer gets wrong:
          # a cluster in another organization, or one cluster shared by
          # several layer stacks.
          ref="{{.ref}}"
          if [ -z "$ref" ]; then
            ref="$(go run "{{.ROOT}}/tools/stack" ref "{{._PL_CLUSTER_DIR}}" "{{._PL_STACK}}")"
          fi

          printf '%s\n' "{{._RUN}} platform · init · stack {{._PL_STACK}} → cluster $ref"
          printf '\n'
          printf '{{._PL_ROW}}\n' LAYER STACK "CLUSTER REF"

          for layer in {{._PL_LAYERS}}; do
            ( cd "{{.ROOT}}/layers/${layer}"
              project="$(grep -m1 '^name:' Pulumi.yaml | awk '{print $2}')"

              # tools/stack makes the whole decision, and prints one word for
              # what it did. `init || select` hides why init failed and blames
              # the wrong command for it, and the jq pipeline that replaced it
              # was the third copy of itself.
              state="$(go run "{{.ROOT}}/tools/stack" ensure "{{.ROOT}}/layers/${layer}" "{{._PL_STACK}}")"

              # Only layers that declare the key get it. Every layer does
              # today; the guard stays because a layer with no cluster in it is
              # a shape this repository has had before, and setting a cluster
              # reference there leaves a key nothing reads — misleading in
              # `pulumi config`, and a lie about what the layer depends on.
              #
              # A presence test on a unique token, not positional parsing of
              # YAML: robust to comments and indentation, unlike the grep this
              # repository already got wrong once in cluster:image-bake.
              if grep -q 'clusterStackRef' Pulumi.yaml; then
                pulumi --non-interactive --stack "{{._PL_STACK}}" config set "${project}:clusterStackRef" "$ref"
                reference=set
              else
                reference="not declared"
              fi

              printf '{{._PL_ROW}}\n' "$layer" "$state" "$reference" )
          done

          printf '\n'
          printf '%s\n' "{{._OK}} platform · init · next: task platform:plan-all stack={{._PL_STACK}}"

  plan:
    desc: "Preview one layer — task platform:plan stack=dev layer=10-node-platform"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" preview --diff

  refresh:
    desc: "Reconcile one layer's state with the cloud — task platform:refresh stack=dev layer=40-ingress"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Refresh {{.layer}}'s state on {{._PL_STACK}}? This writes state"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" refresh --yes --diff

  apply:
    desc: "Apply one layer — task platform:apply stack=dev layer=10-node-platform"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Apply layer {{.layer}} on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" up --yes

  destroy:
    desc: "Destroy one layer — task platform:destroy stack=dev layer=50-gitops"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Destroy layer {{.layer}} on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" destroy --yes

  outputs:
    desc: "Show one layer's stack outputs — task platform:outputs stack=dev layer=50-gitops"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" stack output

  status:
    desc: "Which layers are deployed, and how many resources each holds"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          printf '%-24s %s\n' LAYER RESOURCES
          for layer in {{._PL_LAYERS}}; do
            count="$( cd "{{.ROOT}}/layers/${layer}" && \
              # stderr is kept and shown. A stack that was never created
              # legitimately has no count, but so does an expired token — and
              # reporting both as "-" turns a broken login into a tidy table
              # saying nothing is deployed.
              # `--output json`, not `--json`: the CLI has no such flag on this
              # command and rejected it, so every row read "?" with an error
              # above it. The table was honest about not knowing; the flag was
              # simply wrong.
              if out="$(pulumi --non-interactive --stack "{{._PL_STACK}}" stack --output json 2>&1)"; then
                printf '%s' "$out" | jq -r '.resources | length'
              else
                case "$out" in
                  *"no stack named"*|*"not found"*) printf '%s\n' "-" ;;
                  *) printf '%s\n' "?"; printf '%s\n' "$out" >&2 ;;
                esac
              fi )"
            printf '%-24s %s\n' "$layer" "$count"
          done
