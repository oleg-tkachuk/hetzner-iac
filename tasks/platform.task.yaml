# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The layer selector's accepted values: every layer, plus `all`.
#
# `all` is in the ENUM rather than handled by making the variable optional,
# and that is the design. requires.vars validates what is given, so an
# optional variable would mean dropping the validation — and a missing
# `layer=` would then select every layer, which makes the shortest command the
# widest action. `task platform:destroy` with a forgotten argument must not
# destroy a platform.
#
# A second form of the list in Taskfile.yaml's LAYERS, and unavoidable:
# requires.enum is static schema, so a template in it is read as a map and the
# file stops parsing — measured. One copy here, aliased rather than repeated
# per task, held equal to LAYERS by TestLayerEnum_MatchesTheLayerList, which
# knows `all` is the selector and not a layer.
x-layers: &layers [all, 10-node-platform, 20-network-policy, 30-cluster-services, 40-ingress, 50-gitops]

silent: true

vars:
  _PL_STACK: '{{.stack}}'
  _PL_LAYERS: '{{.LAYERS}}'
  # The cluster tier — the stack every layer references.
  _PL_CLUSTER_DIR: '{{.ROOT}}/infra/cluster'
  # init's row format, at the same layer-name width status prints, so the two
  # tables line up. A name past the width pushes its own row and no other.
  _PL_ROW: '%-24s %-9s %s'

tasks:
  layers:
    desc: "Print the layers in dependency order (CI derives its matrix from this)"
    cmds:
      - cmd: |
          for layer in {{._PL_LAYERS}}; do printf '%s\n' "$layer"; done

  # ---------------------------------------------------------------------------
  # One layer, or every layer with layer=all
  # ---------------------------------------------------------------------------

  init:
    desc: "Create the stack for every layer and point it at the cluster (override with ref=<org>/hetzner-cluster/<stack>)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      # One row per layer, in the same shape platform:status prints. It used to
      # be two sentences per layer — an absolute path, and the cluster
      # reference repeated six times — which is twelve lines saying two
      # things: which stacks are new, and that they all point at the same
      # cluster. Both are said once here.
      - cmd: |
          set -euo pipefail

          # The reference is the cluster tier's own stack name, so it is read
          # from the cluster tier rather than typed. Hand-typed, `stack=dev
          # ref=.../prod` is accepted in silence — nothing compares the two —
          # and five dev layers install into the production cluster, which
          # shows up at apply time and not here.
          #
          # ref= still overrides, for the cases the derived answer gets wrong:
          # a cluster in another organization, or one cluster shared by
          # several layer stacks.
          ref="{{.ref}}"
          if [ -z "$ref" ]; then
            ref="$({{.KIT_STACK}} ref "{{._PL_CLUSTER_DIR}}" "{{._PL_STACK}}")"
          fi

          printf '%s\n' "{{._RUN}} platform · init · stack {{._PL_STACK}} → cluster $ref"
          printf '\n'
          printf '{{._PL_ROW}}\n' LAYER STACK "CLUSTER REF"

          for layer in {{._PL_LAYERS}}; do
            ( cd "{{.ROOT}}/layers/${layer}"
              project="$(grep -m1 '^name:' Pulumi.yaml | awk '{print $2}')"

              # cmd/stack makes the whole decision, and prints one word for
              # what it did. `init || select` hides why init failed and blames
              # the wrong command for it, and the jq pipeline that replaced it
              # was the third copy of itself.
              state="$({{.KIT_STACK}} ensure "{{.ROOT}}/layers/${layer}" "{{._PL_STACK}}")"

              # Only layers that declare the key get it. Every layer does
              # today; the guard stays because a layer with no cluster in it is
              # a shape this repository has had before, and setting a cluster
              # reference there leaves a key nothing reads — misleading in
              # `pulumi config`, and a lie about what the layer depends on.
              #
              # A presence test on a unique token, not positional parsing of
              # YAML: robust to comments and indentation, unlike the grep this
              # repository already got wrong once in cluster:image:bake.
              if grep -q 'clusterStackRef' Pulumi.yaml; then
                pulumi --non-interactive --stack "{{._PL_STACK}}" config set "${project}:clusterStackRef" "$ref"
                reference="set"
              else
                reference="not declared"
              fi

              printf '{{._PL_ROW}}\n' "$layer" "$state" "$reference" )
          done

          printf '\n'
          printf '%s\n' "{{._OK}} platform · init · next: task platform:plan layer=all stack={{._PL_STACK}}"

  plan:
    desc: "Preview a layer, or layer=all for every one in order; changes nothing"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_LAYER_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          # Expand the selector HERE rather than in a file-level var.
          # Measured: a var at this file's top level is evaluated without the
          # task's own `layer`, so a call like `- task: platform:apply` with
          # `vars: {layer: all}` resolved it to the empty string — and a `for`
          # over nothing exits 0 having done nothing. `task up` would have
          # reported success and applied no layer at all.
          selected="{{.layer}}"
          if [ "$selected" = all ]; then selected="{{._PL_LAYERS}}"; fi

          # Targeted, when asked. cmd/target refuses a selector this stack
          # does not hold, and that refusal is the point: Pulumi does not.
          # Measured on dev — `preview --target '**::Release::does-not-exist'`
          # reported "24 unchanged" and exited ZERO. A mistyped component would
          # otherwise be an operation that claims to have worked.
          targets=""
          if [ -n "{{.target}}" ]; then
            if [ "{{.layer}}" = all ]; then
              printf '%s\n' "{{._ERR}} platform · target · one layer at a time: a URN names one stack" >&2
              exit 1
            fi

            targets="$({{.KIT_TARGET}} \
              -dir "{{.ROOT}}/layers/${selected}" \
              -stack "{{._PL_STACK}}" \
              -group-package "{{.COMPONENT_PACKAGE}}" \
              "{{.target}}" \
              | awk '{printf " --target %s", $0}')"
          fi

          for layer in $selected; do
            printf '%s\n' "{{._RUN}} platform · ${layer} · preview{{if .target}} · target {{.target}}{{end}}"
            # shellcheck disable=SC2086 # targets is a list of --target flags; a URN carries no spaces
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" preview --diff ${targets} )
            printf '%s\n' "{{._OK}} platform · ${layer} · previewed"
          done

  refresh:
    desc: "Reconcile a layer's state with the cloud, or layer=all. Asks first — this WRITES state"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_LAYER_USAGE}}"
    prompt: "Refresh {{.layer}} state on {{._PL_STACK}}? This writes state"
    cmds:
      - cmd: |
          set -euo pipefail
          # Expand the selector HERE rather than in a file-level var.
          # Measured: a var at this file's top level is evaluated without the
          # task's own `layer`, so a call like `- task: platform:apply` with
          # `vars: {layer: all}` resolved it to the empty string — and a `for`
          # over nothing exits 0 having done nothing. `task up` would have
          # reported success and applied no layer at all.
          selected="{{.layer}}"
          if [ "$selected" = all ]; then selected="{{._PL_LAYERS}}"; fi

          for layer in $selected; do
            printf '%s\n' "{{._RUN}} platform · ${layer} · refresh"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" refresh --yes --diff )
            printf '%s\n' "{{._OK}} platform · ${layer} · refreshed"
          done

  apply:
    desc: "Apply a layer, or layer=all for every one in dependency order; idempotent. Asks first"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_LAYER_USAGE}}"
    prompt: "Apply layer {{.layer}} on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          # Expand the selector HERE rather than in a file-level var.
          # Measured: a var at this file's top level is evaluated without the
          # task's own `layer`, so a call like `- task: platform:apply` with
          # `vars: {layer: all}` resolved it to the empty string — and a `for`
          # over nothing exits 0 having done nothing. `task up` would have
          # reported success and applied no layer at all.
          selected="{{.layer}}"
          if [ "$selected" = all ]; then selected="{{._PL_LAYERS}}"; fi

          # Sequential and ordered. The layers are independent in the sense
          # that each can be applied alone against an existing cluster — not
          # in the sense that they can be applied in any order on an empty
          # one: nothing schedules before the CCM clears the uninitialized
          # taint, and nothing networks before the CNI.
          # Targeted, when asked. See platform:plan for why this is resolved
          # rather than passed through: a --target that matches nothing is an
          # apply that reports success and changes nothing.
          targets=""
          if [ -n "{{.target}}" ]; then
            if [ "{{.layer}}" = all ]; then
              printf '%s\n' "{{._ERR}} platform · target · one layer at a time: a URN names one stack" >&2
              exit 1
            fi

            targets="$({{.KIT_TARGET}} \
              -dir "{{.ROOT}}/layers/${selected}" \
              -stack "{{._PL_STACK}}" \
              -group-package "{{.COMPONENT_PACKAGE}}" \
              "{{.target}}" \
              | awk '{printf " --target %s", $0}')"
          fi

          for layer in $selected; do
            printf '%s\n' "{{._RUN}} platform · ${layer} · apply{{if .target}} · target {{.target}}{{end}}"
            # shellcheck disable=SC2086 # targets is a list of --target flags; a URN carries no spaces
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" up --yes ${targets} )
            printf '%s\n' "{{._OK}} platform · ${layer} · applied"

            # Said out loud, because Pulumi does not say it and the state does
            # not look different. A targeted update leaves every other resource
            # on the inputs of the last FULL apply, so the next one can show a
            # diff nobody wrote. ▲ survives the run; ◉ and ✔ do not.
            if [ -n "{{.target}}" ]; then
              printf '%s\n' "{{._WARN}} platform · ${layer} · targeted: everything else kept its last-applied inputs"
            fi
          done

  destroy:
    desc: "Destroy a layer, or layer=all for every one in reverse order. Asks first"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_LAYER_USAGE}}"
    prompt: "Destroy {{if .target}}{{.target}} in {{end}}layer {{.layer}} on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          # Expand the selector HERE rather than in a file-level var.
          # Measured: a var at this file's top level is evaluated without the
          # task's own `layer`, so a call like `- task: platform:apply` with
          # `vars: {layer: all}` resolved it to the empty string — and a `for`
          # over nothing exits 0 having done nothing. `task up` would have
          # reported success and applied no layer at all.
          selected="{{.layer}}"
          if [ "$selected" = all ]; then selected="{{._PL_LAYERS}}"; fi

          # Reverse for layer=all: a layer's dependants must go first, or the
          # CNI is removed while workloads still need to talk. One awk op
          # rather than the twelve lines that probed for `tac` and fell back
          # to `tail -r` — GNU has one, BSD the other, and awk has both.
          # Targeting a destroy is the one that needs more than a resolved URN.
          #
          # `destroy --target` FAILS when the target has dependents and
          # --target-dependents is not given, and takes them when it is. So the
          # flag is a separate variable rather than implied: removing more than
          # was asked for has to be something an operator typed.
          #
          # And the plan is shown first, with --preview-only, because the list
          # of what goes is the only thing that makes the prompt below a
          # decision rather than a formality.
          targets=""
          dependents=""
          if [ -n "{{.target}}" ]; then
            if [ "{{.layer}}" = all ]; then
              printf '%s\n' "{{._ERR}} platform · target · one layer at a time: a URN names one stack" >&2
              exit 1
            fi

            targets="$({{.KIT_TARGET}} \
              -dir "{{.ROOT}}/layers/${selected}" \
              -stack "{{._PL_STACK}}" \
              -group-package "{{.COMPONENT_PACKAGE}}" \
              "{{.target}}" \
              | awk '{printf " --target %s", $0}')"

            if [ "{{.dependents}}" = yes ]; then
              dependents="--target-dependents"
            fi

            printf '%s\n' "{{._RUN}} platform · ${selected} · destroy · what {{.target}} would take"
            # shellcheck disable=SC2086 # targets is a list of --target flags; a URN carries no spaces
            ( cd "{{.ROOT}}/layers/${selected}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" destroy \
                --preview-only ${targets} ${dependents} )
          fi

          # shellcheck disable=SC2013 # a word list is what tools/lines reverses, not lines
          for layer in $(awk -f "{{.ROOT}}/tools/lines/main.awk" -v op=reverse-words \
                         <<<"$selected"); do
            printf '%s\n' "{{._RUN}} platform · ${layer} · destroy{{if .target}} · target {{.target}}{{end}}"
            # shellcheck disable=SC2086 # targets and dependents are flags; a URN carries no spaces
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" destroy --yes ${targets} ${dependents} )
            printf '%s\n' "{{._OK}} platform · ${layer} · destroyed"
          done

  outputs:
    desc: "Show a layer's stack outputs, or layer=all for every one"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_LAYER_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          # Expand the selector HERE rather than in a file-level var.
          # Measured: a var at this file's top level is evaluated without the
          # task's own `layer`, so a call like `- task: platform:apply` with
          # `vars: {layer: all}` resolved it to the empty string — and a `for`
          # over nothing exits 0 having done nothing. `task up` would have
          # reported success and applied no layer at all.
          selected="{{.layer}}"
          if [ "$selected" = all ]; then selected="{{._PL_LAYERS}}"; fi

          for layer in $selected; do
            printf '%s\n' "{{._RUN}} platform · ${layer} · outputs"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" stack output )
          done

  status:
    desc: "Which layers are deployed, and how many resources each holds"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          printf '%-24s %s\n' LAYER RESOURCES
          for layer in {{._PL_LAYERS}}; do
            count="$( cd "{{.ROOT}}/layers/${layer}" && \
              # stderr is kept and shown. A stack that was never created
              # legitimately has no count, but so does an expired token — and
              # reporting both as "-" turns a broken login into a tidy table
              # saying nothing is deployed.
              # `--output json`, not `--json`: the CLI has no such flag on this
              # command and rejected it, so every row read "?" with an error
              # above it. The table was honest about not knowing; the flag was
              # simply wrong.
              if out="$(pulumi --non-interactive --stack "{{._PL_STACK}}" stack --output json 2>&1)"; then
                printf '%s' "$out" | jq -r '.resources | length'
              else
                case "$out" in
                  *"no stack named"*|*"not found"*) printf '%s\n' "-" ;;
                  *) printf '%s\n' "?"; printf '%s\n' "$out" >&2 ;;
                esac
              fi )"
            printf '%-24s %s\n' "$layer" "$count"
          done
