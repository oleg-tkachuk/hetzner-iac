version: "3"

silent: true

vars:
  _PL_STACK: '{{.stack | default "prod"}}'
  _PL_LAYERS: '{{.LAYERS}}'

tasks:
  layers:
    desc: "Print the layers in dependency order (CI derives its matrix from this)"
    cmds:
      - cmd: |
          for layer in {{._PL_LAYERS}}; do echo "$layer"; done

  # ---------------------------------------------------------------------------
  # Whole platform
  # ---------------------------------------------------------------------------

  plan-all:
    desc: "Preview every layer in order; change nothing"
    cmds:
      - cmd: |
          set -euo pipefail
          for layer in {{._PL_LAYERS}}; do
            echo "══ preview ${layer}"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" preview --diff )
          done

  apply-all:
    desc: "Apply every layer in dependency order (idempotent)"
    cmds:
      - cmd: |
          set -euo pipefail
          # Sequential and ordered. The layers are independent in the sense
          # that each can be applied alone against an existing cluster — not in
          # the sense that they can be applied in any order on an empty one:
          # nothing schedules before the CCM clears the uninitialized taint,
          # and nothing networks before the CNI.
          for layer in {{._PL_LAYERS}}; do
            echo "══ apply ${layer}"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" up --yes )
          done

  destroy-all:
    desc: "Destroy every layer, in reverse order"
    prompt: "Destroy every platform layer on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          # Reverse: a layer's dependants must go first, or the CNI is removed
          # while workloads still need to talk.
          # Probe for the reverser rather than running one and swallowing its
          # error: `tail -r` is BSD, `tac` is GNU, and a machine has one or the
          # other. Asked this way, a machine with neither fails saying so
          # instead of silently destroying in forward order.
          if command -v tac >/dev/null; then
            reverse=tac
          elif tail -r </dev/null >/dev/null 2>&1; then
            reverse="tail -r"
          else
            echo "neither tac nor tail -r is available; cannot reverse the layer order" >&2
            exit 1
          fi
          reversed="$(for layer in {{._PL_LAYERS}}; do echo "$layer"; done | $reverse)"
          for layer in $reversed; do
            echo "══ destroy ${layer}"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PL_STACK}}" destroy --yes )
          done

  # ---------------------------------------------------------------------------
  # One layer
  # ---------------------------------------------------------------------------

  init:
    desc: "Create the stack for every layer and point it at the cluster (ref=<org>/hetzner-cluster/<stack>)"
    requires:
      vars: [ref]
    cmds:
      - cmd: |
          set -euo pipefail
          for layer in {{._PL_LAYERS}}; do
            ( cd "{{.ROOT}}/layers/${layer}"
              project="$(grep -m1 '^name:' Pulumi.yaml | awk '{print $2}')"
              # See the comment in cluster:init: `init || select` hides why
              # init failed and blames the wrong command for it.
              if pulumi --non-interactive stack ls --json \
                 | jq -e --arg s "{{._PL_STACK}}" 'any(.[]; .name == $s)' >/dev/null; then
                pulumi --non-interactive stack select "{{._PL_STACK}}"
              else
                pulumi --non-interactive stack init "{{._PL_STACK}}"
              fi

              # Only layers that declare the key get it. 05-object-storage is
              # the one layer with no cluster in it, so setting a cluster
              # reference there left a key nothing reads — misleading in
              # `pulumi config`, and a lie about what the layer depends on.
              #
              # A presence test on a unique token, not positional parsing of
              # YAML: robust to comments and indentation, unlike the grep this
              # repository already got wrong once in cluster:image-bake.
              if grep -q 'clusterStackRef' Pulumi.yaml; then
                pulumi --non-interactive --stack "{{._PL_STACK}}" config set "${project}:clusterStackRef" "{{.ref}}"
                echo "${layer}: pointed at {{.ref}}"
              else
                echo "${layer}: no cluster reference to set"
              fi )
          done

  plan:
    desc: "Preview one layer — task platform:plan layer=20-cni"
    requires:
      vars: [layer]
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" preview --diff

  apply:
    desc: "Apply one layer — task platform:apply layer=20-cni"
    requires:
      vars: [layer]
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" up --yes

  destroy:
    desc: "Destroy one layer — task platform:destroy layer=60-observability"
    requires:
      vars: [layer]
    prompt: "Destroy layer {{.layer}} on {{._PL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" destroy --yes

  outputs:
    desc: "Show one layer's stack outputs — task platform:outputs layer=50-gitops"
    requires:
      vars: [layer]
    cmds:
      - cmd: |
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PL_STACK}}" stack output

  status:
    desc: "Which layers are deployed, and how many resources each holds"
    cmds:
      - cmd: |
          set -euo pipefail
          printf '%-24s %s\n' LAYER RESOURCES
          for layer in {{._PL_LAYERS}}; do
            count="$( cd "{{.ROOT}}/layers/${layer}" && \
              # stderr is kept and shown. A stack that was never created
              # legitimately has no count, but so does an expired token — and
              # reporting both as "-" turns a broken login into a tidy table
              # saying nothing is deployed.
              if out="$(pulumi --non-interactive --stack "{{._PL_STACK}}" stack --json 2>&1)"; then
                printf '%s' "$out" | jq -r '.resources | length'
              else
                case "$out" in
                  *"no stack named"*|*"not found"*) echo "-" ;;
                  *) echo "?"; printf '%s\n' "$out" >&2 ;;
                esac
              fi )"
            printf '%-24s %s\n' "$layer" "$count"
          done
