# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

silent: true

vars:
  _CL_DIR: '{{.ROOT}}/infra/cluster'
  _CL_STACK: '{{.stack}}'
  _CL_TOPOLOGY: '{{.ROOT}}/infra/cluster/cluster.{{.stack}}.yaml'

  # Where the Cilium chart puts the Hubble relay, and what it listens on.
  # Named because `hubble` is given the local end and kubectl the remote one,
  # and a mismatch between the two produces a connection refused with nothing
  # saying which half is wrong.
  _CL_HUBBLE_NS: kube-system
  _CL_HUBBLE_SVC: hubble-relay
  _CL_HUBBLE_SVC_PORT: "80"
  _CL_HUBBLE_LOCAL_PORT: "4245"
  # Seconds to wait for the forward. The relay answers in about one.
  _CL_HUBBLE_WAIT: "15"

# The tasks below with a `deps:` carry no stack guard of their own: Task runs
# dependencies before a task's own preconditions, so the dependency's guard
# fires first and names itself. A second guard there would be unreachable.

tasks:
  # ---------------------------------------------------------------------------
  # Prerequisite
  # ---------------------------------------------------------------------------

  image-bake:
    desc: "Bake the Talos snapshot named by the topology into the hcloud project (idempotent)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — brew bundle, or brew install hcloud"
      - sh: command -v hcloud-upload-image >/dev/null
        msg: "hcloud-upload-image not installed — go install github.com/apricote/hcloud-upload-image@latest"
      - sh: test -f "{{._CL_TOPOLOGY}}"
        msg: "no topology at {{._CL_TOPOLOGY}} — cp infra/cluster/cluster.example.yaml {{._CL_TOPOLOGY}} and edit adminCIDRs"
    cmds:
      # Forty-eight lines of shell used to live here: `curl | jq` for the
      # Image Factory, `hcloud image list | awk` for idempotence, a `case` for
      # the architecture, and an `env:` stanza resolving the token — which Task
      # evaluates BEFORE preconditions, so the precondition holding the remedy
      # could never print. All of it is tools/image now, where it is
      # testable and where `jq` and `curl` are not needed at all.
      - go run {{.ROOT}}/tools/image "{{._CL_TOPOLOGY}}" "{{._CL_STACK}}"

  config-check:
    desc: "Validate the machine-config patches against Talos itself — no cluster needed"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: command -v talosctl >/dev/null
        msg: "talosctl not installed — https://www.talos.dev/"
    cmds:
      # The unit tests prove the patches contain what was intended; only Talos
      # can say whether it accepts them. Catches at plan time what would
      # otherwise fail after the servers exist.
      #
      # talosctl must match the pinned minor version — the tool refuses
      # otherwise, because a mismatched binary reports conflicts that will not
      # happen.
      - go run {{.ROOT}}/tools/talos {{.ROOT}}/infra/cluster

  # ---------------------------------------------------------------------------
  # Bring-up
  # ---------------------------------------------------------------------------

  init:
    desc: "Create the Pulumi stack for this environment"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      # tools/stack, because the same decision is made here, in platform:init
      # and in the preview workflow, and three copies of a `pulumi stack ls
      # | jq -e` pipeline is three places to get it wrong.
      - go run {{.ROOT}}/tools/stack ensure "{{._CL_DIR}}" "{{._CL_STACK}}"

  token:
    desc: "Store the Hetzner API token in this stack, encrypted"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [init]
    cmds:
      # No `token=` variable, deliberately. Passing a credential as a task
      # argument writes it into the shell history and into the process
      # arguments, where `ps` shows it to every other user on the machine.
      #
      # Pulumi prompts for a value that is not on the command line and hides
      # the input, and it reads standard input when something is piped — so
      # both the interactive and the scripted path keep the token out of argv:
      #
      #   task cluster:token stack=dev                 # prompts, hidden
      #   pass hetzner/token | task cluster:token      # from a secret manager
      #
      # Interactive by necessity: --non-interactive would refuse to prompt.
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --stack "{{._CL_STACK}}" config set --secret hcloud:token
          echo "stored hcloud:token — encrypted in Pulumi.{{._CL_STACK}}.yaml, safe to commit"

  plan:
    desc: "Show what applying the cluster would change; change nothing"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" preview --diff

  apply:
    desc: "Provision or converge the Talos cluster (idempotent)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: test -f "{{._CL_TOPOLOGY}}"
        msg: "no topology at {{._CL_TOPOLOGY}} — cp infra/cluster/cluster.example.yaml {{._CL_TOPOLOGY}} and edit adminCIDRs"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" up --yes

  destroy:
    desc: "Destroy the cluster. Asks first, because this deletes the servers."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Destroy the {{._CL_STACK}} CLUSTER and every server in it?"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" destroy --yes

  # ---------------------------------------------------------------------------
  # Credentials and inspection
  # ---------------------------------------------------------------------------

  outputs:
    desc: "Show the cluster stack outputs (secrets stay redacted)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" stack output

  kubeconfig:
    desc: "Write ./kubeconfig from the cluster stack"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" stack output kubeconfig --show-secrets > "{{.ROOT}}/kubeconfig"
          chmod 600 "{{.ROOT}}/kubeconfig"
          echo "wrote kubeconfig — export KUBECONFIG={{.ROOT}}/kubeconfig"

  kubeconfig-add:
    desc: "Add this cluster to ~/.kube/config, so a plain kubectl reaches it"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [kubeconfig]
    cmds:
      # Three entries added through kubectl, not a merged file.
      #
      # `kubectl config view --flatten` was the obvious way and it is wrong
      # here: it rewrites the WHOLE target, and inlines every other cluster's
      # certificate-authority file into the document. Measured on a config
      # holding an unrelated cluster — its `certificate-authority: /path/ca.crt`
      # came back as `certificate-authority-data: …`. That is somebody else's
      # entry changed to add ours.
      #
      # set-cluster/set-credentials/set-context touch only the three names
      # they are given, so an unrelated entry keeps its file reference.
      #
      # The certificate data is passed as base64 with --set-raw-bytes=false,
      # which is what keeps a cluster-admin key off the disk: the alternative,
      # --embed-certs with --client-key, needs the key written to a temporary
      # file first.
      #
      # Adding nothing at all is still an option, and the safer one:
      #
      #     export KUBECONFIG=$HOME/.kube/config:{{.ROOT}}/kubeconfig
      #
      # kubectl merges at read time, so both sets of contexts appear and no
      # file is touched.
      - cmd: |
          set -euo pipefail

          source="{{.ROOT}}/kubeconfig"
          target="${KUBECONFIG_TARGET:-$HOME/.kube/config}"

          read_source() {
            kubectl --kubeconfig "$source" config view --raw -o "jsonpath=$1"
          }

          context="$(kubectl --kubeconfig "$source" config current-context)"
          cluster="$(read_source "{.contexts[?(@.name=='$context')].context.cluster}")"
          user="$(read_source "{.contexts[?(@.name=='$context')].context.user}")"
          server="$(read_source "{.clusters[?(@.name=='$cluster')].cluster.server}")"
          authority="$(read_source "{.clusters[?(@.name=='$cluster')].cluster.certificate-authority-data}")"
          certificate="$(read_source "{.users[?(@.name=='$user')].user.client-certificate-data}")"
          key="$(read_source "{.users[?(@.name=='$user')].user.client-key-data}")"

          # Refuse a name that already means another cluster. set-cluster
          # overwrites the entry it is given, so without this the operator's
          # own `platform-dev` would become this one silently.
          if [ -f "$target" ]; then
            existing="$(kubectl --kubeconfig "$target" config view \
              -o "jsonpath={.clusters[?(@.name=='$cluster')].cluster.server}" 2>/dev/null || true)"

            if [ -n "$existing" ] && [ "$existing" != "$server" ]; then
              echo "$target already has a cluster named $cluster at $existing," >&2
              echo "and this stack's is $server. Rename one of them first." >&2
              exit 1
            fi

            # kubectl re-serialises the whole document, so any comments in it
            # are lost either way. current-context survives.
            cp "$target" "$target.$(date -u +%Y%m%dT%H%M%SZ).bak"
          else
            mkdir -p "$(dirname "$target")"
          fi

          add() { kubectl --kubeconfig "$target" config "$@" >/dev/null; }

          add set-cluster "$cluster" --server="$server"
          add set "clusters.$cluster.certificate-authority-data" "$authority" --set-raw-bytes=false
          add set "users.$user.client-certificate-data" "$certificate" --set-raw-bytes=false
          add set "users.$user.client-key-data" "$key" --set-raw-bytes=false
          add set-context "$context" --cluster="$cluster" --user="$user"

          chmod 600 "$target"

          # Not switched to, deliberately. Repointing the operator's shell is
          # the hazard every --kubeconfig in this repository exists to avoid.
          echo "added to $target"
          echo "  context: $context"
          echo "  switch:  kubectl config use-context $context"

  talosconfig:
    desc: "Write ./talosconfig from the cluster stack"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" stack output talosconfig --show-secrets > "{{.ROOT}}/talosconfig"
          chmod 600 "{{.ROOT}}/talosconfig"
          echo "wrote talosconfig — export TALOSCONFIG={{.ROOT}}/talosconfig"

  nodes:
    desc: "List cluster nodes"
    deps: [kubeconfig]
    cmds:
      - KUBECONFIG="{{.ROOT}}/kubeconfig" kubectl get nodes -o wide

  status:
    desc: "Cluster health at a glance: nodes, then anything not Running"
    deps: [kubeconfig]
    cmds:
      - cmd: |
          set -euo pipefail
          export KUBECONFIG="{{.ROOT}}/kubeconfig"
          echo "== nodes"
          kubectl get nodes -o wide
          echo
          echo "== pods that are not Running or Succeeded"
          # "(none)" must mean "every pod is healthy", not "kubectl could not
          # reach the cluster". Those are opposite answers, and discarding
          # stderr made them print the same line.
          if out="$(kubectl get pods -A \
                     --field-selector=status.phase!=Running,status.phase!=Succeeded 2>&1)"; then
            case "$out" in
              "") echo "  (none)" ;;
              *"No resources found"*) echo "  (none)" ;;
              *) printf '%s\n' "$out" ;;
            esac
          else
            printf '%s\n' "$out" >&2
            echo "  cannot reach the cluster — is KUBECONFIG set?" >&2
            exit 1
          fi

  hubble:
    desc: "Observe pod flows through Hubble — the evidence layers/20-network-policy is built from"
    deps: [kubeconfig]
    vars:
      # Enough to cover the periodic traffic — kubelet probes, scrapes, DNS —
      # without reaching past what the relay still holds.
      last: '{{.last | default "4000"}}'
    preconditions:
      - sh: command -v hubble >/dev/null
        msg: "hubble CLI not installed — brew install hubble, or https://github.com/cilium/hubble"
    cmds:
      - cmd: |
          set -euo pipefail
          export KUBECONFIG="{{.ROOT}}/kubeconfig"

          # The relay is a ClusterIP service, so reaching it means a forward.
          # Killed on the way out however this exits — a stray one holds the
          # local port, and the next run fails on it.
          kubectl -n "{{._CL_HUBBLE_NS}}" port-forward \
            "svc/{{._CL_HUBBLE_SVC}}" \
            "{{._CL_HUBBLE_LOCAL_PORT}}:{{._CL_HUBBLE_SVC_PORT}}" >/dev/null 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT

          server="127.0.0.1:{{._CL_HUBBLE_LOCAL_PORT}}"

          # Readiness asked of hubble itself rather than of the port: the
          # forward accepts a connection before the relay behind it does, so a
          # port check passes and the observe that follows fails.
          for _ in $(seq 1 "{{._CL_HUBBLE_WAIT}}"); do
            if hubble --server "$server" status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          hubble --server "$server" observe --last "{{.last}}"

  # ---------------------------------------------------------------------------
  # Day 2
  # ---------------------------------------------------------------------------

  etcd-snapshot:
    desc: "Take an etcd snapshot into .backups/"
    deps: [talosconfig]
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.ROOT}}/.backups"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          TALOSCONFIG="{{.ROOT}}/talosconfig" talosctl etcd snapshot \
            "{{.ROOT}}/.backups/etcd-${stamp}.db"
          echo "wrote .backups/etcd-${stamp}.db"

  upgrade-talos:
    desc: "Upgrade Talos on every node. Bump talos.version in the topology first, then re-bake."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [talosconfig]
    prompt: "Upgrade Talos on every node of {{._CL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          version="$(go run {{.ROOT}}/tools/topology get talos-version "{{._CL_TOPOLOGY}}")"
          export TALOSCONFIG="{{.ROOT}}/talosconfig"
          # One node at a time, waiting for each: rolling through the control
          # plane in parallel takes etcd below quorum.
          for node in $(talosctl get members -o json | jq -r '.spec.addresses[0]'); do
            echo "== upgrading ${node} to ${version}"
            talosctl upgrade --nodes "${node}" \
              --image "ghcr.io/siderolabs/installer:${version}" --wait
          done

  upgrade-k8s:
    desc: "Upgrade Kubernetes in place. Set kubernetes.version in the topology first."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [talosconfig]
    prompt: "Upgrade Kubernetes on {{._CL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          version="$(go run {{.ROOT}}/tools/topology get kubernetes-version "{{._CL_TOPOLOGY}}")"
          export TALOSCONFIG="{{.ROOT}}/talosconfig"
          talosctl upgrade-k8s --to "${version}"
