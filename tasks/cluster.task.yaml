# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

silent: true

vars:
  _CL_DIR: '{{.ROOT}}/infra/cluster'
  _CL_STACK: '{{.stack}}'
  _CL_TOPOLOGY: '{{.ROOT}}/infra/cluster/cluster.{{.stack}}.yaml'

  # The control-plane nodes, from Hetzner rather than from the cluster.
  #
  # `talosctl get members` is the obvious source and the wrong one: it needs
  # etcd to answer, and the task that uses this runs when etcd is what is
  # broken. The provider knows which servers exist whatever state they are in,
  # and role=control-plane is a label pkg/hetzner stamps.
  #
  # Refuses an empty match rather than looping zero times and reporting
  # success — an empty selector would match every server in the project.
  _CL_CONTROL_PLANE: |
    HCLOUD_TOKEN="$(go run "{{.ROOT}}/tools/token" "{{._CL_STACK}}")"
    export HCLOUD_TOKEN
    cluster="$(go run "{{.ROOT}}/tools/topology" get cluster-name "{{._CL_TOPOLOGY}}")"
    nodes="$(hcloud server list -l "cluster=${cluster},role=control-plane" -o noheader -o columns=ipv4)"
    test -n "$nodes"

  # Where the API server writes its audit log, which Talos configures and this
  # repository does not.
  #
  # Not a choice made here: Talos sets --audit-policy-file, --audit-log-path
  # and the three rotation flags itself, in
  # internal/app/machined/pkg/controllers/k8s/control_plane_final.go, and the
  # path is its KubernetesAuditLogDir constant — EphemeralMountPoint plus
  # log/audit/kube. Written down here because the task below reads it and
  # nothing else in this repository would say where it is.
  #
  # EPHEMERAL is the word Talos's own comment uses for that directory, and it
  # is the property that matters: `talosctl reset` takes it, a replaced
  # control-plane server takes it, and cluster:etcd:restore wipes every
  # control-plane node — so the procedure for an incident destroys the record
  # of it. Thirty days of retention is what the API server rotates to, not what
  # survives.
  _CL_AUDIT_LOG: /var/log/audit/kube/kube-apiserver.log

  # The suffix of the file written beside a snapshot, holding what the
  # snapshot said about itself when it was taken.
  #
  # A var because two tasks must spell it identically: etcd:snapshot writes it
  # and etcd:restore reads it, and a mismatch is not an error — the restore
  # just silently stops showing what the snapshot was supposed to contain.
  _CL_SNAPSHOT_INFO: '.info'

  # The layer that owns the backup destination, and the five outputs it
  # publishes. The names are spelled in layers/60-backup/main.go as constants
  # and here as strings — a shell script cannot import one — so
  # TestBackupOutputs_AreTheNamesTheUploadTaskReads holds the two equal. A
  # rename on one side alone is not an error: jq returns null, and the upload
  # authenticates with an empty password.
  _CL_BACKUP_DIR: '{{.ROOT}}/layers/60-backup'
  _CL_BACKUP_OUT_HOST: backupHost
  _CL_BACKUP_OUT_USER: backupUsername
  # The two `_PASS` vars hold the NAME of an output and not a password: the
  # values are generated into Pulumi state and reach this task through
  # `pulumi stack output`. checkov reads each name as a base64 secret, so each
  # takes a skip — and the directive has to be the line immediately above the
  # finding. A two-line comment with the directive on the first line is parsed
  # and then ignored, which reports as skipped and failed at once.
  # checkov:skip=CKV_SECRET_6: the name of an output, not a password
  _CL_BACKUP_OUT_PASS: backupPassword
  _CL_BACKUP_OUT_DIR: backupDirectory
  # checkov:skip=CKV_SECRET_6: the name of an output, not a password
  _CL_BACKUP_OUT_REPO_PASS: backupRepositoryPassword

  # The Storage Box's SSH port. Not 22: Hetzner runs the extended SSH service
  # — the one that speaks SFTP — on 23, and the plain service on 22 takes keys
  # only in RFC4716 format, which OpenSSH does not write.
  _CL_BACKUP_PORT: "23"

  # The rclone remote's name. It exists only in this command's environment:
  # every RCLONE_CONFIG_<NAME>_* variable is exported below, so no rclone
  # config file is written and no credential lands on disk. Lowercase here and
  # uppercase in the variable names, derived rather than spelled twice.
  _CL_BACKUP_REMOTE: box

  # The restic repository, inside the subaccount's home. A subdirectory rather
  # than the home itself, so the box can hold something else later without
  # restic and that something sharing a directory.
  _CL_BACKUP_REPO_DIR: restic

  # How many uploads stay on the box. `restic forget --keep-last` counts
  # SNAPSHOTS and one run uploads one, so this is recovery points rather than
  # files — and it is restic's own retention, not a listing this repository
  # sorts and truncates.
  _CL_BACKUP_KEEP: "10"

  # The known_hosts this upload trusts. Gitignored: it names the operator's own
  # box, and a host key is local trust rather than a property of the project.
  #
  # Strict, and there is no flag that turns it off. The first connection needs
  # trust_host_key=yes, which runs ssh-keyscan and prints the fingerprints to
  # compare against the Hetzner console — trust on first use, made explicit and
  # visible, instead of silently accepting whatever answers on port 23.
  _CL_BACKUP_KNOWN_HOSTS: '{{.ROOT}}/.known_hosts'

  # How long to wait for a node to come back with etcd in Preparing after its
  # EPHEMERAL partition is wiped. A reboot and a volume unlock; generous,
  # because the alternative to waiting is bootstrapping a node that is not
  # ready and reading an error about the wrong thing.
  # Two rounds of resets at roughly two minutes a node, which is what a
  # three-member restore actually took. It was 300, chosen when the procedure
  # was only ever run against one node.
  _CL_RECOVER_TIMEOUT: '1200'

  # Where the Cilium chart puts the Hubble relay, and what it listens on.
  # Named because `hubble` is given the local end and kubectl the remote one,
  # and a mismatch between the two produces a connection refused with nothing
  # saying which half is wrong.
  _CL_HUBBLE_NS: kube-system
  _CL_HUBBLE_SVC: hubble-relay
  _CL_HUBBLE_SVC_PORT: "80"
  _CL_HUBBLE_LOCAL_PORT: "4245"
  # Seconds to wait for the forward. The relay answers in about one.
  _CL_HUBBLE_WAIT: "15"

  # The label every server of a cluster carries — pkg/hetzner stamps it and
  # the firewall selects on it. Read through the real parser rather than
  # grepped out of the yaml: an empty selector matches EVERY server in the
  # project, which for a power command is the difference between one cluster
  # and all of them.
  _CL_SELECTOR: 'cluster=$(go run "{{.ROOT}}/tools/topology" get cluster-name "{{._CL_TOPOLOGY}}")'

  # The system volumes that carry secrets, and what a probe calls an encrypted
  # one. Named because encryption:check compares against them: a typo here
  # reports "not found" rather than silently passing.
  _CL_ENCRYPTED_VOLUMES: "STATE EPHEMERAL"
  _CL_LUKS: luks

# The tasks below with a `deps:` carry no stack guard of their own: Task runs
# dependencies before a task's own preconditions, so the dependency's guard
# fires first and names itself. A second guard there would be unreachable.

tasks:
  # ---------------------------------------------------------------------------
  # Prerequisite
  # ---------------------------------------------------------------------------

  image:bake:
    desc: "Bake the Talos snapshot named by the topology into the hcloud project (idempotent)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — brew bundle, or brew install hcloud"
      - sh: command -v hcloud-upload-image >/dev/null
        msg: "hcloud-upload-image not installed — go install github.com/apricote/hcloud-upload-image@latest"
      - sh: test -f "{{._CL_TOPOLOGY}}"
        msg: "no topology at {{._CL_TOPOLOGY}} — cp infra/cluster/cluster.example.yaml {{._CL_TOPOLOGY}} and edit adminCIDRs"
    cmds:
      # Forty-eight lines of shell used to live here: `curl | jq` for the
      # Image Factory, `hcloud image list | awk` for idempotence, a `case` for
      # the architecture, and an `env:` stanza resolving the token — which Task
      # evaluates BEFORE preconditions, so the precondition holding the remedy
      # could never print. All of it is tools/image now, where it is
      # testable and where `jq` and `curl` are not needed at all.
      - go run "{{.ROOT}}/tools/image" "{{._CL_TOPOLOGY}}" "{{._CL_STACK}}"

  talosctl:install:
    desc: "Download the talosctl the topologies pin into bin/, for this platform"
    # No stack, deliberately. This installs a tool, not a cluster's artifact,
    # and it has to work on a clone that has no stack yet — cluster.<stack>.yaml
    # is gitignored, so right after `git clone` the only topology present is
    # the committed example. Requiring a stack made the task unusable at the
    # one moment it is needed.
    preconditions:
      - sh: command -v curl >/dev/null
        msg: "curl not installed — it ships with macOS, so this is unexpected"
    cmds:
      # Homebrew carries one talosctl, the newest, and machine-config:check
      # needs the minor the topology names — so the two cannot both live on
      # PATH. This writes the pinned one into bin/, which tools/talos prefers,
      # leaving whatever brew installed alone for every other use.
      #
      # The version comes from the topology and the platform from uname, which
      # is the point: the Brewfile used to carry a curl with v1.13.10 and
      # darwin-arm64 written into it, wrong on Linux and wrong the moment the
      # pin moved.
      - cmd: |
          set -euo pipefail

          # Every topology, not one: a single bin/talosctl validates all of
          # them, so they have to agree on the version. Disagreeing is worth
          # saying out loud rather than installing whichever came first and
          # leaving machine-config:check to fail against the other.
          # Space-separated on purpose: a version token holds no spaces, so
          # word splitting is the whole parser needed here.
          versions=""
          for topology in "{{.ROOT}}"/infra/cluster/cluster.*.yaml; do
            [ -f "$topology" ] || continue
            versions="${versions} $(go run "{{.ROOT}}/tools/topology" get talos-version "$topology")"
          done

          # shellcheck disable=SC2086 # splitting is intended
          distinct="$(printf '%s\n' ${versions} | awk 'NF' | sort -u)"
          count="$(printf '%s' "${distinct}" | awk 'NF {n++} END {print n + 0}')"

          if [ "${count}" -eq 0 ]; then
            printf '%s\n' "{{._ERR}} cluster · talosctl · no topology in infra/cluster names a Talos version" >&2
            exit 1
          fi

          if [ "${count}" -gt 1 ]; then
            printf '%s\n' "{{._ERR}} cluster · talosctl · topologies disagree on talos.version: $(printf '%s' "${distinct}" | tr '\n' ' ')" >&2
            printf '%s\n' "{{._ERR}} cluster · talosctl · one binary validates them all, so pin one version" >&2
            exit 1
          fi

          version="${distinct}"

          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) printf '%s\n' "{{._ERR}} cluster · talosctl · unknown architecture $(uname -m)" >&2; exit 1 ;;
          esac

          mkdir -p "{{.ROOT}}/bin"
          url="https://github.com/siderolabs/talos/releases/download/${version}/talosctl-${os}-${arch}"

          printf '%s\n' "{{._RUN}} cluster · talosctl · ${version} for ${os}/${arch}"
          curl -sSfLo "{{.ROOT}}/bin/talosctl" "$url"
          chmod +x "{{.ROOT}}/bin/talosctl"

          # Proves the download is the binary it claims to be, before anything
          # depends on it. A 404 page saved to disk would be executable-shaped
          # and fail later with something unrelated.
          # The version token wherever it appears: --short prints "Talos v1.2.3"
          # and the long form prints "Tag:  v1.2.3", and the format has moved
          # between minors before.
          got="$("{{.ROOT}}/bin/talosctl" version --client 2>/dev/null |
            awk 'match($0, /v[0-9]+\.[0-9]+\.[0-9]+/) {
                   print substr($0, RSTART, RLENGTH); exit }')"
          if [ "${got}" != "${version}" ]; then
            printf '%s\n' "{{._ERR}} cluster · talosctl · downloaded ${got:-nothing}, wanted ${version}" >&2
            exit 1
          fi

          printf '%s\n' "{{._OK}} cluster · talosctl · bin/talosctl is ${version}"

  machine-config:check:
    desc: "Validate the machine-config patches against Talos itself — no cluster needed"
    # No stack either: the command below validates every topology in
    # infra/cluster, so there is nothing per-stack about it. The guard was
    # here and the stack was never read.
    preconditions:
      - sh: test -x "{{.ROOT}}/bin/talosctl" || command -v talosctl >/dev/null
        msg: "no talosctl — `task cluster:talosctl:install` writes the pinned one into bin/"
    cmds:
      # The unit tests prove the patches contain what was intended; only Talos
      # can say whether it accepts them. Catches at plan time what would
      # otherwise fail after the servers exist.
      #
      # talosctl must match the pinned minor version — the tool refuses
      # otherwise, because a mismatched binary reports conflicts that will not
      # happen.
      - go run "{{.ROOT}}/tools/talos" "{{.ROOT}}/infra/cluster"

  # ---------------------------------------------------------------------------
  # Bring-up
  # ---------------------------------------------------------------------------

  stacks:
    desc: "Every cluster stack, with what the backend and its topology say about it"
    # No stack argument, deliberately: this is the task that answers what the
    # stacks are. It is also the one to run before the others on an unfamiliar
    # clone — cluster.<stack>.yaml is gitignored, so a stack whose topology is
    # somebody else's working copy shows as "missing" here rather than as a
    # failure three tasks later.
    cmds:
      - cmd: go run "{{.ROOT}}/tools/stack" list "{{._CL_DIR}}"

  init:
    desc: "Create the Pulumi stack for this environment"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      # tools/stack, because the same decision is made here, in platform:init
      # and in the preview workflow, and three copies of a `pulumi stack ls
      # | jq -e` pipeline is three places to get it wrong.
      #
      # It prints one word — created, or existing. The line is composed here
      # because this task is a dependency of several others, and what those
      # runs want in their output is the stack's name, not a path.
      - cmd: |
          set -euo pipefail
          state="$(go run "{{.ROOT}}/tools/stack" ensure "{{._CL_DIR}}" "{{._CL_STACK}}")"
          printf '%s\n' "{{._RUN}} cluster · stack · {{._CL_STACK}} ${state}"

  token:
    desc: "Store the Hetzner API token in this stack, encrypted"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [init]
    cmds:
      # No `token=` variable, deliberately. Passing a credential as a task
      # argument writes it into the shell history and into the process
      # arguments, where `ps` shows it to every other user on the machine.
      #
      # Pulumi prompts for a value that is not on the command line and hides
      # the input, and it reads standard input when something is piped — so
      # both the interactive and the scripted path keep the token out of argv:
      #
      #   task cluster:token stack=dev                       # prompts, hidden
      #   pass hetzner/token | task cluster:token stack=dev  # a secret manager
      #
      # The piped form needs the stack too: without it the precondition prints
      # the usage and stdin is never read, which reads as the pipe failing.
      #
      # Interactive by necessity: --non-interactive would refuse to prompt.
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --stack "{{._CL_STACK}}" config set --secret hcloud:token
          printf '%s\n' "{{._OK}} cluster · token · encrypted in Pulumi.{{._CL_STACK}}.yaml, which is gitignored"

  plan:
    desc: "Show what applying the cluster would change; change nothing"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" preview --diff

  apply:
    desc: "Provision or converge the Talos cluster (idempotent)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: test -f "{{._CL_TOPOLOGY}}"
        msg: "no topology at {{._CL_TOPOLOGY}} — cp infra/cluster/cluster.example.yaml {{._CL_TOPOLOGY}} and edit adminCIDRs"
    # Applying is not the safe half of the pair. `pulumi up` creates servers,
    # and it REPLACES them for any input that forces one — a server type, a
    # datacenter, a private address — which on a single-node cluster is the
    # same outage a destroy would cause. Measured here: replacing the only
    # control plane took the cluster down and needed a bootstrap to come back.
    #
    # Pass --yes to skip this, which is what a script should do explicitly.
    prompt: "Apply the {{._CL_STACK}} cluster? This creates servers, and replaces them when an input forces it."
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" up --yes

  destroy:
    desc: "Destroy the cluster. Asks first, because this deletes the servers."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Destroy the {{._CL_STACK}} CLUSTER and every server in it?"
    cmds:
      # --exclude-protected, because without it this task could not finish at
      # all. The Talos secrets bundle is `protect: true`, so a plain destroy
      # fails in PREVIEW — nothing is deleted, and the operator is handed
      #
      #     pulumi state unprotect 'urn:pulumi:dev::hetzner-cluster::…'
      #
      # to type by hand, in the middle of a teardown they have already
      # confirmed. A raw state command improvised under those conditions is a
      # worse hazard than the one the protection exists for.
      #
      # So the servers, the network, the firewall and the placement group go,
      # and the cluster's root of trust stays. That is not a leftover: the CA
      # is what a rebuilt cluster can keep, and keeping it costs nothing —
      # a Talos secrets bundle is state, not a billed resource.
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" destroy --yes --exclude-protected
          printf '\n'
          printf '%s\n' "{{._SKIP}} cluster · secrets · kept — the CA is state, not a billed resource"
          printf '%s\n' "{{._SKIP}} cluster · secrets · remove it too: task cluster:secrets:destroy stack={{._CL_STACK}}"

  secrets:destroy:
    desc: "Destroy the Talos secrets bundle too — the cluster CA. Unrecoverable."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    prompt: "Destroy the {{._CL_STACK}} cluster CA? Every certificate it signed becomes unverifiable."
    cmds:
      # --ignore-protect rather than `pulumi state unprotect` then destroy:
      # the flag is scoped to this one operation, so a failure part way
      # through leaves the protection in place. Unprotecting first does not —
      # it edits the state and leaves it edited.
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" destroy --yes --ignore-protect

  stop:
    desc: "Shut the cluster down cleanly through Talos — it keeps existing, and keeps being billed"
    deps: [talosconfig]
    prompt: "Shut down every node of {{._CL_STACK}}? The API stops answering until it is powered on again."
    cmds:
      # The CLUSTER's stop, which is a different operation from the
      # instance's: it brings etcd down cleanly and can cordon and evict
      # first, where `hcloud:shutdown` only presses the power button and tells
      # Kubernetes nothing. Halting the machine is its consequence, so getting
      # back is an instance operation — `task hcloud:poweron`.
      #
      # No --drain on purpose. Draining evicts pods so they can start
      # elsewhere, and on a single-node cluster there is no elsewhere — the
      # drain waits out its timeout and changes nothing. Add it by hand when
      # there is more than one node and only one is going down.
      - cmd: |
          set -euo pipefail
          export TALOSCONFIG="{{.ROOT}}/talosconfig"
          talosctl shutdown
          printf '\n'
          printf '%s\n' "{{._OK}} cluster · stop · halted, and still billed — only cluster:destroy stops that"
          printf '%s\n' "{{._OK}} cluster · stop · back up with: task hcloud:poweron stack={{._CL_STACK}}"

  reboot:
    desc: "Reboot the cluster's nodes through Talos"
    deps: [talosconfig]
    prompt: "Reboot every node of {{._CL_STACK}}?"
    cmds:
      # Talos again, for the same reason, and it comes back on its own — no
      # poweron needed, because the machine never loses power. The hard
      # equivalent, for when Talos cannot answer, is `task hcloud:reset`.
      - cmd: |
          set -euo pipefail
          export TALOSCONFIG="{{.ROOT}}/talosconfig"
          talosctl reboot

  # ---------------------------------------------------------------------------
  # Credentials and inspection
  # ---------------------------------------------------------------------------

  outputs:
    desc: "Show the cluster stack outputs (secrets stay redacted)"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" stack output

  kubeconfig:
    desc: "Write ./kubeconfig from the cluster stack"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" stack output kubeconfig --show-secrets > "{{.ROOT}}/kubeconfig"
          chmod 600 "{{.ROOT}}/kubeconfig"
          printf '%s\n' "{{._OK}} cluster · kubeconfig · wrote ./kubeconfig — export KUBECONFIG={{.ROOT}}/kubeconfig"

  smoke:
    desc: "Ask whether the cluster can run a workload — nodes, a volume, a load balancer"
    deps: [kubeconfig]
    cmds:
      - cmd: |
          set -euo pipefail
          go run "{{.ROOT}}/tools/smoke" --kubeconfig "{{.ROOT}}/kubeconfig"

  kubeconfig:add:
    desc: "Add this cluster to ~/.kube/config, so a plain kubectl reaches it"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [kubeconfig]
    cmds:
      # Three entries added through kubectl, not a merged file.
      #
      # `kubectl config view --flatten` was the obvious way and it is wrong
      # here: it rewrites the WHOLE target, and inlines every other cluster's
      # certificate-authority file into the document. Measured on a config
      # holding an unrelated cluster — its `certificate-authority: /path/ca.crt`
      # came back as `certificate-authority-data: …`. That is somebody else's
      # entry changed to add ours.
      #
      # set-cluster/set-credentials/set-context touch only the three names
      # they are given, so an unrelated entry keeps its file reference.
      #
      # The certificate data is passed as base64 with --set-raw-bytes=false,
      # which is what keeps a cluster-admin key off the disk: the alternative,
      # --embed-certs with --client-key, needs the key written to a temporary
      # file first.
      #
      # Adding nothing at all is still an option, and the safer one:
      #
      #     export KUBECONFIG=$HOME/.kube/config:{{.ROOT}}/kubeconfig
      #
      # kubectl merges at read time, so both sets of contexts appear and no
      # file is touched.
      - cmd: |
          set -euo pipefail

          source="{{.ROOT}}/kubeconfig"
          target="${KUBECONFIG_TARGET:-$HOME/.kube/config}"

          read_source() {
            kubectl --kubeconfig "$source" config view --raw -o "jsonpath=$1"
          }

          context="$(kubectl --kubeconfig "$source" config current-context)"
          cluster="$(read_source "{.contexts[?(@.name=='$context')].context.cluster}")"
          user="$(read_source "{.contexts[?(@.name=='$context')].context.user}")"
          server="$(read_source "{.clusters[?(@.name=='$cluster')].cluster.server}")"
          authority="$(read_source "{.clusters[?(@.name=='$cluster')].cluster.certificate-authority-data}")"
          certificate="$(read_source "{.users[?(@.name=='$user')].user.client-certificate-data}")"
          key="$(read_source "{.users[?(@.name=='$user')].user.client-key-data}")"

          # Refuse a name that already means another cluster. set-cluster
          # overwrites the entry it is given, so without this the operator's
          # own `platform-dev` would become this one silently.
          if [ -f "$target" ]; then
            existing="$(kubectl --kubeconfig "$target" config view \
              -o "jsonpath={.clusters[?(@.name=='$cluster')].cluster.server}" 2>/dev/null || true)"

            if [ -n "$existing" ] && [ "$existing" != "$server" ]; then
              printf '%s\n' "$target already has a cluster named $cluster at $existing," >&2
              printf '%s\n' "and this stack's is $server. Rename one of them first." >&2
              exit 1
            fi

            # kubectl re-serialises the whole document, so any comments in it
            # are lost either way. current-context survives.
            cp "$target" "$target.$(date -u +%Y%m%dT%H%M%SZ).bak"
          else
            mkdir -p "$(dirname "$target")"
          fi

          add() { kubectl --kubeconfig "$target" config "$@" >/dev/null; }

          add set-cluster "$cluster" --server="$server"
          add set "clusters.$cluster.certificate-authority-data" "$authority" --set-raw-bytes=false
          add set "users.$user.client-certificate-data" "$certificate" --set-raw-bytes=false
          add set "users.$user.client-key-data" "$key" --set-raw-bytes=false
          add set-context "$context" --cluster="$cluster" --user="$user"

          chmod 600 "$target"

          # Not switched to, deliberately. Repointing the operator's shell is
          # the hazard every --kubeconfig in this repository exists to avoid.
          printf '%s\n' "{{._OK}} cluster · kubeconfig · added to $target"
          printf '%s\n' "{{._SKIP}} cluster · kubeconfig · not switched to — kubectl config use-context $context"

  talosconfig:
    desc: "Write ./talosconfig from the cluster stack"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{._CL_DIR}}"
          pulumi --non-interactive --stack "{{._CL_STACK}}" stack output talosconfig --show-secrets > "{{.ROOT}}/talosconfig"
          chmod 600 "{{.ROOT}}/talosconfig"
          printf '%s\n' "{{._OK}} cluster · talosconfig · wrote ./talosconfig — export TALOSCONFIG={{.ROOT}}/talosconfig"

  nodes:
    desc: "List cluster nodes"
    deps: [kubeconfig]
    cmds:
      - KUBECONFIG="{{.ROOT}}/kubeconfig" kubectl get nodes -o wide

  status:
    desc: "Cluster health at a glance: nodes, then anything not Running"
    deps: [kubeconfig]
    cmds:
      - cmd: |
          set -euo pipefail
          export KUBECONFIG="{{.ROOT}}/kubeconfig"
          printf '%s\n' "{{._RUN}} cluster · status · nodes"
          kubectl get nodes -o wide
          printf '\n'
          printf '%s\n' "{{._RUN}} cluster · status · pods that are not Running or Succeeded"
          # "(none)" must mean "every pod is healthy", not "kubectl could not
          # reach the cluster". Those are opposite answers, and discarding
          # stderr made them print the same line.
          if out="$(kubectl get pods -A \
                     --field-selector=status.phase!=Running,status.phase!=Succeeded 2>&1)"; then
            case "$out" in
              "") printf '%s\n' "  (none)" ;;
              *"No resources found"*) printf '%s\n' "  (none)" ;;
              *) printf '%s\n' "$out" ;;
            esac
          else
            printf '%s\n' "$out" >&2
            printf '%s\n' "{{._ERR}} cluster · status · cannot reach the cluster — the API server is down, or this address is not in network.adminCIDRs" >&2
            exit 1
          fi

  hubble:
    desc: "Observe pod flows through Hubble — the evidence layers/20-network-policy is built from"
    deps: [kubeconfig]
    vars:
      # Enough to cover the periodic traffic — kubelet probes, scrapes, DNS —
      # without reaching past what the relay still holds.
      last: '{{.last | default "4000"}}'
    preconditions:
      - sh: command -v hubble >/dev/null
        msg: "hubble CLI not installed — brew install hubble, or https://github.com/cilium/hubble"
    cmds:
      - cmd: |
          set -euo pipefail
          export KUBECONFIG="{{.ROOT}}/kubeconfig"

          # The relay is a ClusterIP service, so reaching it means a forward.
          # Killed on the way out however this exits — a stray one holds the
          # local port, and the next run fails on it.
          kubectl -n "{{._CL_HUBBLE_NS}}" port-forward \
            "svc/{{._CL_HUBBLE_SVC}}" \
            "{{._CL_HUBBLE_LOCAL_PORT}}:{{._CL_HUBBLE_SVC_PORT}}" >/dev/null 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT

          server="127.0.0.1:{{._CL_HUBBLE_LOCAL_PORT}}"

          # Readiness asked of hubble itself rather than of the port: the
          # forward accepts a connection before the relay behind it does, so a
          # port check passes and the observe that follows fails.
          for _ in $(seq 1 "{{._CL_HUBBLE_WAIT}}"); do
            if hubble --server "$server" status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          hubble --server "$server" observe --last "{{.last}}"

  audit:
    desc: "Who did what to this cluster's API, from every control-plane node; read-only"
    deps: [talosconfig]
    vars:
      # Per node, not in total. Three API servers each write their own log and
      # the load balancer spreads requests across them, so a question about
      # one request is answered by whichever node happened to serve it — which
      # is why this reads all of them and sorts the result rather than picking
      # one.
      last: '{{.last | default "200"}}'
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: command -v jq >/dev/null
        msg: "jq not installed — brew bundle, or brew install jq. The log is JSON lines"
    cmds:
      - cmd: |
          set -euo pipefail
          export TALOSCONFIG="{{.ROOT}}/talosconfig"

          {{._CL_CONTROL_PLANE}}

          # One line per event, sorted across nodes, because the useful
          # question is "what happened at 14:02" and not "what did node 3 see".
          #
          # ResponseComplete only. At Metadata level the policy Talos ships
          # emits RequestReceived as well, so every request appears twice —
          # and it is the second one that carries the status code, which is
          # what says whether the thing was allowed.
          filter='select(.stage == "ResponseComplete")
            | [ .stageTimestamp,
                (.user.username // "-"),
                .verb,
                ((.objectRef.resource // "-")
                  + (if .objectRef.namespace then "/" + .objectRef.namespace else "" end)
                  + (if .objectRef.name then "/" + .objectRef.name else "" end)),
                ((.responseStatus.code // "-") | tostring) ]
            | @tsv'

          collected="$(mktemp)"
          trap 'rm -f "${collected}"' EXIT

          missing=""

          for node in $nodes; do
            # --endpoints as well as --nodes, for the reason etcd:restore
            # carries at length: with --nodes alone talosctl asks the endpoint
            # to proxy to the node, and a peer's public address is not a path
            # the endpoint can route to.
            #
            # A node with no log is reported rather than fatal. A control plane
            # that came up minutes ago has nothing to read yet, and refusing
            # to show the other two would answer nothing.
            if ! talosctl --endpoints "$node" --nodes "$node" \
                 read "{{._CL_AUDIT_LOG}}" 2>/dev/null \
                 | tail -n "{{.last}}" \
                 | jq -r "$filter" \
                 | awk -v node="$node" -F'\t' \
                     '{ printf "%s\t%s\t%s\t%s\t%s\t%s\n", $1, node, $2, $3, $4, $5 }' \
                 >> "${collected}"; then
              missing="${missing} ${node}"
            fi
          done

          if [ -n "$missing" ]; then
            printf '%s\n' "{{._WARN}} cluster · audit · no log on:${missing}"
          fi

          if [ ! -s "${collected}" ]; then
            printf '%s\n' "{{._ERR}} cluster · audit · nothing read from any control-plane node" >&2
            exit 1
          fi

          sort "${collected}" | awk -F'\t' \
            'BEGIN { printf "%-28s %-15s %-32s %-7s %s\n", "TIME", "NODE", "USER", "VERB", "RESOURCE (CODE)" }
             # A long service-account name pushes its own line and leaves the
             # rest aligned, which is the trade a fixed width buys: TIME is
             # what a reader scans down.
             { printf "%-28s %-15s %-32s %-7s %s (%s)\n", $1, $2, $3, $4, $5, $6 }'

          printf '\n%s\n' "{{._OK}} cluster · audit · last {{.last}} event(s) per node, ResponseComplete only"
          printf '%s\n' "{{._SKIP}} cluster · audit · the whole file, unfiltered:"
          printf '%s\n' "    talosctl --endpoints <node> --nodes <node> read {{._CL_AUDIT_LOG}}"

  orphans:
    desc: "Hetzner resources nothing claims any more — volumes, load balancers, servers, addresses, snapshots. Works after a teardown too"
    deps: [kubeconfig]
    cmds:
      # Read-only, and it never deletes. Two silent ways this platform loses
      # track of a resource, both billed:
      #
      #   - a StatefulSet's claims outlive their Helm release, which is
      #     Kubernetes behaving as designed, so destroying a layer leaves its
      #     volumes behind. 160 GiB were found that way.
      #   - destroying a cluster destroys the API server that would have told
      #     the CSI driver to delete a volume.
      #
      # Which is why it answers with no cluster at all: no server carrying the
      # cluster's label means no cluster, so nothing can claim anything and
      # every remaining resource really is orphaned. `task destroy` runs it
      # last for exactly that reason.
      #
      # The token comes from the stack the same way every other task's does.
      - cmd: |
          set -euo pipefail
          go run "{{.ROOT}}/tools/orphans" \
            "{{._CL_STACK}}" "{{.ROOT}}/kubeconfig" "{{._CL_TOPOLOGY}}"

  encryption:check:
    desc: "Are the system volumes actually encrypted? Talos skips encryption on a formatted partition, silently"
    deps: [talosconfig]
    cmds:
      # The check exists because the failure is silent in the worst way: Talos
      # encrypts STATE and EPHEMERAL only when the partition is empty and has
      # no filesystem, so applying the VolumeConfig to a node that already
      # exists is accepted, reports nothing, and leaves the disk in plaintext.
      # The machine config then says encrypted and the volume is not.
      #
      # `name` is what the blockdevice probe recognised. On an encrypted volume
      # that is the LUKS container; on a plaintext one it is the filesystem
      # itself, which is what this cluster shows today:
      #
      #   {"label":"STATE","name":"xfs"}      <- plaintext
      #   {"label":"STATE","name":"luks"}     <- encrypted
      - cmd: |
          set -euo pipefail
          export TALOSCONFIG="{{.ROOT}}/talosconfig"

          plaintext=0

          printf '%-12s %-10s %s\n' VOLUME PROBED STATE

          for label in {{._CL_ENCRYPTED_VOLUMES}}; do
            # No -n: the talosconfig this task just wrote names its own
            # endpoint, the same way cluster:etcd:snapshot relies on it.
            # Parsing `talosctl config info` for an address would be a second
            # source for something the file already answers.
            probed="$(talosctl get discoveredvolumes -o json \
              | jq -r --arg l "$label" 'select(.spec.partition_label==$l) | .spec.name')"

            case "$probed" in
              "{{._CL_LUKS}}") state=encrypted ;;
              "")              state="not found"; plaintext=1 ;;
              *)               state=PLAINTEXT;   plaintext=1 ;;
            esac

            printf '%-12s %-10s %s\n' "$label" "${probed:--}" "$state"
          done

          if [ "$plaintext" -ne 0 ]; then
            printf '\n' >&2
            printf '%s\n' "{{._ERR}} cluster · encryption · a system volume is plaintext"    >&2
            printf '%s\n' "Talos has no in-place encryption, so a node built before the"      >&2
            printf '%s\n' "VolumeConfig keeps its plaintext partitions however often the"    >&2
            printf '%s\n' "config is re-applied. The fix is a node built with it:"           >&2
            printf '\n' >&2
            printf '%s\n' "    task cluster:destroy stack={{.stack}}"                      >&2
            printf '%s\n' "    task cluster:apply   stack={{.stack}}"                      >&2
            printf '%s\n' "    task platform:apply layer=all stack={{.stack}}"                   >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Upgrades and backups
  # ---------------------------------------------------------------------------

  # ─── Getting the cluster back when Pulumi's state is what was lost ─────────

  recovery-kit:
    desc: "Print everything a recovery needs that lives nowhere but Pulumi state — pipe it into a password store"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      # No prompt and no `set -euo pipefail` wrapper: the tool writes to
      # stdout and nothing else, so the caller's pipe is the whole interface.
      # It refuses a terminal on its own and names the pipe to use.
      #
      # Why this exists beside secrets:export rather than instead of it: the
      # bundle alone does not open the snapshots. restic's repository password
      # is generated into layers/60-backup's state, and re-applying that layer
      # produces a different one — so the state holds both halves of its own
      # backup, and this is the command that takes them out together.
      - cmd: go run "{{.ROOT}}/tools/recoverykit" "{{._CL_STACK}}"

  state:export:
    desc: "Export every stack's Pulumi state into .backups/state/ — the answer to a stack somebody deleted"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail

          dir="{{.ROOT}}/.backups/state"
          mkdir -p "$dir"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"

          # Ciphertext, deliberately. `--show-secrets` would put the cluster
          # CA and the Hetzner token in a file on a disk, and that is what
          # `task cluster:recovery-kit` is for — piped into a password store,
          # never written down. Ciphertext is enough for what this answers: a
          # stack somebody removed, where the account still works and
          # `pulumi stack import` can read it back.
          #
          # Every tier, because the irreplaceable part is not only in the
          # cluster's: layers/60-backup generates the restic password into its
          # own state, and which layer holds something generated is exactly
          # the judgement that goes stale.
          printf '%s\n' "{{._RUN}} cluster · state:export · {{._CL_STACK}} into .backups/state/"

          exported=0

          for project in infra/cluster {{range $layer := splitList " " .LAYERS}}layers/{{$layer}} {{end}}; do
            name="$(printf '%s' "$project" | tr / -)"
            out="${dir}/${name}.{{._CL_STACK}}.${stamp}.json"

            # A stack that was never created is not a failure of this task: a
            # layer nobody applied has no state to export, and refusing to
            # write the ones that do exist would be the worse outcome.
            if ( cd "{{.ROOT}}/${project}" && \
                 pulumi --non-interactive --stack "{{._CL_STACK}}" stack export > "${out}" ) 2>/dev/null; then
              exported=$((exported + 1))
            else
              rm -f "${out}"
              printf '%s\n' "{{._SKIP}} cluster · state:export · ${project} has no {{._CL_STACK}} stack"
            fi
          done

          if [ "${exported}" -eq 0 ]; then
            printf '%s\n' "{{._ERR}} cluster · state:export · nothing exported — is this the right stack?" >&2
            exit 1
          fi

          printf '%s\n' "{{._OK}} cluster · state:export · ${exported} stack(s) into .backups/state/"
          printf '%s\n' "{{._WARN}} cluster · state:export · secrets stay encrypted by this backend's key, so this copy needs the backend. task cluster:recovery-kit is the one that does not"

  secrets:export:
    desc: "Print the cluster's Talos secrets bundle — pipe it into a password store. Without it an etcd snapshot restores nothing."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      # No prompt, and no `set -euo pipefail` wrapper: the tool writes to
      # stdout and nothing else, so the caller's pipe is the whole interface.
      # It refuses a terminal on its own and names the pipe to use — a
      # certificate authority in scrollback outlives the session.
      - cmd: go run "{{.ROOT}}/tools/secrets" "{{._CL_STACK}}"

  etcd:snapshot:
    desc: "Take an etcd snapshot into .backups/, read it back, and record what it holds"
    deps: [talosconfig]
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.ROOT}}/.backups"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="{{.ROOT}}/.backups/etcd-${stamp}.db"

          # talosctl reports the hash, the revision and the key count as it
          # writes, on stdout. Captured rather than left to scroll past: it is
          # the only account of what the snapshot held at the moment it was
          # taken, and it is what tells one snapshot from another later.
          taken="$(TALOSCONFIG="{{.ROOT}}/talosconfig" talosctl etcd snapshot "$file" \
            | grep '^snapshot info:')"

          # Read back before this reports success. A snapshot nobody has
          # opened is a file of the right size, and the moment to discover
          # that is now rather than during the incident it was taken for.
          read_back="$(go run "{{.ROOT}}/tools/etcd" verify "$file")"

          # Beside the snapshot, so the two travel together wherever it goes.
          {
            printf '%s\n' "taken:     ${stamp}"
            printf '%s\n' "talosctl:  ${taken}"
            printf '%s\n' "read back: ${read_back}"
          } > "${file}{{._CL_SNAPSHOT_INFO}}"

          printf '%s\n' "{{._OK}} cluster · etcd · ${taken}"
          printf '%s\n' "{{._OK}} cluster · etcd · ${read_back}"
          printf '%s\n' "{{._OK}} cluster · etcd · wrote .backups/etcd-${stamp}.db and its {{._CL_SNAPSHOT_INFO}}"

  etcd:restore:
    desc: "Restore etcd from a snapshot — wipes every control-plane node first (snapshot=<path>). The other half of a backup."
    deps: [talosconfig]
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: '[ -n "{{.snapshot}}" ]'
        msg: |
          cluster:etcd:restore needs the snapshot to restore from.

              task cluster:etcd:restore stack=dev snapshot=.backups/etcd-<stamp>.db

          `task cluster:etcd:snapshot` writes them; ls .backups/ for what exists.
      - sh: '[ -f "{{.snapshot}}" ]'
        msg: "no snapshot at {{.snapshot}} — ls .backups/ for what exists"
      - sh: command -v talosctl >/dev/null
        msg: "talosctl not installed — https://docs.siderolabs.com/talos/v1.13/getting-started/talosctl"
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — brew bundle, or brew install hcloud"
    prompt: "Restore {{._CL_STACK}} from {{.snapshot}}? Every control-plane node is wiped and rebuilt from it, and everything written after it is gone."
    cmds:
      # The procedure Talos documents, and nothing invented on top of it:
      # wipe EPHEMERAL on every control-plane node, wait for each to come back
      # with etcd Preparing, then bootstrap one of them from the snapshot.
      #
      # No --recover-skip-hash-check. That flag is for a snapshot copied out of
      # /var/lib/etcd by hand, which carries no hash; `cluster:etcd:snapshot`
      # takes them through the etcd API, which writes one. Passing it anyway
      # would turn the integrity check off for every restore.
      #
      # No talosctl version gate either, unlike cluster:machine-config:check. That
      # check refuses a mismatched minor because config validation differs
      # between them and reports conflicts that will not happen; reset and
      # bootstrap are plain API calls, and talosctl is supported one minor
      # ahead of the cluster.
      - cmd: |
          set -euo pipefail
          export TALOSCONFIG="{{.ROOT}}/talosconfig"

          # Before anything is wiped. A truncated download has the right name
          # and the right size to the eye, and finding out after the reset
          # leaves a cluster with no etcd and no way back.
          printf '%s\n' "{{._RUN}} cluster · etcd:restore · checking the snapshot"
          go run "{{.ROOT}}/tools/etcd" verify "{{.snapshot}}"

          # What the snapshot said about itself when it was taken, if
          # cluster:etcd:snapshot wrote it. Shown beside what was just read
          # back, because a difference between the two means the file changed
          # after it was written — and that is worth seeing before the wipe.
          if [ -f "{{.snapshot}}{{._CL_SNAPSHOT_INFO}}" ]; then
            printf '%s\n' "{{._RUN}} cluster · etcd:restore · recorded when taken:"
            sed 's/^/    /' "{{.snapshot}}{{._CL_SNAPSHOT_INFO}}"
          else
            printf '%s\n' "{{._WARN}} cluster · etcd:restore · no {{._CL_SNAPSHOT_INFO}} beside it, so there is nothing to compare against"
          fi

          {{._CL_CONTROL_PLANE}}

          count="$(printf '%s\n' "$nodes" | awk 'END {print NR}')"
          printf '%s\n' "{{._RUN}} cluster · etcd:restore · ${count} control-plane node(s) to wipe"

          # --endpoints as well as --nodes, and that pair is the whole fix.
          #
          # With --nodes alone, talosctl connects to the endpoint in
          # talosconfig and asks IT to proxy to the node — and nodes reach each
          # other over the private network, so a peer's PUBLIC address is not a
          # path the endpoint can route to. Measured on three members: the
          # first reset returned `dial tcp <peer>:50000: i/o timeout` before
          # anything was wiped.
          #
          # It cannot be fixed by using private addresses either: this wipes
          # every control-plane node, so the endpoint is about to reboot and
          # proxying through it stops working halfway. Each node has to be
          # talked to directly.
          #
          # Invisible with one control-plane node, because that node IS the
          # endpoint — which is why the earlier single-node rehearsal passed
          # and this is what the three-member one found.
          # Wiped, then wiped AGAIN for whatever came back joined. One pass
          # is not enough, and that is the second thing the three-member
          # rehearsal found.
          #
          # A node whose EPHEMERAL is wiped does not land in Preparing while
          # other members are still alive with data: on reboot its etcd
          # starts, rejoins them, and syncs. Once the rest are wiped too and
          # quorum is gone, it sits in Running with `etcdserver: no leader` —
          # which the old `until … Preparing` loop waited for until its
          # deadline and then failed, with the cluster already down.
          #
          # Measured on three members: two of the three needed a second reset
          # before any of them reached Preparing, and only then did
          # `bootstrap --recover-from` work, first try.
          #
          # Invisible with one control-plane node, which is what the earlier
          # single-node rehearsal proved: with nothing else alive, one reset
          # lands in Preparing every time.
          deadline=$(( $(date +%s) + {{._CL_RECOVER_TIMEOUT}} ))
          attempt=0

          while :; do
            attempt=$(( attempt + 1 ))
            pending=""

            for node in $nodes; do
              state="$(talosctl --endpoints "$node" --nodes "$node" service etcd 2>/dev/null |
                awk '/^STATE/ {print $2}')"
              [ "$state" = "Preparing" ] && continue
              pending="${pending} ${node}"
            done

            [ -n "$pending" ] || break

            if [ "$(date +%s)" -ge "$deadline" ]; then
              printf '%s\n' "{{._ERR}} cluster · etcd:restore · not every node reached Preparing in {{._CL_RECOVER_TIMEOUT}}s:${pending}" >&2
              printf '%s\n' "{{._ERR}} cluster · etcd:restore · look at one with: task hcloud:console stack={{._CL_STACK}} server=<name>" >&2
              exit 1
            fi

            for node in $pending; do
              # Unreachable means it is still rebooting from the last reset,
              # and resetting a node mid-reboot is how one gets wedged. Skip
              # it; the next pass will find it either Preparing or joined.
              if ! talosctl --endpoints "$node" --nodes "$node" version --client=false >/dev/null 2>&1; then
                continue
              fi

              printf '%s\n' "{{._RUN}} cluster · etcd:restore · ${node} → wiping EPHEMERAL (pass ${attempt})"
              talosctl --endpoints "$node" --nodes "$node" \
                reset --graceful=false --reboot --system-labels-to-wipe=EPHEMERAL || true
            done

            sleep 10
          done

          # One node, from the local file. The others rejoin on their own once
          # the control-plane endpoint answers.
          first="$(printf '%s\n' "$nodes" | awk 'NR == 1')"
          printf '%s\n' "{{._RUN}} cluster · etcd:restore · ${first} → bootstrap from {{.snapshot}}"
          talosctl --endpoints "$first" --nodes "$first" \
            bootstrap --recover-from="{{.snapshot}}"

          printf '\n'
          printf '%s\n' "{{._OK}} cluster · etcd:restore · restored — the node passes through NotReady for about two minutes"
          printf '%s\n' "{{._OK}} cluster · etcd:restore · watch it with: task cluster:status stack={{._CL_STACK}}"
          printf '%s\n' "{{._WARN}} cluster · etcd:restore · anything created after the snapshot is gone; re-apply the layers if that includes them"

  etcd:upload:
    desc: "Upload an etcd snapshot to the Storage Box with restic (snapshot=<path>, default the newest in .backups/)"
    # restic does the work: it uploads, deduplicates, encrypts, keeps the last
    # N and verifies what is there. Nothing here implements any of that.
    #
    # rclone is the transport because of a hard constraint, not a preference:
    # restic's own sftp backend shells out to `ssh` and supports key
    # authentication only, while the box's credential is a generated password.
    # The alternative was a key, and hcloud injects those at the BOX level
    # where changing one replaces the Storage Box — a rotation that destroys
    # the backup destination, which delete protection would then refuse
    # halfway. So: rclone speaks SFTP with a password, restic speaks restic.
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: command -v restic >/dev/null
        msg: "restic not installed — brew bundle, or brew install restic"
      - sh: command -v rclone >/dev/null
        msg: |
          rclone not installed — brew bundle, or brew install rclone.

          It is the transport, not a second backup tool: restic's sftp backend
          speaks key authentication only, and the box's credential is a
          password.
      - sh: command -v jq >/dev/null
        msg: "jq not installed — brew bundle, or brew install jq"
    cmds:
      - cmd: |
          set -euo pipefail

          # The newest snapshot by default, because the reason to run this is
          # the one just taken. `ls -t` rather than a sorted glob: the names
          # carry a UTC stamp, but mtime is what survives a copy.
          snapshot="{{.snapshot}}"
          if [ -z "$snapshot" ]; then
            # shellcheck disable=SC2012 # ls -t orders by mtime; find -printf is GNU-only and this runs on macOS
            snapshot="$(ls -t "{{.ROOT}}"/.backups/*.db 2>/dev/null | awk 'NR == 1')"
          fi

          if [ -z "$snapshot" ] || [ ! -f "$snapshot" ]; then
            printf '%s\n' "{{._ERR}} cluster · etcd:upload · no snapshot to upload"
            printf '\n'
            printf '%s\n' "    task cluster:etcd:snapshot stack={{._CL_STACK}}"
            printf '\n'
            printf '%s\n' "writes one into .backups/; pass snapshot=<path> for a particular file."
            exit 1
          fi

          # The sidecar travels with it — it is the only record that the bytes
          # were read back as an etcd database. A warning rather than a
          # refusal: a recovery point with no note beside it is still a
          # recovery point, and declining to upload one is the worse failure.
          #
          # The pair is carried in the positional parameters rather than one
          # space-separated string: ROOT comes from `pwd`, so a checkout under
          # a path with a space would split into two filenames that do not
          # exist, and restic would back up neither.
          sidecar="${snapshot}{{._CL_SNAPSHOT_INFO}}"
          if [ -f "$sidecar" ]; then
            set -- "$snapshot" "$sidecar"
          else
            set -- "$snapshot"
            printf '%s\n' "{{._WARN}} cluster · etcd:upload · no {{._CL_SNAPSHOT_INFO}} beside it, so nothing records that it was read back"
          fi

          # The destination comes from the layer that created it. Reading the
          # stack rather than taking a host= argument is the point: the box,
          # both passwords and the path are generated, and nothing about them
          # is ever typed.
          #
          # A failure here is not fatal on its own: a stack that was never
          # created fails exactly like one that was never applied, and the
          # guidance below is the same for both. Pulumi's own stderr still
          # reaches the terminal, so a real cause — no credentials, no network
          # — is not swallowed on the way to that guidance.
          if ! outputs="$( cd "{{._CL_BACKUP_DIR}}" && \
            pulumi --non-interactive --stack "{{._CL_STACK}}" stack output --json --show-secrets )"; then
            outputs=""
          fi

          # `// ""` covers a missing key; the `|| true` covers no document at
          # all, which is what the branch above leaves behind.
          host="$(jq -r '.{{._CL_BACKUP_OUT_HOST}} // ""' <<<"$outputs" || true)"
          user="$(jq -r '.{{._CL_BACKUP_OUT_USER}} // ""' <<<"$outputs" || true)"
          pass="$(jq -r '.{{._CL_BACKUP_OUT_PASS}} // ""' <<<"$outputs" || true)"
          home="$(jq -r '.{{._CL_BACKUP_OUT_DIR}} // ""' <<<"$outputs" || true)"
          repo_pass="$(jq -r '.{{._CL_BACKUP_OUT_REPO_PASS}} // ""' <<<"$outputs" || true)"

          # One check for all five, naming one command. A missing output means
          # the layer was never applied, or was applied before it published
          # this — and the partial cases differ only in which credential is
          # empty, which is not a distinction worth five messages.
          if [ -z "$host" ] || [ -z "$user" ] || [ -z "$pass" ] || [ -z "$home" ] || [ -z "$repo_pass" ]; then
            printf '%s\n' "{{._ERR}} cluster · etcd:upload · stack {{._CL_STACK}} of 60-backup does not publish a destination"
            printf '\n'
            printf '%s\n' "    task platform:apply layer=60-backup stack={{._CL_STACK}}"
            printf '\n'
            printf '%s\n' "creates the Storage Box and generates its credentials."
            exit 1
          fi

          # Host key. ssh-keygen -F answers whether this host is already
          # trusted; nothing is added without trust_host_key=yes.
          if ! ssh-keygen -F "[${host}]:{{._CL_BACKUP_PORT}}" -f "{{._CL_BACKUP_KNOWN_HOSTS}}" >/dev/null 2>&1; then
            if [ "{{.trust_host_key}}" != "yes" ]; then
              printf '%s\n' "{{._ERR}} cluster · etcd:upload · ${host} is not in {{._CL_BACKUP_KNOWN_HOSTS}}"
              printf '\n'
              printf '%s\n' "    task cluster:etcd:upload stack={{._CL_STACK}} trust_host_key=yes"
              printf '\n'
              printf '%s\n' "reads the key with ssh-keyscan and prints its fingerprints, which you can"
              printf '%s\n' "compare against the ones the Hetzner console shows for the box. Until then"
              printf '%s\n' "this refuses to connect rather than trusting whatever answers on port {{._CL_BACKUP_PORT}}."
              exit 1
            fi

            printf '%s\n' "{{._RUN}} cluster · etcd:upload · ${host} → reading the host key"
            mkdir -p "$(dirname "{{._CL_BACKUP_KNOWN_HOSTS}}")"
            ssh-keyscan -p "{{._CL_BACKUP_PORT}}" "$host" 2>/dev/null >> "{{._CL_BACKUP_KNOWN_HOSTS}}"

            if ! ssh-keygen -F "[${host}]:{{._CL_BACKUP_PORT}}" -f "{{._CL_BACKUP_KNOWN_HOSTS}}" >/dev/null 2>&1; then
              printf '%s\n' "{{._ERR}} cluster · etcd:upload · ssh-keyscan got no key from ${host}:{{._CL_BACKUP_PORT}}"
              exit 1
            fi

            printf '%s\n' "{{._WARN}} cluster · etcd:upload · trusted on first use — compare these with the Hetzner console:"
            # -l prints a `# Host … found: line N` before each key; the
            # fingerprint is the part an operator compares.
            ssh-keygen -F "[${host}]:{{._CL_BACKUP_PORT}}" -f "{{._CL_BACKUP_KNOWN_HOSTS}}" -l \
              | awk '!/^#/ { print "    " $0 }'
          fi

          # The rclone remote, defined entirely in this environment. Uppercase
          # for the variable names, derived from the one spelling of the remote
          # so the two cannot drift.
          remote="{{._CL_BACKUP_REMOTE}}"
          prefix="RCLONE_CONFIG_$(printf '%s' "$remote" | awk '{print toupper($0)}')"

          export "${prefix}_TYPE=sftp"
          export "${prefix}_HOST=${host}"
          export "${prefix}_USER=${user}"
          export "${prefix}_PORT={{._CL_BACKUP_PORT}}"
          # Obscured through stdin, not an argument: rclone requires the
          # obscured form, and an argument would put the box's password in the
          # process list for every other user on this machine to read.
          export "${prefix}_PASS=$(printf '%s\n' "$pass" | rclone obscure -)"
          export "${prefix}_KNOWN_HOSTS_FILE={{._CL_BACKUP_KNOWN_HOSTS}}"

          export RESTIC_REPOSITORY="rclone:${remote}:${home}/{{._CL_BACKUP_REPO_DIR}}"
          export RESTIC_PASSWORD="$repo_pass"

          # restic groups snapshots by host, and the default is whatever this
          # machine is called — so two operators uploading the same cluster's
          # snapshots would produce two groups, and --keep-last would keep the
          # last N of each. The cluster is the thing being backed up, so it is
          # the host.
          cluster="$(go run "{{.ROOT}}/tools/topology" get cluster-name "{{._CL_TOPOLOGY}}")"

          # `cat config` is how you ask whether a repository is there without
          # init refusing one that already exists.
          if ! restic cat config >/dev/null 2>&1; then
            printf '%s\n' "{{._RUN}} cluster · etcd:upload · initialising the restic repository"
            restic init
          fi

          printf '%s\n' "{{._RUN}} cluster · etcd:upload · ${snapshot} → ${host}:${home}/{{._CL_BACKUP_REPO_DIR}}"
          # "$@" is the snapshot and, when it exists, its sidecar — set above.
          restic backup --host "$cluster" --tag etcd "$@"

          # Scoped to this cluster's etcd snapshots. An unscoped forget in a
          # repository that later holds something else would apply this
          # cluster's retention to it.
          #
          # --group-by host,tags is load-bearing, not tidiness. The default is
          # host,PATHS, and every etcd snapshot has a new filename — so each
          # upload lands in a group of its own, `--keep-last 10` keeps the
          # latest 10 OF EACH, and nothing is ever removed. Measured: three
          # uploads under the default, `keep 1 snapshots` printed three times
          # and three snapshots left. Grouping by tag makes them one series.
          restic forget --host "$cluster" --tag etcd --group-by host,tags \
            --keep-last "{{._CL_BACKUP_KEEP}}" --prune

          # The structure, every run. Cheap on a repository of this size, and
          # it is the difference between having uploads and having backups.
          restic check

          printf '\n'
          restic snapshots --host "$cluster" --tag etcd --latest 3
          printf '\n'
          printf '%s\n' "{{._OK}} cluster · etcd:upload · uploaded, keeping the last {{._CL_BACKUP_KEEP}}"

  upgrade:talos:
    desc: "Upgrade Talos on every node. Bump talos.version in the topology first, then re-bake."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [talosconfig]
    prompt: "Upgrade Talos on every node of {{._CL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail

          # Every topology, not one: a single bin/talosctl validates all of
          # them, so they have to agree on the version. Disagreeing is worth
          # saying out loud rather than installing whichever came first and
          # leaving machine-config:check to fail against the other.
          # Space-separated on purpose: a version token holds no spaces, so
          # word splitting is the whole parser needed here.
          versions=""
          for topology in "{{.ROOT}}"/infra/cluster/cluster.*.yaml; do
            [ -f "$topology" ] || continue
            versions="${versions} $(go run "{{.ROOT}}/tools/topology" get talos-version "$topology")"
          done

          # shellcheck disable=SC2086 # splitting is intended
          distinct="$(printf '%s\n' ${versions} | awk 'NF' | sort -u)"
          count="$(printf '%s' "${distinct}" | awk 'NF {n++} END {print n + 0}')"

          if [ "${count}" -eq 0 ]; then
            printf '%s\n' "{{._ERR}} cluster · talosctl · no topology in infra/cluster names a Talos version" >&2
            exit 1
          fi

          if [ "${count}" -gt 1 ]; then
            printf '%s\n' "{{._ERR}} cluster · talosctl · topologies disagree on talos.version: $(printf '%s' "${distinct}" | tr '\n' ' ')" >&2
            printf '%s\n' "{{._ERR}} cluster · talosctl · one binary validates them all, so pin one version" >&2
            exit 1
          fi

          version="${distinct}"
          export TALOSCONFIG="{{.ROOT}}/talosconfig"
          # One node at a time, waiting for each: rolling through the control
          # plane in parallel takes etcd below quorum.
          for node in $(talosctl get members -o json | jq -r '.spec.addresses[0]'); do
            printf '%s\n' "{{._RUN}} cluster · upgrade · ${node} → ${version}"
            # --endpoints as well, for the reason etcd:restore carries at
            # length: `talosctl get members` reports each member's PUBLIC
            # address, and --nodes alone makes talosctl proxy through the
            # endpoint in talosconfig, which cannot route to a peer's public
            # address. Measured there as `dial tcp <peer>:50000: i/o timeout`.
            #
            # Unlike the restore, this one has not been run end to end: a
            # Talos upgrade is blocked on the machine config that 1.14
            # rejects, which docs/BACKLOG.md records. The mechanism is the
            # same and the addresses are the same kind.
            talosctl --endpoints "${node}" --nodes "${node}" \
              upgrade --image "ghcr.io/siderolabs/installer:${version}" --wait
          done

  upgrade:k8s:
    desc: "Upgrade Kubernetes in place. Set kubernetes.version in the topology first."
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    deps: [talosconfig]
    prompt: "Upgrade Kubernetes on {{._CL_STACK}}?"
    cmds:
      - cmd: |
          set -euo pipefail
          version="$(go run "{{.ROOT}}/tools/topology" get kubernetes-version "{{._CL_TOPOLOGY}}")"
          export TALOSCONFIG="{{.ROOT}}/talosconfig"
          talosctl upgrade-k8s --to "${version}"
