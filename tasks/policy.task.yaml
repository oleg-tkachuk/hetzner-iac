# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# CrossGuard over every Pulumi program in the repository.
#
# Its own namespace rather than an addition to `security:*`, because that
# namespace comes wholesale from the shared taskfiles library. Wrapping the
# library include to slip one task in would rename every task in it, and the
# repo's own gates validate those names.

# Two static copies of lists that live in Taskfile.yaml, for the reason
# platform.task.yaml's own anchor records: requires.enum is static schema, so a
# template in it is read as a YAML map and the file stops parsing. One copy
# each, aliased rather than repeated per task, held equal to LAYERS and TIERS
# by TestPolicyAnchors_MatchTheRootLists.
#
# No `all` in either: `policy:check` is what covers everything, and a selector
# word here would be a second spelling of it.
x-layers: &layers [10-node-platform, 20-network-policy, 30-cluster-services, 40-ingress, 50-gitops]
x-tiers: &tiers [cluster, backup]

silent: true

vars:
  _PO_STACK: '{{.stack}}'
  _PO_PACK: '{{.ROOT}}/policy'
  # Every program CrossGuard has something to say about: the cluster tier
  # declares the firewall and the servers, the layers declare the Helm
  # releases. A second form of the layer list is avoided by reading the one in
  # Taskfile.yaml.
  _PO_LAYERS: '{{.LAYERS}}'
  _PO_TIERS: '{{.TIERS}}'

tasks:
  check:
    desc: "Run the policy pack over every tier and every layer; changes nothing"
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
      - sh: test -f "{{._PO_PACK}}/PulumiPolicy.yaml"
        msg: "no policy pack at {{._PO_PACK}}"
    cmds:
      - cmd: |
          set -euo pipefail

          # --policy-pack takes a path, and preview runs from the program's own
          # directory, so the path has to be absolute. ROOT is already that.
          for tier in {{._PO_TIERS}}; do
            printf '%s\n' "{{._RUN}} policy · ${tier} · preview"
            ( cd "{{.ROOT}}/infra/${tier}" && \
              pulumi --non-interactive --stack "{{._PO_STACK}}" preview \
                --policy-pack "{{._PO_PACK}}" )
          done

          for layer in {{._PO_LAYERS}}; do
            printf '%s\n' "{{._RUN}} policy · ${layer} · preview"
            ( cd "{{.ROOT}}/layers/${layer}" && \
              pulumi --non-interactive --stack "{{._PO_STACK}}" preview \
                --policy-pack "{{._PO_PACK}}" )
          done

          printf '%s\n' "{{._OK}} policy · all · no violations"

  # `policy:tier` replaces `policy:cluster`, which could only ever mean one
  # tier. One verb per action, the same argument `destroy` makes against a
  # second name for itself — and the backup tier had no narrowing at all.
  tier:
    desc: "Run the policy pack over one tier — task policy:tier stack=dev tier=backup"
    requires:
      vars:
        - name: tier
          enum: *tiers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/infra/{{.tier}}"
          pulumi --non-interactive --stack "{{._PO_STACK}}" preview \
            --policy-pack "{{._PO_PACK}}"

  layer:
    desc: "Run the policy pack over one layer — task policy:layer stack=dev layer=40-ingress"
    requires:
      vars:
        - name: layer
          enum: *layers
    preconditions:
      - sh: '[ -n "{{.stack}}" ]'
        msg: "{{._STACK_LAYER_USAGE}}"
    cmds:
      - cmd: |
          set -euo pipefail
          cd "{{.ROOT}}/layers/{{.layer}}"
          pulumi --non-interactive --stack "{{._PO_STACK}}" preview \
            --policy-pack "{{._PO_PACK}}"
