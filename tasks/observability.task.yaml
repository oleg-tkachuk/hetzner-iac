version: "3"

silent: true

tasks:
  check:
    desc: "Validate the Alloy collector config against the Alloy the chart deploys"
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "docker is not running — Alloy is validated from its container image, so there is nothing to run the check with"
    cmds:
      # Alloy's failure mode is the worst kind for a log collector: the
      # DaemonSet starts, crash-loops, and logs stop arriving without anything
      # else going red. This catches a syntax error, a reference to an
      # undeclared component, or an unknown component type — offline.
      - go run {{.ROOT}}/tools/alloyvalidate
