# The External Secrets Operator reaching Pulumi ESC.
#
# Written with the store rather than after it, and that ordering is the whole
# point: this flow only happens when a secret is read, so it is absent from any
# capture of a cluster at rest — the same way the Hetzner API flow in
# 60-allow-hcloud-api.yaml was absent from two captures an hour apart and
# appeared the moment a volume was asked for. Under the default deny, without
# this, every ExternalSecret stops syncing and the pod that mounts the Secret
# reports CreateContainerConfigError, which names a Secret and says nothing
# about a blocked connection.
#
# Only the controller, not the webhook or the cert-controller: those two serve
# admission and certificates inside the cluster and call nothing outside it.
# The name is the chart's own — `app.kubernetes.io/name: external-secrets`
# selects the controller alone, read off the running Deployment's selector.
#
# toFQDNs rather than an address, for the reason 50-allow-acme.yaml gives at
# length: an IP written into a policy is a policy that works until the vendor
# renumbers. api.pulumi.com is the default; a self-hosted Pulumi API means
# changing this name beside the store's apiUrl.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-secrets
spec:
  description: the External Secrets Operator reads secrets from Pulumi ESC
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: external-secrets
      k8s:app.kubernetes.io/name: external-secrets
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toFQDNs:
        - matchName: api.pulumi.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
