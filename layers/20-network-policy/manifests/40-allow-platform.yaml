# The pod-to-pod flows this platform actually has, from Hubble rather than
# from imagination:
#
#   argocd/argocd-server <-> argocd/argocd-redis TCP/6379   24 events
#
# RETIRED, and the measurement kept: Loki.
#
#   observability/loki  -> observability/loki   TCP/3100   480 events
#   observability/alloy -> observability/loki   TCP/8080     8
#
# Loki talked to itself because the chart runs a gateway in front of the single
# binary, and both carry app.kubernetes.io/name=loki; Alloy reached the gateway
# on 8080. Those two rules, on endpoints in the `observability` namespace
# selected by `app.kubernetes.io/name`, are the whole policy that was here.
#
# It was kept for a while on the argument that it describes traffic rather than
# who installs it, so deleting it would mean re-measuring before the default
# deny could go on. Both halves of that have since changed. The deny IS on, and
# it went on without this policy mattering — the workload it selects has not
# existed for weeks, so it permitted nothing and could permit nothing. And the
# re-measuring it was meant to save is four lines above: a rule that selects no
# endpoint is not a safeguard, it is a claim about a cluster that does not
# exist, and this repository has spent a day learning what an unenforced claim
# costs.
#
# When observability returns through Argo CD, the numbers above are what to
# write it from — and it will need the client side of each flow as well, which
# the original never had.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-argocd-redis
spec:
  description: the Argo CD server and repo server reach their cache
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: argocd
      k8s:app.kubernetes.io/name: argocd-redis
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
