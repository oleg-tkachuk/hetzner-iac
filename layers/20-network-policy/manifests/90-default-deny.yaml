# The default-deny itself, and the only policy here that takes anything away.
#
# Separate from the allow rules on purpose. Every other file sets
# enableDefaultDeny to false, so it can be applied to a running cluster and
# only ever permits. This one flips every endpoint into deny mode, and from
# that moment anything the files above do not name is dropped.
#
# WHAT A REAL SWITCH-ON FOUND, because this was turned on against the live dev
# cluster and turned back off twice.
#
# The allow set was written from Hubble captures, and a capture shows one side
# of a flow: the side that appeared. A default deny enforces BOTH directions,
# so five permissions were half-written, and each cost something that did not
# look like policy —
#
#   - metrics-server had no egress to the kubelet. `kubectl top` returns
#     nothing and a CPU autoscaler reads nothing, while metrics-server is
#     Ready. Fixed: 35-allow-kubelet-clients.
#   - Traefik had no ingress from the ingress load balancer, whose PRIVATE
#     address Cilium reports as `world` because a load balancer is not a
#     cluster node. Every target unhealthy, which reads as broken ingress.
#     Fixed: 45-allow-ingress-loadbalancer.
#   - Argo CD's server and controller had no egress to their cache; the policy
#     covered redis's ingress only. Fixed: 46-allow-argocd-cache-egress.
#   - Hubble Relay had no egress to the agents, so `task cluster:hubble` —
#     the tool for diagnosing this — was the first thing the deny broke.
#     Fixed: 47-allow-hubble-relay.
#   - CoreDNS had no ingress at all. It surfaced as a volume claim stuck
#     Pending with DeadlineExceeded, because the CSI controller resolves
#     api.hetzner.cloud first. Fixed: the second document in 10-allow-dns.
#
# STILL MISSING, measured with the deny on and written down rather than
# guessed. Both must be covered before this is enabled again:
#
#   - CoreDNS's own egress to the upstream resolver. Talos runs a host-local
#     resolver at 169.254.116.108:53, and CoreDNS forwards to it — 25 drops
#     per node in a two-minute window, which is every query for a name
#     outside the cluster.
#   - egress to kube-dns's ClusterIP, 10.96.0.10. The rule above permits the
#     kube-dns ENDPOINTS, and some clients — Argo CD's repo server among them
#     — are denied against the service address instead.
#
# Both are per-environment numbers: the service CIDR comes from the topology
# and the host resolver from Talos, so covering them is a template or an
# entity selector rather than a literal in this directory.
#
# The rule that stands: enable this with the flows in front of you, and expect
# the client side of every permission the capture only showed the server of.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  description: everything not named by another policy is dropped
  endpointSelector: {}
  # enableDefaultDeny is what flips the mode. The rule sections are what makes
  # the policy exist at all, and their SHAPE is the part this got wrong twice.
  #
  # `ingress: []` was rejected by the API server — `spec.ingress: Required
  # value` — which is how the fields came to be written out. Then `ingress: []`
  # WITH the field present was accepted by the API server and rejected by
  # Cilium, in a status nothing reads:
  #
  #   Valid=False  rule must have at least one of Ingress, IngressDeny,
  #                Egress, EgressDeny
  #
  # So the apply reported success, the object existed, every flow kept the
  # verdict `policy-verdict:none`, and the cluster was not under deny at all.
  #
  # An empty LIST OF SELECTORS is the shape that works: the section exists, so
  # the endpoint is in enforcement mode, and it permits nobody, so only the
  # allow policies above permit anything. Measured on this cluster with a pod
  # in a scratch namespace — a covered flow reported
  # `policy-verdict:L3-L4 EGRESS ALLOWED` and an uncovered one
  # `policy-verdict:none EGRESS DENIED … Policy denied DROPPED`.
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints: []
  egress:
    - toEndpoints: []
