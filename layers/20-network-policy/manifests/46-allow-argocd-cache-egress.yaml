# Argo CD's server and controller reaching their cache, from the CLIENT side.
#
# 40-allow-platform already permits this flow — but only its INGRESS half: it
# selects the redis pod and allows connections from the argocd namespace. Under
# the default deny both directions are enforced, so the clients need their own
# egress rule, and without it:
#
#   argocd/argo-cd-argocd-server-…      <> argocd/…-redis:6379 EGRESS DENIED
#   argocd/argo-cd-argocd-application-controller-0 <> …:6379   EGRESS DENIED
#
# Twenty-one drops in two minutes, which is the reconnect loop. What it costs:
# the server serves the UI from an empty cache and the application controller
# cannot hold its state — so Argo CD looks installed and reconciles nothing,
# which is indistinguishable from the state it is in today for a different
# reason.
#
# The repo server is the same shape and was the next gap. The chart's own
# NetworkPolicy lets it accept connections from the server and the controllers;
# nothing let them open one. It did not show in the drops only because this
# Argo CD reconciles nothing yet, so nobody asked it to render — the first
# Application would have timed out on the rpc to it, which reads as a broken
# repository. 8081 is repoServer.containerPorts.server in the pinned chart.
#
# The general lesson is in the drops rather than in this file: the allow set
# was written from captures, and a capture shows a server's ingress while the
# client's egress needs its own rule. Three of the four gaps the deny exposed
# were exactly this shape.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-argocd-cache-egress
spec:
  description: the Argo CD server and controllers reach their cache and the repo server
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: argocd
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/name: argocd-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/name: argocd-repo-server
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
