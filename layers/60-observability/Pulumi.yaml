name: observability
runtime:
  name: go
  options:
    # Stable build path so repeated previews skip the link step; content
    # hashing still rebuilds when sources change.
    buildTarget: ../../.cache/pulumi-bin/observability
description: |
  Observability: Prometheus, Grafana, Loki, Tempo and Alloy.

  Alloy is the collector rather than Promtail, which is deprecated upstream.

# State backend. Declared here rather than left to `pulumi login`, so the
# backend is a property of the repository and not of whoever runs it.
#
# Pulumi Cloud is the default: it coordinates concurrent updates, keeps update
# history, and manages the secrets encryption key, none of which a DIY backend
# does for you.
#
# To keep state at Hetzner instead — one vendor, data in the EU — override the
# URL and nothing else changes:
#
#   export PULUMI_BACKEND_URL='s3://<bucket>?endpoint=fsn1.your-objectstorage.com&s3ForcePathStyle=true&region=fsn1'
#   export AWS_ACCESS_KEY_ID=...      # the Object Storage credentials
#   export AWS_SECRET_ACCESS_KEY=...
#   export PULUMI_CONFIG_PASSPHRASE=... # a DIY backend encrypts secrets with this
#
# The bucket has to exist first: a bucket managed by the state it holds cannot
# create itself.
backend:
  url: https://api.pulumi.com

config:
  observability:clusterStackRef:
    description: |
      Fully qualified stack of the cluster tier — <org>/hetzner-cluster/<stack>.
      This layer reads the kubeconfig from it, which is what lets it be applied
      and destroyed without touching the cluster.
  observability:objectStorageStackRef:
    description: |
      Fully qualified stack of the object-storage tier —
      <org>/object-storage/<stack>. Optional.

      Set, Loki and Tempo write to its bucket and keep only a WAL on disk.
      Unset, both stay on the persistent volumes they have always used — the
      layers are independently appliable, so this one must work with no
      object-storage stack at all.
  observability:objectStorageAccessKey:
    description: |
      S3 access key for that bucket. Required when objectStorageStackRef is
      set. Read here rather than from the other stack's outputs: a stack that
      exports a credential puts it into the state of every stack referencing
      it.
    secret: true
  observability:objectStorageSecretKey:
    description: |
      S3 secret key, matching objectStorageAccessKey.
    secret: true
  observability:logsRetention:
    description: |
      How long Loki keeps logs. Defaults to 720h.

      Only takes effect with a bucket, where it is what bounds growth — a
      persistent volume bounds itself by filling up, and object storage does
      not bound itself at all.
