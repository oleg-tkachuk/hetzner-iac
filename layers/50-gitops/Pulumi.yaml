name: gitops
runtime:
  name: go
  options:
    # Stable build path so repeated previews skip the link step; content
    # hashing still rebuilds when sources change.
    buildTarget: ../../.cache/pulumi-bin/gitops
description: |
  GitOps: Argo CD.

  Installed by Pulumi, not by itself. What Argo CD then manages is application
  workloads — the platform layers below it stay with Pulumi, so a broken Argo
  CD is never able to take the platform down with it.

# State backend. Declared here rather than left to `pulumi login`, so the
# backend is a property of the repository and not of whoever runs it.
#
# Pulumi Cloud is the default: it coordinates concurrent updates, keeps update
# history, and manages the secrets encryption key, none of which a DIY backend
# does for you.
#
# To keep state in your own S3 bucket instead — one vendor, one bill — point
# this url at it. That also changes how stack secrets are encrypted — with a
# passphrase you hold rather than a key the backend holds: see
# docs/configuration.md, "Keeping state in your own S3 bucket".
backend:
  url: https://api.pulumi.com

config:
  gitops:repoURL:
    default: ""
    description: |
      The repository holding the workloads Argo CD reconciles. Unset leaves
      Argo CD installed and reconciling nothing, which is the right shape
      before that repository exists — it says so on every apply.

      This layer ships the mechanism, not the content: which repository is
      a deployment decision, not a property of this one. A private repository
      needs a credential as well — the three repo* keys below.
  # The credential for a private root repository, in one form or the other.
  # Empty is correct for a public repository and is what a clone starts with;
  # set for a private one, and the layer refuses the combinations Argo CD would
  # accept and then fail on — an SSH key against an https:// URL, half of a
  # username/password pair, or a credential with no repoURL to authenticate to.
  #
  # Always through --secret, so the value is encrypted in Pulumi.<stack>.yaml
  # rather than sitting in a committed file:
  #
  #   pulumi config set --secret gitops:repoSSHPrivateKey -- "$(cat deploy_key)"
  #   pulumi config set --secret gitops:repoUsername git
  #   pulumi config set --secret gitops:repoPassword <token>
  #
  # A deploy key gives Argo CD read access to one repository; a forge token
  # gives it whatever the token can reach, which is usually the whole account.
  gitops:repoUsername:
    default: ""
    description: |
      Username for an HTTPS repository. For a forge token this is any
      non-empty string — the token goes in repoPassword — and both halves have
      to be set or neither.
  gitops:repoPassword:
    default: ""
    description: |
      Password or token for an HTTPS repository. Set with --secret.
  gitops:repoSSHPrivateKey:
    default: ""
    description: |
      Private key for an ssh:// or git@host:path repository, in place of the
      username and password. A read-only deploy key is the least it needs.
      Set with --secret.
  gitops:path:
    default: ""
    description: |
      Path inside that repository where the tree of Applications starts.
      Empty means the repository root; the Go constant DefaultRootPath is the
      one place that fallback is written.
  gitops:revision:
    default: ""
    description: |
      Revision to track — a branch, a tag or a commit. Empty tracks the
      repository's default branch through HEAD, which works whether it is
      called main or develop.
  gitops:clusterStackRef:
    default: ""
    description: |
      Fully qualified stack of the cluster tier — <org>/hetzner-cluster/<stack>.
      This layer reads the kubeconfig from it, which is what lets it be applied
      and destroyed without touching the cluster.
