name: cluster-services
runtime:
  name: go
  options:
    # Stable build path so repeated previews skip the link step; content
    # hashing still rebuilds when sources change.
    buildTarget: ../../.cache/pulumi-bin/cluster-services
# Two groups: cluster services and ingress. Everything above assumes the first
# exists — ingress wants certificates, workloads want secrets, the horizontal
# pod autoscaler wants metrics.
#
# They were separate projects, layers/30-cluster-services and 40-ingress,
# merged as an experiment. main.go's package comment says what keeps them
# distinguishable in the state and what keeps them independent of each other.
#
# Kept short deliberately: this becomes the stack's `pulumi:description` TAG,
# and Pulumi Cloud refuses a tag over 256 characters — `pulumi stack init`
# fails, not `pulumi up`, so the failure lands on whoever creates the next
# environment rather than on whoever wrote the prose.
description: |
  Core platform and ingress: cert-manager, external-secrets, metrics-server,
  KEDA when asked for, Traefik and its load balancer.

# State backend. Declared here rather than left to `pulumi login`, so the
# backend is a property of the repository and not of whoever runs it.
#
# Pulumi Cloud is the default: it coordinates concurrent updates, keeps update
# history, and manages the secrets encryption key, none of which a DIY backend
# does for you.
#
# To keep state in your own S3 bucket instead — one vendor, one bill — point
# this url at it. That also changes how stack secrets are encrypted — with a
# passphrase you hold rather than a key the backend holds: see
# docs/configuration.md, "Keeping state in your own S3 bucket".
backend:
  url: https://api.pulumi.com

config:
  cluster-services:clusterStackRef:
    default: ""
    description: |
      Fully qualified stack of the cluster tier — <org>/hetzner-cluster/<stack>.
      This layer reads the kubeconfig from it, which is what lets it be applied
      and destroyed without touching the cluster.

  cluster-services:acmeEmail:
    default: ""
    description: |
      Contact address for the Let's Encrypt account. Empty creates no
      ClusterIssuer, and the layer says so on every apply — installing
      cert-manager with no issuer leaves every Certificate pending with
      nothing to satisfy it.

  cluster-services:loadBalancerType:
    default: "lb11"
    description: |
      Hetzner load balancer type for the ingress group. lb11 carries an ingress
      comfortably; the reason to change it is throughput, not availability.

      This was `ingress:loadBalancerType` while ingress was its own project. A
      Pulumi config key is namespaced by the project, so the merge renamed it —
      a stack that had the old key set has to have it set again here.

  cluster-services:kedaEnabled:
    default: "false"
    description: |
      Install KEDA, the event-driven autoscaler. Off by default because it is
      not free: three Deployments asking for 300m CPU and 300Mi between them,
      and an aggregated API group — external.metrics.k8s.io — that the API
      server then depends on.

      It scales PODS, not nodes. The worker pools are pinned in the committed
      topology and nothing here adds to them, so scaling past their capacity
      leaves pods Pending. What it buys on a fixed cluster is scale-to-zero and
      bursts inside capacity that is already paid for.

      The ScaledObjects themselves belong with the workloads they scale, in
      Argo CD. This installs the controller and its CRDs, which is the half
      that has to exist before any of them applies.

  cluster-services:acmeStaging:
    default: "false"
    description: |
      Order certificates from Let's Encrypt's staging endpoint. They are NOT
      trusted by a browser, so this is not a safer default — it is where the
      first attempt at a new domain belongs, because production rate-limits
      per registered domain and an order that cannot be validated still
      counts against them. The account key is separate per endpoint: an ACME
      account is registered with one directory.
