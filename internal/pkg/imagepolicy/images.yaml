# Every image repository the platform's charts run, and how its provenance is
# established. tools/charts fails on a rendered image with no entry here and on
# an entry no chart renders.
#
# Each signer was found by verifying the pinned release with cosign and then
# tightening the identity until it still verified: a release workflow on a tag
# where the publisher signs from one. Unsigned means no signature exists for
# the repository at all — not one that failed to verify — and those are pinned
# by digest instead: the tag the chart renders by default, and the index digest
# `crane digest <repository>:<tag>` returned for it. A chart upgrade that moves
# the tag fails tools/charts until the digest is moved with it.

images:
  # Argo CD and its two dependencies.
  - repository: quay.io/argoproj/argocd
    signed:
      issuer: &github https://token.actions.githubusercontent.com
      subjectRegExp: ^https://github\.com/argoproj/argo-cd/\.github/workflows/.+@refs/tags/.+$
  - repository: ghcr.io/dexidp/dex
    signed:
      issuer: *github
      subjectRegExp: ^https://github\.com/dexidp/dex/\.github/workflows/.+@refs/tags/.+$
  - repository: ecr-public.aws.com/docker/library/redis
    unsigned:
      reason: Docker Official Images publish no cosign signature.
      tag: 8.6.4-alpine
      digest: sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763

  # cert-manager signs with a key in Google Cloud KMS, over sha512, and does
  # not record its signatures in Rekor — https://cert-manager.io/docs/installation/code-signing/
  - repository: quay.io/jetstack/cert-manager-cainjector
    signed: &cert-manager
      key: cert-manager.pem
      hashAlgorithm: sha512
      noTransparencyLog: true
  - repository: quay.io/jetstack/cert-manager-controller
    signed: *cert-manager
  # The post-install hook Job that waits for the webhook to answer.
  - repository: quay.io/jetstack/cert-manager-startupapicheck
    signed: *cert-manager
  - repository: quay.io/jetstack/cert-manager-webhook
    signed: *cert-manager

  # Cilium. Envoy is built from cilium/proxy and signed from a branch, so its
  # identity cannot be held to a tag. Hubble UI is not signed.
  - repository: quay.io/cilium/cilium
    signed: &cilium
      issuer: *github
      subjectRegExp: ^https://github\.com/cilium/cilium/\.github/workflows/.+@refs/tags/.+$
  - repository: quay.io/cilium/hubble-relay
    signed: *cilium
  - repository: quay.io/cilium/operator-generic
    signed: *cilium
  - repository: quay.io/cilium/cilium-envoy
    signed:
      issuer: *github
      subjectRegExp: ^https://github\.com/cilium/proxy/\.github/workflows/.+@.+$
  - repository: quay.io/cilium/hubble-ui
    unsigned:
      reason: Cilium signs no Hubble UI image.
      tag: v0.13.6
      digest: sha256:049a80a03585c043d0c3121bdc518c72b0fd42bae07e4bcce0fdb8f1e88041d0
  - repository: quay.io/cilium/hubble-ui-backend
    unsigned:
      reason: Cilium signs no Hubble UI image.
      tag: v0.13.6
      digest: sha256:83b3fc763f3d49948c306bf49b08277383e195904b9ca5c0c0022b2112628787

  - repository: ghcr.io/external-secrets/external-secrets
    signed:
      issuer: *github
      subject: https://github.com/external-secrets/external-secrets/.github/workflows/release.yml@refs/heads/main

  # Hetzner signs neither driver.
  - repository: docker.io/hetznercloud/hcloud-cloud-controller-manager
    unsigned:
      reason: Hetzner publishes no signature for the cloud controller manager.
      tag: v1.38.0
      digest: sha256:0ceeacefbecbc4e149f0fb740b48518c8eeff077557b730ae615b4f7a7b1c669
  - repository: docker.io/hetznercloud/hcloud-csi-driver
    unsigned:
      reason: Hetzner publishes no signature for the CSI driver.
      tag: v2.23.0
      digest: sha256:024ea4b07161b2f2cb27449be60de8cf942ac80424d1d213696db237cdf7f7f4

  - repository: ghcr.io/kedacore/keda
    signed: &keda
      issuer: *github
      subjectRegExp: ^https://github\.com/kedacore/keda/\.github/workflows/.+@refs/tags/.+$
  - repository: ghcr.io/kedacore/keda-admission-webhooks
    signed: *keda
  - repository: ghcr.io/kedacore/keda-metrics-apiserver
    signed: *keda

  - repository: docker.io/library/traefik
    unsigned:
      reason: Traefik publishes no cosign signature.
      tag: v3.7.13
      digest: sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0

  # Sigstore's policy-controller, and the kubectl its uninstall hook runs.
  # Chainguard signs from a branch, so that identity cannot be held to a tag.
  - repository: ghcr.io/sigstore/policy-controller/policy-controller
    signed:
      issuer: *github
      subjectRegExp: ^https://github\.com/sigstore/policy-controller/\.github/workflows/.+@refs/tags/.+$
  - repository: cgr.dev/chainguard/kubectl
    signed:
      issuer: *github
      subject: https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main

  # Kubernetes' own images, signed by its release tooling.
  - repository: registry.k8s.io/metrics-server/metrics-server
    signed: &k8s-release
      issuer: https://accounts.google.com
      subject: krel-trust@k8s-releng-prod.iam.gserviceaccount.com
  - repository: registry.k8s.io/sig-storage/csi-attacher
    signed: *k8s-release
  - repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    signed: *k8s-release
  - repository: registry.k8s.io/sig-storage/csi-provisioner
    signed: *k8s-release
  - repository: registry.k8s.io/sig-storage/csi-resizer
    signed: *k8s-release
  - repository: registry.k8s.io/sig-storage/livenessprobe
    signed: *k8s-release
