name: hetzner-cluster
runtime:
  name: go
  options:
    # Compile to a stable path instead of Pulumi's default throwaway temp file.
    #
    # Without this the language host runs `go build -o $TMPFILE` on every
    # invocation and deletes the result, so each preview pays a full link of a
    # large binary. A stable path lets `go build` compare against the existing
    # output and no-op when nothing changed. The staleness check is content
    # hashing, so an edited package still rebuilds — which is why this is
    # `buildTarget` and not `binary`; `binary` skips the build entirely and
    # silently deploys whatever was compiled last.
    buildTarget: ../../.cache/pulumi-bin/hetzner-cluster
# Runs before every layer under layers/ and exports the kubeconfig they
# consume through a StackReference. Nothing here is managed — Hetzner has no
# managed Kubernetes, so this project builds the cluster. It stops at "a
# Kubernetes API that answers": the CNI comes from layers/10-node-platform.
#
# Kept as a comment rather than folded into `description` below, which becomes
# the `pulumi:description` stack tag and is refused by Pulumi Cloud over 256
# characters — `pulumi stack init` fails outright, not the deploy.
description: |
  Hetzner Cloud cluster tier: private network, perimeter firewall, Talos
  control plane and worker pools.

# State backend. Declared here rather than left to `pulumi login`, so the
# backend is a property of the repository and not of whoever runs it.
#
# Pulumi Cloud is the default: it coordinates concurrent updates, keeps update
# history, and manages the secrets encryption key, none of which a DIY backend
# does for you.
#
# To keep state in your own S3 bucket instead — one vendor, data in the EU —
# point this url at it. That also changes how stack secrets are encrypted,
# which changes whether Pulumi.<stack>.yaml may be committed: see
# docs/configuration.md, "Keeping state in your own S3 bucket".
backend:
  url: https://api.pulumi.com

# The Hetzner token is NOT declared below, and cannot be. `config:` accepts
# defaults and descriptions only for keys in this project's own namespace; a
# key namespaced to another package — `hcloud:token` belongs to the provider —
# must carry a `value`, and a credential in a committed file is not a value.
#
# Declaring it anyway is not a style problem: it makes the project file fail to
# parse, and every pulumi command in this directory dies before it starts with
#
#   could not unmarshal Pulumi.yaml: Configuration key 'hcloud:token' is
#   namespaced and must provide an attribute 'value'
#
# Set it per stack instead:
#
#   pulumi config set --secret hcloud:token <token>
# No `config:` block. Everything that shapes a cluster is in
# cluster.<stack>.yaml, which is committed and reviewable; the Hetzner token is
# the only thing in stack config, and it is there because it must not be in
# git. `hcloud:token` cannot be declared here anyway — Pulumi refuses a config
# key namespaced to a provider package.
