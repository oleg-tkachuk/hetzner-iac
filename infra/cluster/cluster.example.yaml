# yaml-language-server: $schema=./cluster.schema.json
#
# The template. Copy it to cluster.<stack>.yaml — the file infra/cluster loads
# — and edit adminCIDRs. This one is committed and the stack files are not:
# adminCIDRs is an operator's own egress address, and this repository is
# public.
#
# The cost of that: CI has no topology, so it cannot preview the cluster tier.
# Check its drift by hand with `task cluster:plan stack=<stack>`.
#
#   cp cluster.example.yaml cluster.dev.yaml
#
# This IS the per-environment description of a cluster. Everything that shapes
# one is here and nowhere else: three switches used to live in `pulumi config`,
# which left somebody's shell history as the only record of them. Stack config
# now holds exactly one thing, the Hetzner token, because a token must not be
# in git.
#
# Sparse by design — anything omitted keeps the default in pkg/hetzner, so this
# file never restates a default and a default can change in one place. The
# modeline above gives an editor the field names, types and defaults;
# pkg/hetzner validates the same file at plan time and reports every problem at
# once, including the ones a schema cannot express.
apiVersion: hetzner-iac/v1
kind: Cluster

metadata:
  name: platform-dev
  # Public DNS name this environment is reached at. Absent until there is one,
  # which is the normal state of a new environment: 40-ingress then creates no
  # DNS records and 50-gitops no Ingress, and both say so on every apply.
  #
  # Two or more labels. A single one is a hostname, and Let's Encrypt refuses
  # an order for it — after the Ingress is already in place.
  #
  # domain: platform.example.com

placement:
  location: hel1
  # Derived from the location when omitted; stated here only because a
  # location change must be a deliberate two-line edit.
  networkZone: eu-central

network:
  # CIDRs allowed to reach tcp/6443 (kube-apiserver) and tcp/50000 (Talos API).
  #
  # MUST include the host running `task cluster:*` — Talos machine
  # configuration is applied over the Talos API from there, and a host outside
  # this list hangs on apply with the port filtered rather than failing.
  #
  # There is no default: an empty list is refused rather than widened to
  # 0.0.0.0/0. Replace the placeholder with your egress CIDR.
  adminCIDRs:
    - 203.0.113.4/32

  # Keep a routable address on every node. Defaults to TRUE, and stated here
  # because it decides which address Talos and the kubeconfig target: machine
  # configuration is pushed over the Talos API, so an apply from anywhere but
  # inside the private network needs one.
  publicIPv4: true

  # Open ping from adminCIDRs. Off unless something is being debugged.
  allowICMP: false

  # How pod traffic crosses nodes: native or tunnel. Default native.
  #
  # native sends a pod packet for another node to the private network's
  # gateway, which routes it by the per-node routes the hcloud CCM programmes.
  # No encapsulation, and packet captures a human can read. The cluster tier
  # puts the route to that gateway into every node's machine config — a node
  # has none of its own, because its private NIC is a /32 whose only on-link
  # peer is the gateway.
  #
  # tunnel wraps the packet in VXLAN between node addresses instead. It asks
  # nothing of the private network's routing, which is what makes it the answer
  # when that routing is the thing under suspicion. It costs about 50 bytes a
  # packet and the MTU that goes with them.
  #
  # Switching is a maintenance operation, not a toggle: every Cilium agent
  # restarts and pod traffic breaks while they do. It is one value and no Talos
  # apply, because the gateway route is installed in both modes — under tunnel
  # it is simply unused, since Cilium's own per-node routes are more specific.
  routingMode: native

talos:
  # Bump this and re-run `task cluster:image-bake`. The image selector keys off
  # the version label, so a bump without a bake fails at plan time with "no
  # available Talos snapshot matches the selector".
  #
  # Held at 1.13 on purpose, not out of caution: pulumi-talos 0.8.1 bridges
  # terraform-provider-talos 0.11.0, which embeds Talos machinery v1.13.0. It
  # is the machinery that GENERATES the machine configuration, so a 1.14 pin
  # would boot 1.14 nodes with a configuration built by a 1.13 generator.
  # Checked: Talos v1.14.0 is out, pulumi-talos v0.8.1 is still
  # the newest, and terraform-provider-talos v0.11.0 — the one it bridges —
  # requires pkg/machinery v1.13.0. So 1.14 is not a caution, it is blocked.
  # Move this when a newer pulumi-talos carries 1.14 machinery, then install
  # the matching talosctl and re-run `task cluster:config-check`.
  version: v1.13.10

  # x86 or arm, and it decides three things at once: which image the factory
  # builds (amd64 or arm64), which server types can boot it, and which types
  # the fields below default to when left out. Switching it means re-running
  # `task cluster:image-bake` — the snapshot is one architecture, and the bake
  # now scopes its "already present?" check to this value rather than finding
  # the other architecture's snapshot and doing nothing.
  #
  # arm is supported end to end, and it is NOT the cheaper option here. From
  # the API in hel1, monthly gross:
  #
  #   cx23    2 cores    4 GB    x86    5.49
  #   cax11   2 cores    4 GB    arm    5.99
  #   cx33    4 cores    8 GB    x86    8.49
  #   cax21   4 cores    8 GB    arm   10.49
  #
  # Every image this platform installs — Cilium, both hcloud drivers,
  # cert-manager, external-secrets, metrics-server, Traefik, Argo CD — publishes
  # linux/arm64 at the versions pinned in pkg/charts, checked. So
  # the reason to pick arm is wanting arm nodes, not saving money.
  architecture: x86

  # Override the snapshot selector. Empty derives
  # "os=talos,talos-version=<version>" — the labels `task cluster:image-bake`
  # writes — which is what you want unless a snapshot was baked by hand.
  #
  # Note what is deliberately absent: the architecture. Hetzner records it as a
  # field rather than a label, and both the bake and the lookup filter on that
  # field, so putting it in the selector too would store the same fact twice.
  imageSelector: ""

kubernetes:
  # Pinned, not left to Talos. An empty value would take whatever the
  # configured Talos release ships, so a Talos patch bump could move Kubernetes
  # a whole minor with no diff and no decision — which is how this cluster
  # first came up on v1.36.0, new enough that kube-apiserver had dropped a flag
  # the machine config was passing.
  #
  # v1.36 is the minor Talos v1.13.10 defaults to, so this is the supported
  # pairing. Bump it together with talos.version above, deliberately.
  version: v1.36.4

controlPlane:
  # Three, and three is the smallest number that means anything. Validation
  # refuses an even count — etcd needs a quorum, and a second member tolerates
  # no more failures than one while costing twice as much:
  #
  #   controlPlane.count is 2: an even count costs more without tolerating more
  #   failures — use 1 or 3
  #
  # The three land on separate physical hosts: pkg/hetzner puts the control
  # plane in a spread placement group, which is what turns three etcd members
  # into three failure domains rather than three processes on one machine.
  count: 3
  # The cheapest type that can hold a control plane, read from the API rather
  # than remembered — hel1, monthly, gross:
  #
  #   cpx11   2 cores    2 GB    5.49    the cheapest, and too little
  #   cx23    2 cores    4 GB    5.49    the same price, twice the memory
  #   cax11   2 cores    4 GB    5.99    the same machine on arm, 50c more
  #
  # cx23 rather than cpx11 because the price is identical and 2 GB is not a
  # control plane: kube-apiserver alone measured 725 Mi on this platform, and
  # etcd, the controller manager, the scheduler and the Cilium agent all sit
  # beside it on every member.
  #
  # Leaving this out takes the default for talos.architecture above — cx23 on
  # x86, cax11 on arm. Naming a type from the wrong architecture is refused at
  # plan time rather than at boot: "cx23 is x86, but the baked Talos image is
  # arm — a mismatched type will not boot".
  #
  # Measured before choosing: the whole platform uses 2 847 Mi across 34 pods.
  # Spread over three members, each carries the control plane — about 1.9 GB —
  # plus a third of the singletons, so roughly 2.4 GB of the 4 GB.
  serverType: cx23
  # Required once count > 1 and ignored otherwise: a single control plane has
  # nothing to fail over between, so a load balancer would only cost money.
  #
  # It is also what makes a node replaceable. The endpoint signed into every
  # certificate is the load balancer's rather than a server's, so a member can
  # be destroyed and recreated without reissuing anything.
  #
  # Hetzner offers three, and this one fronts one service — the Kubernetes API
  # on tcp/6443 — for as many targets as there are control planes:
  #
  #   lb11   10 000 connections    5 services    25 targets    7.49 EUR/month
  #   lb21   20 000 connections   15 services    75 targets   21.49 EUR/month
  #   lb31   40 000 connections   30 services   150 targets   42.99 EUR/month
  #
  # lb11 is the size for this: three targets and one service against limits of
  # twenty-five and five. The reason to move up is throughput to the API, not
  # availability — and the ingress load balancer is a separate one, created by
  # the CCM from Traefik's Service and sized by ingress:loadBalancerType.
  apiLoadBalancerType: lb11

# No worker pool, which is the cheaper half of this shape rather than an
# omission. Without one the control-plane taint is dropped automatically and
# the platform runs on the three members; adding a pool brings the taint back,
# so workloads move off them and the bill grows by the pool.
#
# 3 x cx23 + lb11 is 23.96 EUR/month. Adding 3 x cx33 workers would make it
# 49.43, for a platform that measured 2 847 Mi.
workerPools: []

# ─── A single node, for a cluster meant to be thrown away ────────────────────
#
# Cheaper and strictly worse: it survives no node failure, and its API endpoint
# is the server's own address, so replacing that server reissues every
# certificate that named it. 15.99 EUR/month against 23.96.
#
# cx43 rather than cx23 here because one node carries everything: Argo CD,
# ingress, cert-manager and the CSI driver together ask for more than 4 GB, and
# a node that comes up and then leaves half the platform Pending validates
# nothing. Three nodes share that work; one does not.
#
# Replace the two blocks above with the two below to use it. Everything below
# this line is yaml and nothing else, so stripping the leading "# " is the
# whole edit — held to that by
# TestExampleTopology_TheCommentedAlternativeIsValid, which does exactly that
# and loads the result.
#
# Uncomment from here:
# controlPlane:
#   count: 1
#   serverType: cx43
#   apiLoadBalancerType: ""
#
# workerPools: []

# ─── Workers of their own, for when the platform outgrows three nodes ────────
#
# Nothing to implement: worker pools are built already — pkg/hetzner/workerpool
# creates them, validation refuses duplicate pool names and a node subnet too
# small for the pools asked for, and the server type defaults from
# talos.architecture like the control plane's does. This block is the
# configuration, and it is commented because the cluster does not need it yet.
#
# WHAT CHANGES THE MOMENT A POOL EXISTS, and it is not only the bill: the
# control-plane taint comes back. It is dropped today precisely because
# workerPools is empty and the control plane is the only place a pod can run —
# pkg/hetzner passes allowSchedulingOnControlPlanes on exactly that condition.
# Add a pool and every platform workload moves off the control plane, which is
# the isolation this shape does not have: a container that leaks today shares a
# node with etcd and kube-apiserver.
#
# 40.94 EUR/month against 23.96 — read from the API in hel1:
#
#   3 x cx23   16.47   the control plane, unchanged
#   lb11        7.49   the API load balancer, unchanged
#   2 x cx33   16.98   the pool
#
# Each pool owns a fixed 40-address slice of network.nodeSubnet, at a
# non-overlapping offset, so adding a pool never renumbers an existing one —
# renumbering would replace every node in it. A /24 therefore holds the control
# plane plus five pools, and validation says so rather than letting apply find
# out.
#
# labels and taints are per-pool, which is the point of a pool rather than a
# node count: a GPU pool and a general pool differ in shape while sharing one
# control plane.
#
# Uncomment from here:
# controlPlane:
#   count: 3
#   serverType: cx23
#   apiLoadBalancerType: lb11
#
# workerPools:
#   - name: general
#     count: 2
#     serverType: cx33
