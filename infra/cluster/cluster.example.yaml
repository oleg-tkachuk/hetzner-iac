# yaml-language-server: $schema=./cluster.schema.json
#
# The template. Copy it to cluster.<stack>.yaml — the file infra/cluster loads
# — and edit adminCIDRs. This one is committed and the stack files are not:
# adminCIDRs is an operator's own egress address, and this repository is
# public.
#
# The cost of that: CI has no topology, so it cannot preview the cluster tier.
# Check its drift by hand with `task cluster:plan stack=<stack>`.
#
#   cp cluster.example.yaml cluster.dev.yaml
#
# This IS the per-environment description of a cluster. Everything that shapes
# one is here and nowhere else: three switches used to live in `pulumi config`,
# which left somebody's shell history as the only record of them. Stack config
# now holds exactly one thing, the Hetzner token, because a token must not be
# in git.
#
# Sparse by design — anything omitted keeps the default in pkg/hetzner, so this
# file never restates a default and a default can change in one place. The
# modeline above gives an editor the field names, types and defaults;
# pkg/hetzner validates the same file at plan time and reports every problem at
# once, including the ones a schema cannot express.
apiVersion: hetzner-iac/v1
kind: Cluster

metadata:
  name: platform-dev

placement:
  location: hel1
  # Derived from the location when omitted; stated here only because a
  # location change must be a deliberate two-line edit.
  networkZone: eu-central

network:
  # CIDRs allowed to reach tcp/6443 (kube-apiserver) and tcp/50000 (Talos API).
  #
  # MUST include the host running `task cluster:*` — Talos machine
  # configuration is applied over the Talos API from there, and a host outside
  # this list hangs on apply with the port filtered rather than failing.
  #
  # There is no default: an empty list is refused rather than widened to
  # 0.0.0.0/0. Replace the placeholder with your egress CIDR.
  adminCIDRs:
    - 203.0.113.4/32

  # Keep a routable address on every node. Defaults to TRUE, and stated here
  # because it decides which address Talos and the kubeconfig target: machine
  # configuration is pushed over the Talos API, so an apply from anywhere but
  # inside the private network needs one.
  publicIPv4: true

  # Open ping from adminCIDRs. Off unless something is being debugged.
  allowICMP: false

talos:
  # Bump this and re-run `task cluster:image-bake`. The image selector keys off
  # the version label, so a bump without a bake fails at plan time with "no
  # available Talos snapshot matches the selector".
  #
  # Held at 1.13 on purpose, not out of caution: pulumi-talos 0.8.1 bridges
  # terraform-provider-talos 0.11.0, which embeds Talos machinery v1.13.0. It
  # is the machinery that GENERATES the machine configuration, so a 1.14 pin
  # would boot 1.14 nodes with a configuration built by a 1.13 generator.
  # Checked on 2026-09-11: Talos v1.14.0 is out, pulumi-talos v0.8.1 is still
  # the newest, and terraform-provider-talos v0.11.0 — the one it bridges —
  # requires pkg/machinery v1.13.0. So 1.14 is not a caution, it is blocked.
  # Move this when a newer pulumi-talos carries 1.14 machinery, then install
  # the matching talosctl and re-run `task cluster:config-check`.
  version: v1.13.10
  architecture: x86

  # Override the snapshot selector. Empty derives
  # "os=talos,talos-version=<version>" — the labels `task cluster:image-bake`
  # writes — which is what you want unless a snapshot was baked by hand.
  imageSelector: ""

kubernetes:
  # Pinned, not left to Talos. An empty value would take whatever the
  # configured Talos release ships, so a Talos patch bump could move Kubernetes
  # a whole minor with no diff and no decision — which is how this cluster
  # first came up on v1.36.0, new enough that kube-apiserver had dropped a flag
  # the machine config was passing.
  #
  # v1.36 is the minor Talos v1.13.10 defaults to, so this is the supported
  # pairing. Bump it together with talos.version above, deliberately.
  version: v1.36.4

controlPlane:
  # Three for etcd quorum. One is a development shape: it survives no node
  # failure and its API endpoint moves if the node is replaced — and with no
  # worker pool below, the whole platform runs on it.
  count: 3
  serverType: cx23
  # Required once count > 1 and ignored otherwise: a single control plane has
  # nothing to fail over between, so a load balancer would only cost money.
  apiLoadBalancerType: lb11

workerPools:
  - name: worker
    count: 3
    serverType: cx33
