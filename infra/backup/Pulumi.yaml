name: backup
# The oldest CLI the tasks work with: --ignore-protect landed in 3.256.0.
requiredPulumiVersion: ">=3.256.0"
runtime:
  name: go
  options:
    # Stable build path so repeated previews skip the link step; content
    # hashing still rebuilds when sources change.
    buildTarget: ../../.cache/pulumi-bin/backup
# Last, and the only layer that creates nothing in Kubernetes. A Storage Box in
# the cluster tier would be destroyed by `task cluster:destroy`, which is the
# one thing a backup destination must survive — so it is here, with delete
# protection on the box itself.
description: |
  The destination the cluster's recovery point lives in: a Hetzner Storage Box,
  one subaccount confined to a directory, and generated passwords for both.

# State backend. Declared here rather than left to `pulumi login`, so the
# backend is a property of the repository and not of whoever runs it.
#
# Pulumi Cloud is the default: it coordinates concurrent updates, keeps update
# history, and manages the secrets encryption key, none of which a DIY backend
# does for you.
#
# To keep state in your own S3 bucket instead — one vendor, one bill — point
# this url at it. That also changes how stack secrets are encrypted — with a
# passphrase you hold rather than a key the backend holds: see
# docs/configuration.md, "Keeping state in your own S3 bucket".
backend:
  url: https://api.pulumi.com

config:
  backup:clusterStackRef:
    default: ""
    description: |
      Fully qualified stack of the cluster tier — <org>/hetzner-cluster/<stack>.
      This layer reads the cluster's name and location from it, and nothing
      else: it never talks to the cluster, and never uses its token.

  # Set with `task backup:token stack=<stack>`, never in a committed file.
  #
  # Declared without `secret: true` for the reason every other credential here
  # is: a secret with an empty default arrives set-but-empty, so a presence
  # check passes and what reaches the provider is the empty string.
  backup:hcloudToken:
    default: ""
    description: |
      Hetzner API token, read+write, issued in a project of its own — not the
      cluster's. The program refuses a token that can see the cluster's
      servers: a Storage Box in the cluster's project can be deleted with the
      cluster's token, which every layer and a kube-system Secret hold.

  backup:storageBoxType:
    default: ""
    description: |
      Hetzner Storage Box type. Empty means bx11 — 1 TB, 3.20 EUR a month gross
      in hel1. An etcd snapshot of this cluster is a few megabytes, so the
      smallest type is three orders of magnitude more than it needs; the reason
      to change this is to keep something else here too.
