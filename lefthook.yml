# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
# Git hooks.
#
# The shape: cheap, staged-scoped checks on commit; anything slow or repo-wide
# on push; the commit-message gate last. Bypass in an emergency with
# `git commit -n`, then fix what it would have caught.
#
# Install with `lefthook install`.

# Fail loudly when the hooks are not actually installed, rather than passing
# every commit silently because nobody ran `lefthook install`.
assert_lefthook_installed: true

colors: true

output:
  # Drop lefthook's own banners; keep command output so a failure still
  # arrives with its stderr intact.
  - execution
  - execution_info
  - execution_out
  - failure

pre-commit:
  # Serial. Parallel jobs interleave their output, so a failure arrives
  # shredded across the other jobs' lines and you re-run them one at a time to
  # find out which one spoke. Everything here is sub-second.
  parallel: false
  jobs:
    # Cluster credentials. Both are gitignored, but `git add -f` and a
    # differently-named copy both get past that — and a kubeconfig in a public
    # repository is cluster-admin handed to anyone who clones it. This checks
    # CONTENT, so a rename does not evade it.
    - name: forbid-cluster-credentials
      tags: [security]
      run: |
        set -euo pipefail
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            *_test.go|*/testdata/*) continue ;;
          esac
          # kubeconfig: the embedded client key is the giveaway, and
          # "kind: Config" plus a clusters list covers the token-auth form.
          # grep's stderr is dropped on purpose and only here: these run over
          # whatever is staged, including binaries and deleted paths, where
          # grep complains about the file rather than about a failure to
          # search. The exit status is what this reads, and it is not hidden.
          if grep -qE '^[[:space:]]*client-key-data:' "$f" 2>/dev/null \
             || { grep -qE '^kind:[[:space:]]*Config[[:space:]]*$' "$f" 2>/dev/null \
                  && grep -qE '^clusters:' "$f" 2>/dev/null; }; then
            printf '%s\n' "ERROR: $f looks like a kubeconfig — cluster-admin must never be committed" >&2
            exit 1
          fi
          # talosconfig: a contexts map holding a client certificate. Talos
          # credentials are MORE powerful than the kubeconfig — they can reset
          # nodes and read etcd directly.
          if grep -qE '^contexts:' "$f" 2>/dev/null \
             && grep -qE '^[[:space:]]+crt:' "$f" 2>/dev/null; then
            printf '%s\n' "ERROR: $f looks like a talosconfig — it can reset nodes and read etcd" >&2
            exit 1
          fi
          # The Talos secrets bundle, which cluster:secrets-export produces
          # and which the two patterns above do not match — measured, and so
          # does gitleaks, which finds nothing in one. It is the cluster's
          # root of trust: every certificate descends from it, and the
          # secretbox key decrypts every Secret in an etcd snapshot.
          #
          # The secretbox key is the signal because it also appears in a raw
          # machine configuration, which is equally unfit to commit. No
          # tracked file carries either string.
          #
          # The bracketed letter is deliberate and must stay: without it this
          # file matches its own pattern and refuses every commit that
          # touches it. The same trick as `ps | grep '[s]shd'`. It changes
          # nothing about what is matched in any other file.
          if grep -q 'secretbox[E]ncryptionSecret' "$f" 2>/dev/null \
             || grep -q '"machine[S]ecrets"' "$f" 2>/dev/null; then
            printf '%s\n' "ERROR: $f carries Talos cluster secrets — every certificate in the cluster descends from them" >&2
            exit 1
          fi
        done

    # Compiled artefacts bloat every clone forever and no review can read them.
    # git's own binary detection, not `file -b | grep ELF|Mach-O`, which is
    # what this used to be. That pattern knew two formats — a PNG, a gzip, an
    # ar archive and a wasm module all went through it — and if `file`
    # produced no output, grep answered "no match" and the binary passed
    # silently. numstat prints `-` for both counts on anything git calls
    # binary, whatever the format.
    #
    # To allow a file that genuinely belongs here, add its path to the awk
    # invocation as -v allow=<path>. Nothing needs it today: the repository
    # tracks no binary files.
    # Branch protection refuses the push, but by then the commit exists and
    # has to be moved. This refuses it four steps earlier.
    #
    # Asked for after four commits landed on main in one session: the pattern
    # each time was `git switch main` to pull, then editing without switching
    # back. `LEFTHOOK=0 git commit` is the deliberate override, the same one
    # every other gate here honours.
    - name: forbid-main
      tags: [hygiene]
      run: |
        branch="$(git symbolic-ref --short HEAD 2>/dev/null || printf '%s' DETACHED)"
        if [ "$branch" = "main" ]; then
          printf '%s\n' "ERROR: refusing to commit on main. Branch first:" >&2
          printf '%s\n' "  git switch -c <type>/<what-changed>" >&2
          printf '%s\n' "Already committed? git switch -c <branch> && git switch main && git reset --hard origin/main" >&2
          exit 1
        fi

    - name: forbid-binaries
      tags: [hygiene]
      run: git diff --cached --numstat | awk -f tools/lines/main.awk -v op=staged-binaries

    # A secret reaches the remote once and is burned; this is the only cheap
    # moment to catch it. A scan that skips itself when the tool is missing is
    # not a scan, so this says what to install rather than waving the commit on.
    - name: gitleaks
      tags: [security]
      run: |
        set -euo pipefail
        command -v gitleaks >/dev/null 2>&1 || {
          printf '%s\n' "ERROR: gitleaks is not installed — brew install gitleaks" >&2
          exit 1
        }
        gitleaks protect --staged --redact --verbose=true

    # The Taskfile's TASKLIB is swapped to a sibling checkout when working on
    # the shared library, and that swap has been committed once already — a
    # clone of this repository has no ../taskfiles, so every task breaks for
    # everyone but the author.
    - name: tasklib-is-remote
      tags: [tasks]
      glob: "Taskfile.yaml"
      run: |
        set -euo pipefail
        if grep -qE "^  TASKLIB: '\.\./" Taskfile.yaml; then
          printf '%s\n' "ERROR: Taskfile.yaml points TASKLIB at a local checkout." >&2
          printf '%s\n' "That works only on this machine. Restore the git URL before committing." >&2
          exit 1
        fi

    - name: gofmt
      tags: [go, format]
      glob: "*.go"
      run: |
        set -euo pipefail
        unformatted="$(gofmt -l {staged_files})"
        if [ -n "$unformatted" ]; then
          printf '%s\n' "ERROR: not gofmt-clean:" >&2
          printf '%s\n' "$unformatted" >&2
          printf '%s\n' "Run: task fmt" >&2
          exit 1
        fi

    # The committed cluster description must be loadable. A topology that only
    # fails at `pulumi up` has already cost an operator a round trip through
    # credentials and a preview.
    - name: cluster-topology
      tags: [config]
      glob: "infra/cluster/cluster.*.yaml"
      run: go run ./tools/topology infra/cluster

    # Exact chart versions, no floating tags.
    - name: chart-pins
      tags: [config]
      glob: "pkg/charts/*.go"
      run: go test -count=1 ./pkg/charts/

    # The workflows are the one part of this repository that runs with a token.
    - name: zizmor
      tags: [ci, security]
      glob: ".github/workflows/*.yaml"
      run: |
        set -euo pipefail
        command -v zizmor >/dev/null 2>&1 || {
          printf '%s\n' "SKIP: zizmor not installed — pipx install zizmor (CI still checks)" >&2
          exit 0
        }
        zizmor --config .github/zizmor.yml --persona=regular --format=plain .github/workflows/

# Last gate before the change leaves the machine. These are the slow ones: a
# push is rarer than a commit, and this is the point where being wrong starts
# to cost someone else time.
pre-push:
  parallel: false
  jobs:
    - name: test
      tags: [go, test]
      run: go test -count=1 ./...

    - name: lint
      tags: [go, lint]
      run: |
        set -euo pipefail
        command -v golangci-lint >/dev/null 2>&1 || {
          printf '%s\n' "ERROR: golangci-lint is not installed — brew install golangci-lint" >&2
          exit 1
        }
        golangci-lint run ./...

    - name: vet
      tags: [go]
      run: go vet ./...

commit-msg:
  parallel: false
  jobs:
    # Conventional Commits are load-bearing here, not cosmetic: semantic-release
    # derives the next version and the release notes from the commit type, so a
    # non-conforming subject silently produces no release.
    - name: conventional-commits
      run: |
        set -euo pipefail
        # {1} is lefthook's template for the hook's first argument — the path to
        # the message file. A bare $1 is NOT set inside a `run:` block, so the
        # fallback below would otherwise check the wrong file.
        file="{1}"
        # Outside a repository `git rev-parse` fails and says why on stderr;
        # here the fallback is a guess at a path that is then tested with -f,
        # so its complaint is noise. An empty result is handled below.
        [ -f "$file" ] || file="$(git rev-parse --git-path COMMIT_EDITMSG 2>/dev/null || true)"
        [ -f "$file" ] || exit 0

        first_line="$(head -n1 "$file" | tr -d '\r')"
        # Merges and reverts are generated by git, not written by a person.
        printf '%s\n' "$first_line" | grep -Eq '^(Merge|Revert)\b' && exit 0

        cc_re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
        if ! printf '%s\n' "$first_line" | grep -Eq "$cc_re"; then
          printf '%s\n' "ERROR: invalid commit message format (Conventional Commits required)." >&2
          printf '%s\n' "Format: <type>(<scope>)!: <subject>" >&2
          printf '%s\n' "See:    https://www.conventionalcommits.org/en/v1.0.0/" >&2
          exit 1
        fi
