# Minimal values that make the Loki chart render the topology layers/60-observability
# deploys. The chart defaults to SimpleScalable, which produces a different set
# of workloads entirely.
#
# This mirrors LokiValues() in the layer. It is a second copy — accepted
# deliberately, because the layer's values are pulumi.Map inputs that cannot be
# resolved outside a Pulumi run, and the failure mode of a divergence here is a
# loud MISS in this check rather than a silent wrong deployment. The layer's own
# tests pin the same settings.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
singleBinary:
  replicas: 1
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
